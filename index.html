<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo con Videos 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #ms3-environment, #vr-room-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        #vr-room-container { z-index: 5; opacity: 0; pointer-events: none; transition: opacity 1s ease; cursor: grab; }
        #vr-room-container:active { cursor: grabbing; }
        
        #instruction { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 3; 
            font-size: 1.1rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; letter-spacing: 1px;
        }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
        }
        #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        /* Botón Giroscopio en la sala VR */
        #gyro-btn {
            position: absolute; top: 20px; right: 165px; z-index: 20;
            padding: 12px 18px; background: rgba(0,0,0,0.8); color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
            display: none;
        }
        #gyro-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        #gyro-btn.active { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff, inset 0 0 10px #000; }

        /* Botón para volver al menú principal desde la sala VR */
        #back-to-menu-btn {
            position: absolute; top: 20px; left: 20px; z-index: 20;
            padding: 12px 20px; background: rgba(0,0,0,0.8); color: #ff00ff;
            border: 2px solid #ff00ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 10px #ff00ff;
            cursor: pointer; transition: all 0.3s;
            display: none;
        }
        #back-to-menu-btn:hover { background: #ff00ff; color: #000; box-shadow: 0 0 20px #ff00ff; }

        /* Contenedor de los botones neón planos flotantes */
        #multiverse-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 0.5s;
            width: 90%;
            max-width: 380px;
            align-items: center;
        }

        .neon-flat-btn {
            background: rgba(10, 10, 26, 0.85);
            color: #0ff;
            border: 2px solid #0ff;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.15);
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
            width: 100%;
            text-align: center;
            animation: floatBtn 3s ease-in-out infinite;
        }

        .neon-flat-btn:nth-child(2) {
            animation-delay: 0.5s;
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4), inset 0 0 10px rgba(255, 0, 255, 0.15);
            text-shadow: 0 0 8px rgba(255, 0, 255, 0.8);
        }

        .neon-flat-btn:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes floatBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .neon-flat-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 25px #0ff, 0 0 50px #0ff;
            text-shadow: none;
            animation: none;
        }

        .neon-flat-btn:nth-child(2):hover {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 25px #ff00ff, 0 0 50px #ff00ff;
            text-shadow: none;
            animation: none;
        }

        /* Modal para reproducción de video interactivo */
        #video-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #video-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            position: relative;
            width: 85%;
            max-width: 900px;
            background: #0a0a16;
            border: 2px solid #0ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            padding: 20px;
        }
        .close-modal {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff00ff;
            color: #fff;
            border: 2px solid #fff;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 10px #ff00ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-modal:hover { background: #fff; color: #ff00ff; }
        
        video {
            width: 100%;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        /* Indicador táctil 360 */
        #touch-instruction {
            position: absolute; bottom: 20px; width: 100%; text-align: center; color: #0ff; z-index: 20;
            font-size: 0.9rem; pointer-events: none; text-shadow: 0 0 8px #0ff; display: none; font-weight: 500;
        }
    </style>
</head>
<body>

    <button id="vr-btn" style="display: none;">Ver en VR</button>
    <button id="gyro-btn" onclick="toggleGyroscope()">Giroscopio: OFF</button>
    <button id="back-to-menu-btn" onclick="returnToMultiverse()">← Volver</button>
    <div id="instruction">Presiona la esfera para ingresar al multiverso MS3</div>
    <div id="touch-instruction">💡 Arrastra con el dedo o mouse para girar en 360° y presiona una pantalla</div>
    
    <!-- Menú flotante plano con diseño Neón -->
    <div id="multiverse-menu">
        <button class="neon-flat-btn" onclick="enterVRProgramsRoom()">Ver Programas VR</button>
        <button class="neon-flat-btn" onclick="openVideo('2d')">Ver Programas 2D</button>
        <button class="neon-flat-btn" onclick="openVideo('live')">Ver en Vivo</button>
    </div>

    <!-- Modal de Video Estándar -->
    <div id="video-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeVideo()">×</button>
            <h3 id="modal-title" style="color: #0ff; text-align: center; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #0ff;">Reproductor MS3</h3>
            <video id="multiverse-video" controls autoplay>
                <source id="video-source" src="" type="video/mp4">
                Tu navegador no soporta videos HTML5.
            </video>
        </div>
    </div>

    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>
    <div id="vr-room-container"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const vrRoomContainer = document.getElementById('vr-room-container');
        const vrBtn = document.getElementById('vr-btn');
        const gyroBtn = document.getElementById('gyro-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn');
        const multiverseMenu = document.getElementById('multiverse-menu');
        const videoModal = document.getElementById('video-modal');
        const multiverseVideo = document.getElementById('multiverse-video');
        const videoSource = document.getElementById('video-source');
        const modalTitle = document.getElementById('modal-title');
        const touchInstruction = document.getElementById('touch-instruction');

        let isSystemActive = false;
        let isInVRRoom = false;
        let isVRMode = false;
        let isGyroActive = false;
        let internalScene, internalCamera, internalRenderer, stars;
        let vrRoomScene, vrRoomCamera, vrRoomRenderer, vrRoomStars;
        let targetQuaternion = new THREE.Quaternion();

        // Control de rotación manual 360 (Mouse / Touch)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraLon = 0, cameraLat = 0;
        let targetLon = 0, targetLat = 0;

        const videoLibrary = {
            'vr1': { title: 'Experiencia Inmersiva VR 1', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            'vr2': { title: 'Experiencia Inmersiva VR 2', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            'vr3': { title: 'Experiencia Inmersiva VR 3', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' },
            'vr4': { title: 'Experiencia Inmersiva VR 4', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
            '2d': { title: 'Programas 2D - Catálogo MS3', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            'live': { title: 'Transmisión en Vivo - Canal MS3', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
        };

        function openVideo(type) {
            const data = videoLibrary[type];
            if (data) {
                modalTitle.innerText = data.title;
                videoSource.src = data.url;
                multiverseVideo.load();
                videoModal.classList.add('active');
                multiverseVideo.play().catch(e => console.log("Reproducción automática bloqueada:", e));
            }
        }

        function closeVideo() {
            multiverseVideo.pause();
            videoSource.src = "";
            videoModal.classList.remove('active');
        }

        // Escena Principal 1: Esfera inicial MS3
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff00ff, 4, 60);
        pointLight1.position.set(6, 6, 6);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00ffff, 4, 60);
        pointLight2.position.set(-6, -6, 6);
        scene.add(pointLight2);

        const planetGroup = new THREE.Group();
        const planetGeometry = new THREE.IcosahedronGeometry(1.4, 4); 
        const planetMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9
        });
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.y = -1.5;
        planetGroup.add(planet);

        const textGroup = new THREE.Group();
        textGroup.position.y = 0.8;

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', {
                font: font, size: 1.2, height: 0.4, curveSegments: 12,
                bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelOffset: 0, bevelSegments: 5
            });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const mirrorMaterial = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0, reflectivity: 1.0
            });
            const textMesh = new THREE.Mesh(textGeo, mirrorMaterial);
            textMesh.position.x = centerOffset;
            textGroup.add(textMesh);

            const neonBorderMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.7 });
            const borderMesh = new THREE.Mesh(textGeo, neonBorderMaterial);
            borderMesh.position.x = centerOffset;
            borderMesh.scale.set(1.02, 1.02, 1.02);
            textGroup.add(borderMesh);
        });

        scene.add(planetGroup);
        scene.add(textGroup);
        camera.position.z = 5;

        // Entrar a la sección del Multiverso base
        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15 });
            const starPositions = new Float32Array(5000);
            for(let i = 0; i < 5000; i++) {
                let val = (Math.random() - 0.5) * 120;
                starPositions[i] = isNaN(val) ? 0 : val;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            vrBtn.style.display = 'block';
            multiverseMenu.style.opacity = '1';
            multiverseMenu.style.pointerEvents = 'auto';
        }

        // Nueva Sala 360° con Pantallas VR alrededor del usuario
        let interactiveScreens = [];
        function initVRProgramsRoom() {
            isInVRRoom = true;
            multiverseMenu.style.opacity = '0';
            multiverseMenu.style.pointerEvents = 'none';
            vrBtn.style.display = 'none';
            gyroBtn.style.display = 'block';
            backToMenuBtn.style.display = 'block';
            touchInstruction.style.display = 'block';
            envContainer.style.opacity = '0';

            vrRoomScene = new THREE.Scene();
            vrRoomCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            vrRoomRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            vrRoomRenderer.setSize(window.innerWidth, window.innerHeight);
            vrRoomRenderer.setClearColor(0x000000, 0);
            vrRoomContainer.appendChild(vrRoomRenderer.domElement);
            vrRoomContainer.style.opacity = '1';
            vrRoomContainer.style.pointerEvents = 'auto';

            const starGeo = new THREE.BufferGeometry();
            const starMat = new THREE.PointsMaterial({ color: 0xff00ff, size: 0.2 });
            const positions = new Float32Array(6000);
            for(let i = 0; i < 6000; i++) {
                let val = (Math.random() - 0.5) * 150;
                positions[i] = isNaN(val) ? 0 : val;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            vrRoomStars = new THREE.Points(starGeo, starMat);
            vrRoomScene.add(vrRoomStars);

            const ambientLightRoom = new THREE.AmbientLight(0xffffff, 2.0);
            vrRoomScene.add(ambientLightRoom);

            // Crear pantallas 360 alrededor
            const screenData = [
                { title: 'VR 1', key: 'vr1', angle: 0, color: 0x00ffff },
                { title: 'VR 2', key: 'vr2', angle: Math.PI / 2, color: 0xff00ff },
                { title: 'VR 3', key: 'vr3', angle: Math.PI, color: 0x00ff88 },
                { title: 'VR 4', key: 'vr4', angle: (3 * Math.PI) / 2, color: 0xffff00 }
            ];

            interactiveScreens = [];
            screenData.forEach(data => {
                const screenGroup = new THREE.Group();
                const radius = 6;
                screenGroup.position.x = Math.sin(data.angle) * radius;
                screenGroup.position.z = Math.cos(data.angle) * radius;
                screenGroup.position.y = 0.5;
                screenGroup.lookAt(0, 0.5, 0);

                // Plano de pantalla
                const planeGeo = new THREE.PlaneGeometry(3.5, 2.2);
                const planeMat = new THREE.MeshBasicMaterial({ color: 0x111122, wireframe: false });
                const plane = new THREE.Mesh(planeGeo, planeMat);
                screenGroup.add(plane);

                // Marco Neón
                const borderGeo = new THREE.EdgesGeometry(planeGeo);
                const borderMat = new THREE.LineBasicMaterial({ color: data.color, linewidth: 3 });
                const border = new THREE.LineSegments(borderGeo, borderMat);
                screenGroup.add(border);

                // Texto flotante de la pantalla
                const loaderFont = new THREE.FontLoader();
                loaderFont.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                    const textGeo = new THREE.TextGeometry(data.title, {
                        font: font, size: 0.35, height: 0.08
                    });
                    textGeo.computeBoundingBox();
                    const textOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
                    const textMat = new THREE.MeshBasicMaterial({ color: data.color });
                    const textMesh = new THREE.Mesh(textGeo, textMat);
                    textMesh.position.set(textOffset, 1.3, 0);
                    screenGroup.add(textMesh);
                });

                plane.userData = { videoKey: data.key };
                interactiveScreens.push(plane);
                vrRoomScene.add(screenGroup);
            });
        }

        function returnToMultiverse() {
            isInVRRoom = false;
            vrRoomContainer.style.opacity = '0';
            vrRoomContainer.style.pointerEvents = 'none';
            backToMenuBtn.style.display = 'none';
            gyroBtn.style.display = 'none';
            touchInstruction.style.display = 'none';
            vrBtn.style.display = 'block';
            multiverseMenu.style.opacity = '1';
            multiverseMenu.style.pointerEvents = 'auto';
            envContainer.style.opacity = '1';
            
            if (vrRoomContainer.firstChild) {
                vrRoomContainer.removeChild(vrRoomContainer.firstChild);
            }
        }

        function toggleGyroscope() {
            isGyroActive = !isGyroActive;
            if (isGyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            gyroBtn.innerText = "Giroscopio: ON";
                            gyroBtn.classList.add('active');
                        } else {
                            alert("Permiso de giroscopio denegado");
                            isGyroActive = false;
                        }
                    }).catch(() => {
                        isGyroActive = false;
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    gyroBtn.innerText = "Giroscopio: ON";
                    gyroBtn.classList.add('active');
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                gyroBtn.innerText = "Giroscopio: OFF";
                gyroBtn.classList.remove('active');
            }
        }

        // Listeners de arrastre táctil / mouse para la Sala VR 360
        window.addEventListener('mousedown', (e) => {
            if (!isInVRRoom) return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isInVRRoom || !isDragging || isGyroActive) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetLon -= deltaX * 0.3;
            targetLat += deltaY * 0.3;
            targetLat = Math.max(-85, Math.min(85, targetLat));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('touchstart', (e) => {
            if (!isInVRRoom || e.touches.length !== 1) return;
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isInVRRoom || !isDragging || isGyroActive || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            targetLon -= deltaX * 0.3;
            targetLat += deltaY * 0.3;
            targetLat = Math.max(-85, Math.min(85, targetLat));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Raycaster para detectar clics en pantallas 360
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (!isInVRRoom) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, vrRoomCamera);
            const intersects = raycaster.intersectObjects(interactiveScreens);
            if (intersects.length > 0) {
                const videoKey = intersects[0].object.userData.videoKey;
                if (videoKey) openVideo(videoKey);
            }
        });

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const Euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(Euler);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                planet.rotation.y += 0.008;
                planet.rotation.x += 0.003;
                textGroup.rotation.y += 0.006;
                renderer.render(scene, camera);
            } else {
                if (isInVRRoom) {
                    if (vrRoomStars) vrRoomStars.rotation.y += 0.0005;
                    if (isGyroActive) {
                        vrRoomCamera.quaternion.slerp(targetQuaternion, 0.1);
                    } else {
                        cameraLon += (targetLon - cameraLon) * 0.1;
                        cameraLat += (targetLat - cameraLat) * 0.1;
                        const phi = THREE.MathUtils.degToRad(90 - cameraLat);
                        const theta = THREE.MathUtils.degToRad(cameraLon);
                        const targetLookAt = new THREE.Vector3(
                            Math.sin(phi) * Math.sin(theta),
                            Math.cos(phi),
                            Math.sin(phi) * Math.cos(theta)
                        ).add(vrRoomCamera.position);
                        vrRoomCamera.lookAt(targetLookAt);
                    }
                    vrRoomRenderer.render(vrRoomScene, vrRoomCamera);
                } else {
                    if (stars) stars.rotation.y += 0.0005;
                    internalCamera.quaternion.slerp(targetQuaternion, 0.1);
                    
                    if (isVRMode) {
                        renderVR();
                    } else {
                        internalRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                        internalRenderer.render(internalScene, internalCamera);
                    }
                }
            }
        }

        function renderVR() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            internalRenderer.setViewport(0, 0, width / 2, height);
            internalRenderer.setScissor(0, 0, width / 2, height);
            internalRenderer.setScissorTest(true);
            internalRenderer.render(internalScene, internalCamera);
            
            internalRenderer.setViewport(width / 2, 0, width / 2, height);
            internalRenderer.setScissor(width / 2, 0, width / 2, height);
            internalRenderer.render(internalScene, internalCamera);
            internalRenderer.setScissorTest(false);
        }

        animate();

        async function startExperience() {
            if (isSystemActive) return;
            document.getElementById('instruction').style.opacity = '0';
            
            gsap.to(camera.position, { z: -1.5, duration: 2.2, ease: "power2.inOut", onComplete: () => {
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
                container.style.opacity = '0';
                isSystemActive = true;
            }});
        }

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        window.addEventListener('click', (e) => {
            if (!isSystemActive && !e.target.closest('button')) startExperience();
        });
        window.addEventListener('touchend', (e) => {
            if (!isSystemActive && !e.target.closest('button')) startExperience();
        });
    </script>
</body>
</html>
