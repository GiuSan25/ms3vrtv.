<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour de Sangucherías Tucumanas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-container {
            width: 100%;
            max-width: 640px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .responsive-iframe {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
        }
        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Recorrimos 3 sangucherías tucumanas en Buenos Aires 🥪🔥</h2>

    <!-- Pantalla con vista previa y reproductor de YouTube incorporado -->
    <div class="video-container">
        <div class="responsive-iframe">
            <iframe src="https://www.youtube.com/embed/_P7bMsIi2hU" 
                    title="Recorrimos 3 sangucherías tucumanas en Buenos Aires" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
