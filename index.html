<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MS3 - La Nueva Televisión Inmersiva</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Pantalla de Bienvenida - Fondo Neón con Pantallas 3D Flotantes */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            perspective: 1400px;
            overflow: hidden;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), filter 1.4s ease;
        }

        .welcome-screen.fade-out-elegant {
            opacity: 0;
            transform: scale(1.1);
            filter: blur(12px);
            pointer-events: none;
        }

        .welcome-logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -54%);
            text-align: center;
            width: 550px;
            max-width: 90vw;
            z-index: 1;
            pointer-events: none;
        }

        .welcome-logo-video {
            width: 100%;
            height: auto;
            object-fit: contain;
            border: none !important;
            outline: none !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .geometric-bg-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            transform-style: preserve-3d;
        }

        .tv-screen-3d {
            position: absolute;
            background: rgba(10, 5, 20, 0.45);
            border: 2px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(255, 42, 109, 0.2);
            backdrop-filter: blur(2px);
            border-radius: 8px;
            animation: floatScreens 16s infinite linear;
        }

        .tv-screen-3d::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 30%;
            height: 3px;
            background: rgba(255, 42, 109, 0.6);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 42, 109, 0.8);
        }

        .screen-1 { width: 140px; height: 90px; top: 15%; left: 8%; animation-duration: 18s; }
        .screen-2 { width: 160px; height: 100px; top: 62%; left: 10%; animation-duration: 22s; animation-direction: reverse; }
        .screen-3 { width: 130px; height: 85px; top: 18%; right: 10%; animation-duration: 15s; }
        .screen-4 { width: 170px; height: 110px; bottom: 12%; right: 12%; animation-duration: 24s; }
        .screen-5 { width: 120px; height: 75px; top: 42%; left: 3%; animation-duration: 20s; }
        .screen-6 { width: 150px; height: 95px; top: 32%; right: 5%; animation-duration: 19s; animation-direction: reverse; }

        @keyframes floatScreens {
            0% { transform: translateZ(-300px) rotateX(0deg) rotateY(0deg) translateY(0px); opacity: 0.25; }
            50% { transform: translateZ(280px) rotateX(180deg) rotateY(180deg) translateY(-35px); opacity: 0.8; }
            100% { transform: translateZ(-300px) rotateX(360deg) rotateY(360deg) translateY(0px); opacity: 0.25; }
        }

        .neon-enter-btn {
            position: absolute;
            bottom: 12vh;
            z-index: 10;
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
        }

        .neon-enter-btn:hover {
            background: #00f3ff;
            color: #000000;
            box-shadow: 0 0 35px #00f3ff, 0 0 70px rgba(255, 42, 109, 0.6);
            transform: scale(1.08);
            text-shadow: none;
        }

        /* Contenedor Principal */
        .app-container {
            display: none;
            opacity: 0;
            transform: translateY(25px) scale(0.98);
            filter: blur(6px);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        filter 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 100vh;
            position: relative;
        }

        .app-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px);
        }

        /* Barra Superior Fija */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 24px;
            background: rgba(11,6,20,0.95);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #b19fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
            color: #b19fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .profile-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
        }

        /* Menú de Pestañas Superior */
        .sub-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 20px;
            position: fixed;
            top: 65px;
            left: 0;
            width: 100%;
            background-color: rgba(11, 6, 20, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.9rem;
            z-index: 999;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8a859b;
            cursor: pointer;
            text-decoration: none;
            gap: 4px;
            white-space: nowrap;
            padding: 0 10px;
            background: none;
            border: none;
            font-size: 0.9rem;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-item:hover { color: #fff; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            width: 25px;
            height: 3px;
            background-color: #ff2a6d;
            border-radius: 2px;
        }

        /* Vistas de Contenido Dinámicas */
        .content-section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            padding: 20px;
            padding-top: 140px;
            padding-bottom: 60px;
            background-color: #0b0614;
            min-height: 100vh;
        }

        .content-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #8a859b;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Banner Destacado */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 430px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(43, 17, 85, 0.5), rgba(117, 89, 125, 0.5)), url('ms3media/sanderdocumentalnuevo.jpeg');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255, 42, 109, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(11,6,20,0.95) 100%);
            z-index: 1;
        }

        .hero-badge {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(120, 50, 255, 0.6);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hero-details { position: relative; z-index: 2; }
        .hero-details h2 { font-size: 1.4rem; margin-bottom: 15px; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .hero-buttons { display: flex; gap: 10px; }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background-color: #fff; color: #000; }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Carruseles y Cuadrículas */
        .row-section { margin-top: 30px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cards-slider { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .cards-slider::-webkit-scrollbar { display: none; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }

        .card {
            flex: 0 0 180px;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background-color: #1a1528;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease;
            touch-action: manipulation;
        }
        .cards-grid .card { width: 100%; height: 120px; }
        .card:active { transform: scale(0.97); }

        .card-bg {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #151025, #3c2a6d);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; background-size: cover; background-position: center;
        }

        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
            pointer-events: none;
        }
        .card-title { font-size: 0.8rem; font-weight: bold; line-height: 1.1; }
        .card-tag {
            position: absolute; top: 6px; left: 6px; font-size: 0.6rem;
            background: rgba(11, 6, 20, 0.7); padding: 2px 6px; border-radius: 4px; color: #d8b4fe; z-index: 2;
        }

        .card-remove-btn {
            position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, 0.7);
            color: #ff2a6d; border: 1px solid rgba(255, 42, 109, 0.4); border-radius: 50%;
            width: 24px; height: 24px; font-size: 0.7rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; z-index: 3; touch-action: manipulation;
        }
        .card-remove-btn:active { transform: scale(1.1); }

        /* Estilo Carrusel Famosos MS3 */
        .famosos-slider {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .famosos-slider::-webkit-scrollbar { display: none; }
        .famoso-item {
            flex: 0 0 95px;
            display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; touch-action: manipulation;
        }
        .famoso-circle {
            width: 90px; height: 90px; border-radius: 50%; 
            border: 2px solid #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.6), inset 0 0 8px rgba(0, 243, 255, 0.3);
            background-size: cover; background-position: center; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .famoso-circle:active { transform: scale(0.95); box-shadow: 0 0 20px #00f3ff; }
        .famoso-name { font-size: 0.75rem; text-align: center; font-weight: bold; color: #d8b4fe; white-space: nowrap; }

        /* Reproductor Vertical Flotante Mini para Famosos */
        .vertical-mini-player {
            position: fixed; bottom: 30px; right: 20px; width: 160px; height: 280px;
            background: #000; border: 2px solid #00f3ff; border-radius: 12px; overflow: hidden;
            z-index: 999999; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .vertical-mini-player.active { display: flex; flex-direction: column; }
        .vertical-mini-player iframe, .vertical-mini-player video {
            width: 100%; height: 100%; border: none; object-fit: cover; background: #000;
        }
        .mini-close-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #ff2a6d;
            border: 1px solid #ff2a6d; border-radius: 50%; width: 24px; height: 24px; font-size: 0.75rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1000000;
        }

        /* MODAL DE PREVISIÓN */
        .preview-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .preview-modal.active { opacity: 1; pointer-events: auto; }
        .preview-content {
            background: #151022; width: 100%; max-width: 550px; border-radius: 16px;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); position: relative;
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        .preview-modal.active .preview-content { transform: scale(1); }
        .preview-header-img {
            width: 100%; height: 240px; background: linear-gradient(135deg, #2b1055, #a855f7);
            display: flex; align-items: center; justify-content: center; font-size: 4rem;
            position: relative; background-size: cover; background-position: center;
        }
        .preview-close {
            position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.6);
            color: white; border: none; width: 36px; height: 36px; border-radius: 50%;
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
        }
        .preview-body { padding: 20px; }
        .preview-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .preview-desc { font-size: 0.9rem; color: #b8b2cb; line-height: 1.5; margin-bottom: 25px; }
        .preview-actions { display: flex; gap: 12px; }
        .preview-actions .btn { flex: 1; padding: 12px; text-align: center; justify-content: center; display: flex; align-items: center; gap: 8px; }

        /* Reproductor Pantalla Completa YouTube 360° nativo */
        .player-fullscreen-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 99999; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .player-fullscreen-container.active { display: flex; opacity: 1; }
        .youtube-player-iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 9999; display: block; background: #000;
        }
        .control-top { position: absolute; top: 20px; right: 20px; z-index: 100000; display: flex; gap: 10px; }
        .close-btn {
            background: rgba(0, 0, 0, 0.6); color: white; border: 2px solid white;
            font-size: 1.2rem; width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; font-weight: bold; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo-container">
            <video class="welcome-logo-video" autoplay muted loop playsinline>
                <source src="ms3media/ms3logo.mp4.mp4" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>

        <div class="geometric-bg-3d">
            <div class="tv-screen-3d screen-1"></div>
            <div class="tv-screen-3d screen-2"></div>
            <div class="tv-screen-3d screen-3"></div>
            <div class="tv-screen-3d screen-4"></div>
            <div class="tv-screen-3d screen-5"></div>
            <div class="tv-screen-3d screen-6"></div>
        </div>

        <button class="neon-enter-btn" id="enterBtn">INGRESAR</button>
    </div>

    <!-- Contenedor Principal (App) -->
    <div class="app-container" id="appContainer">
        
        <!-- Barra Superior -->
        <div class="top-nav">
            <div class="logo" id="logoHomeBtn">MS3</div>
            <div class="top-icons">
                <div class="profile-icon" id="profileBtn" title="Mi
