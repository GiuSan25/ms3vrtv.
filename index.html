<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Universo 360 VR Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; }

        /* PUNTERO DE MIRADA (GAZE RETICLE) */
        .gaze-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.6); z-index: 999; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); display: flex; align-items: center; justify-content: center;
        }

        .gaze-dot { width: 6px; height: 6px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 8px #00f0ff; }

        .gaze-progress {
            position: absolute; top: -4px; left: -4px; width: 36px; height: 36px;
            border-radius: 50%; border: 3px solid transparent; opacity: 0; transition: opacity 0.2s ease;
        }

        .gaze-reticle.active .gaze-progress {
            opacity: 1; animation: gazeFill 3s linear forwards;
        }

        @keyframes gazeFill {
            0% { transform: rotate(0deg); border-top-color: #00f0ff; }
            50% { border-right-color: #f000ff; border-bottom-color: #f000ff; }
            100% { transform: rotate(360deg); border-color: #f000ff; }
        }

        #top-controls {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 15px;
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto;
        }

        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }
        .control-btn.active { border-color: #f000ff; color: #f000ff; box-shadow: 0 0 20px rgba(240, 0, 255, 0.6); }

        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        .floating-card { pointer-events: auto; user-select: none; }
        .interactive-btn { pointer-events: auto; transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }
        .interactive-btn.gaze-hover, .floating-card.gaze-hover { transform: scale(1.08); border-color: #f000ff !important; }

        .neon-box-cyan {
            border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.25);
            border-radius: 16px; background: rgba(10, 6, 24, 0.88); backdrop-filter: blur(12px);
        }

        .neon-box-magenta {
            border: 2px solid #f000ff; box-shadow: 0 0 25px rgba(240, 0, 255, 0.5), inset 0 0 20px rgba(240, 0, 255, 0.25);
            border-radius: 16px; background: rgba(10, 6, 24, 0.88); backdrop-filter: blur(12px);
        }

        #video-modal, #about-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px #0ff; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-controls">
        <button id="gyro-btn" class="control-btn" onclick="requestIOSPermissions()"><span>GIROSCOPIO: OFF</span></button>
        <button id="vr-btn" class="control-btn" onclick="toggleVRMode()"><span>VER EN VR</span></button>
        <button class="control-btn" onclick="openAboutModal()"><span>NOSOTROS</span></button>
    </div>

    <div id="instruction">Arrastra con el dedo/mouse en 360° | Toca la esfera MS3 para entrar</div>

    <div id="vr-view-container">
        <!-- OJO IZQUIERDO -->
        <div class="vr-eye" id="eye-left">
            <div class="gaze-reticle" id="reticle-left"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>

        <!-- OJO DERECHO -->
        <div class="vr-eye" id="eye-right">
            <div class="gaze-reticle" id="reticle-right"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="video-modal">
        <video id="active-video" controls autoplay playsinline></video>
        <button class="modal-close-btn interactive-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <div id="about-modal">
        <div class="neon-box-cyan p-8 max-w-md text-center">
            <h2 class="text-3xl font-bold text-cyan-400 mb-4">SOBRE NOSOTROS</h2>
            <p class="text-gray-300 mb-6">Plataforma inmersiva 360° diseñada para experiencias interactivas y realidad virtual.</p>
            <button class="modal-close-btn interactive-btn" onclick="closeAboutModal()">CERRAR</button>
        </div>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let planet, textGroup, planetGroup, universeSphere, starField;
        let hudGroup = null, menuTriggerGroup = null;
        let isMenuOpen = false;

        let isSystemActive = false, isGyroActive = false, isVRMode = false;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let dragDistance = 0;

        let deviceQuaternion = new THREE.Quaternion();
        const eyeSeparation = 0.064;

        let raycaster = new THREE.Raycaster();
        let gazeTarget = null;
        let gazeTimer = null;
        const GAZE_TIME = 3000;

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const cssContainerLeft = document.getElementById('css3d-container-left');
        const cssContainerRight = document.getElementById('css3d-container-right');
        const instruction = document.getElementById('instruction');

        // Escenas 3D
        scene = new THREE.Scene();
        cssScene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 5);

        // Renderizadores WebGL
        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        containerRight.appendChild(rendererRight.domElement);

        // Renderizadores CSS3D
        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        cssContainerLeft.appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        cssContainerRight.appendChild(cssRendererRight.domElement);

        // Luces
        scene.add(new THREE.AmbientLight(0x3a1050, 1.5));
        const pLightCyan = new THREE.PointLight(0x00f0ff, 4, 80); pLightCyan.position.set(-8, 8, 8); scene.add(pLightCyan);
        const pLightPink = new THREE.PointLight(0xf000ff, 4, 80); pLightPink.position.set(8, -8, 8); scene.add(pLightPink);

        // Fondo Universo 360°
        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        // Estrellas
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xf000ff), new THREE.Color(0x9d4edd), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.9 }));
        scene.add(starField);

        // INICIO: Esfera + Texto MS3
        planetGroup = new THREE.Group();
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9 }));
        planet.position.y = -1.5;
        planetGroup.add(planet);
        scene.add(planetGroup);

        textGroup = new THREE.Group(); textGroup.position.y = 0.8;
        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', { font: font, size: 1.2, height: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05 });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            const textMesh = new THREE.Mesh(textGeo, new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0 }));
            textMesh.position.x = centerOffset; textGroup.add(textMesh);
        });
        scene.add(textGroup);

        // MENÚ DESPLEGABLE 3D (Desplazado más a la derecha: x = 2.8)
        function create3DMenuTrigger() {
            const triggerDiv = document.createElement('div');
            triggerDiv.className = "flex flex-col items-end pointer-events-auto";
            triggerDiv.innerHTML = `
                <button id="menu-toggle-btn" class="interactive-btn bg-black/80 border-2 border-cyan-400 text-cyan-300 p-3 rounded-full shadow-[0_0_20px_#00f0ff] flex items-center justify-center gap-2 font-bold" onclick="toggle3DMenu(event)">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <span class="text-xs tracking-wider pr-1">MENÚ</span>
                </button>
                <div id="dropdown-panel-3d" class="hidden mt-3 w-[260px] neon-box-cyan p-4 flex flex-col gap-3 floating-card transition-all duration-300 transform scale-95 opacity-0">
                    <button class="interactive-btn control-btn justify-start w-full text-xs" onclick="requestIOSPermissions()"><span>GIROSCOPIO</span></button>
                    <button class="interactive-btn control-btn justify-start w-full text-xs" onclick="toggleVRMode()"><span>MODO VR</span></button>
                    <button class="interactive-btn control-btn justify-start w-full text-xs" onclick="openAboutModal()"><span>NOSOTROS</span></button>
                </div>
            `;

            menuTriggerGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(triggerDiv);
            cssObject.scale.set(0.0025, 0.0025, 0.0025);
            menuTriggerGroup.add(cssObject);
            
            // Posición separada a la derecha
            menuTriggerGroup.position.set(2.8, 1.6, -1.5);
            menuTriggerGroup.rotation.y = -Math.PI / 6;
            cssScene.add(menuTriggerGroup);
        }

        function toggle3DMenu(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('dropdown-panel-3d');
            if (!panel) return;

            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                panel.classList.remove('hidden');
                setTimeout(() => {
                    panel.classList.remove('scale-95', 'opacity-0');
                    panel.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                panel.classList.remove('scale-100', 'opacity-100');
                panel.classList.add('scale-95', 'opacity-0');
                setTimeout(() => panel.classList.add('hidden'), 300);
            }
        }

        create3DMenuTrigger();

        // PANTALLA MULTIVERSO
        function createMultiverseHUD() {
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[850px] flex flex-col gap-6 floating-card";
            mainContainer.innerHTML = `
                <button class="interactive-btn self-start bg-black/80 border-2 border-fuchsia-500 text-fuchsia-400 px-5 py-2 rounded-full font-bold text-sm flex items-center gap-2 shadow-[0_0_15px_rgba(240,0,255,0.4)]" onclick="exitMultiverse(event)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span>VOLVER AL INICIO</span>
                </button>

                <div class="w-full neon-box-cyan p-8 flex flex-col justify-between h-[320px] rounded-2xl" style="background-image: linear-gradient(to right, rgba(10,6,24,0.95), rgba(10,6,24,0.6)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1200&auto=format&fit=crop'); background-size: cover;">
                    <div>
                        <span class="text-xs font-bold tracking-widest text-cyan-300 uppercase">MS3 Multiverse Live</span>
                        <h1 class="text-4xl font-extrabold text-white mt-2 drop-shadow-[0_0_10px_#00f0ff]">EL CONCIERTO DEL SIGLO</h1>
                        <p class="text-gray-300 text-sm mt-2 max-w-md">Experiencia inmersiva 360° en vivo transmitida directamente desde el núcleo del Multiverso MS3.</p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black px-8 py-3 rounded-xl font-bold shadow-[0_0_20px_#fff]">REPRODUCIR AHORA</button>
                    </div>
                </div>

                <div class="w-full grid grid-cols-3 gap-6">
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')" class="interactive-btn pill-btn neon-box-cyan py-4 text-cyan-400 font-bold text-center">PROGRAMAS VR</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn pill-btn neon-box-magenta py-4 text-fuchsia-400 font-bold text-center">PROGRAMAS 2D</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn pill-btn neon-box-cyan py-4 text-cyan-400 font-bold text-center">CANAL EN VIVO</button>
                </div>
            `;

            hudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.0022, 0.0022, 0.0022);
            hudGroup.add(cssObject);
            hudGroup.position.set(0, 0, -1.8);
            cssScene.add(hudGroup);
        }

        function destroyMultiverseHUD() {
            if (hudGroup) { cssScene.remove(hudGroup); hudGroup = null; }
        }

        // Interacción por Mirada
        function checkGazePointer() {
            let elementToTrigger = null;

            if (!isSystemActive) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), isVRMode ? cameraLeft : camera);
                const intersects = raycaster.intersectObjects([planet]);
                if (intersects.length > 0) elementToTrigger = planet;
            }
            
            if (!elementToTrigger) {
                const centerElement = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
                if (centerElement && centerElement.closest('.interactive-btn')) {
                    elementToTrigger = centerElement.closest('.interactive-btn');
                }
            }

            if (elementToTrigger) {
                if (gazeTarget !== elementToTrigger) {
                    resetGazeTimer();
                    gazeTarget = elementToTrigger;
                    document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.add('active'));
                    if (gazeTarget.classList) gazeTarget.classList.add('gaze-hover');

                    gazeTimer = setTimeout(() => {
                        triggerGazeAction(gazeTarget);
                        resetGazeTimer();
                    }, GAZE_TIME);
                }
            } else {
                resetGazeTimer();
            }
        }

        function resetGazeTimer() {
            if (gazeTimer) clearTimeout(gazeTimer);
            if (gazeTarget && gazeTarget.classList) gazeTarget.classList.remove('gaze-hover');
            gazeTarget = null;
            gazeTimer = null;
            document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.remove('active'));
        }

        function triggerGazeAction(target) {
            if (target === planet) enterMultiverse();
            else if (target && typeof target.click === 'function') target.click();
        }

        // Navegación Táctil / Mouse 360°
        function onPointerDown(e) {
            if (e.target.closest('#top-controls') || e.target.closest('#video-modal') || e.target.closest('#about-modal')) return;
            isDragging = true;
            dragDistance = 0;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x, y };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;

            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            targetRotationY += deltaX * 0.004;
            targetRotationX += deltaY * 0.004;
            targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));

            previousMousePosition = { x, y };
        }

        function onPointerUp(e) {
            if (isDragging && dragDistance < 10 && !isSystemActive) {
                if (!e.target.closest('#top-controls') && !e.target.closest('#menu-toggle-btn') && !e.target.closest('#dropdown-panel-3d')) {
                    enterMultiverse();
                }
            }
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        function requestIOSPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(resp => {
                    if (resp === 'granted') setGyro(!isGyroActive);
                }).catch(console.error);
            } else setGyro(!isGyroActive);
        }

        function handleOrientation(e) {
            if (!isGyroActive) return;
            const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
            const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
            const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(euler);

            const orientFix = new THREE.Quaternion();
            orientFix.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
            deviceQuaternion.multiply(orientFix);
        }

        function setGyro(enable) {
            isGyroActive = enable;
            const text = isGyroActive ? 'GIROSCOPIO: ON' : 'GIROSCOPIO: OFF';
            document.querySelectorAll('#gyro-btn').forEach(b => {
                b.classList.toggle('active', isGyroActive);
                b.querySelector('span').innerText = text;
            });

            if (isGyroActive) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                if (!isVRMode) toggleVRMode();
            } else {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                cameraRig.quaternion.set(0, 0, 0, 1);
                targetRotationX = 0; targetRotationY = 0;
            }
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.querySelectorAll('#vr-btn').forEach(b => {
                b.classList.toggle('active', isVRMode);
                b.querySelector('span').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';
            });
            if (isVRMode && !isGyroActive) requestIOSPermissions();
            onWindowResize();
        }

        // Bucle de Animación
        function animate() {
            requestAnimationFrame(animate);

            if (isGyroActive) {
                cameraRig.quaternion.slerp(deviceQuaternion, 0.2);
            } else {
                currentRotationX += (targetRotationX - currentRotationX) * 0.08;
                currentRotationY += (targetRotationY - currentRotationY) * 0.08;
                cameraRig.rotation.x = currentRotationX;
                cameraRig.rotation.y = currentRotationY;
            }

            planet.rotation.y += 0.008;
            textGroup.rotation.y += 0.006;
            starField.rotation.y += 0.0005;

            checkGazePointer();

            if (isVRMode) {
                rendererLeft.render(scene, cameraLeft);
                rendererRight.render(scene, cameraRight);
                cssRendererLeft.render(cssScene, cameraLeft);
                cssRendererRight.render(cssScene, cameraRight);
            } else {
                rendererLeft.render(scene, camera);
                cssRendererLeft.render(cssScene, camera);
            }
        }
        animate();

        // Entrar al Multiverso
        function enterMultiverse() {
            if (isSystemActive) return;
            isSystemActive = true;
            instruction.style.opacity = '0';

            gsap.to(menuTriggerGroup.scale, { x: 0, y: 0, z: 0, duration: 0.5 });
            gsap.to(planetGroup.scale, { x: 0, y: 0, z: 0, duration: 0.8 });
            gsap.to(textGroup.scale, { x: 0, y: 0, z: 0, duration: 0.8, onComplete: () => {
                planetGroup.visible = false;
                textGroup.visible = false;
                menuTriggerGroup.visible = false;
                
                createMultiverseHUD();
                gsap.fromTo(hudGroup.scale, { x: 0.01, y: 0.01, z: 0.01 }, { x: 1, y: 1, z: 1, duration: 1, ease: "back.out(1.4)" });
            }});
        }

        // Salir del Multiverso
        function exitMultiverse(event) {
            if (event) event.stopPropagation();
            if (!isSystemActive || !hudGroup) return;

            gsap.to(hudGroup.scale, { x: 0, y: 0, z: 0, duration: 0.6, onComplete: () => {
                destroyMultiverseHUD();
                
                planetGroup.visible = true;
                textGroup.visible = true;
                menuTriggerGroup.visible = true;

                gsap.to(planetGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8 });
                gsap.to(textGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8 });
                gsap.to(menuTriggerGroup.scale, { x: 1, y: 1, z: 1, duration: 0.8 });

                isSystemActive = false;
                instruction.style.opacity = '1';
            }});
        }

        function openAboutModal() { document.getElementById('about-modal').style.display = 'flex'; }
        function closeAboutModal() { document.getElementById('about-modal').style.display = 'none'; }
        function openVideo(url) {
            const v = document.getElementById('active-video');
            v.src = url;
            document.getElementById('video-modal').style.display = 'flex';
            v.play();
        }
        function closeVideo() {
            const v = document.getElementById('active-video');
            v.pause(); v.src = "";
            document.getElementById('video-modal').style.display = 'none';
        }

        function onWindowResize() {
            const width = isVRMode ? window.innerWidth / 2 : window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = window.innerWidth / height;
            camera.updateProjectionMatrix();

            cameraLeft.aspect = width / height;
            cameraLeft.updateProjectionMatrix();
            cameraRight.aspect = width / height;
            cameraRight.updateProjectionMatrix();

            rendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            rendererRight.setSize(width, height);

            cssRendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            cssRendererRight.setSize(width, height);
        }
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
