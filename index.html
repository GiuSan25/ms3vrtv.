<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Multiverso Inmersivo 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #multiverse-room { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #multiverse-room { z-index: 5; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; cursor: grab; }
        #multiverse-room:active { cursor: grabbing; }
        
        #instruction { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 3; 
            font-size: 1.1rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; letter-spacing: 1px;
        }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
            display: none;
        }
        #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        #touch-instruction {
            position: absolute; bottom: 20px; width: 100%; text-align: center; color: #0ff; z-index: 20;
            font-size: 0.9rem; pointer-events: none; text-shadow: 0 0 8px #0ff; display: none; font-weight: 500;
        }
    </style>
</head>
<body>

    <button id="vr-btn">Ver en VR</button>
    <div id="instruction">Presiona la esfera para ingresar al multiverso MS3</div>
    <div id="touch-instruction">💡 Arrastra con el dedo o mouse para girar en 360° y explorar las pantallas inmersivas</div>
    
    <div id="webgl-container"></div>
    <div id="multiverse-room"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const multiverseRoomContainer = document.getElementById('multiverse-room');
        const vrBtn = document.getElementById('vr-btn');
        const touchInstruction = document.getElementById('touch-instruction');

        let isSystemActive = false;
        let isVRMode = false;
        let mainScene, mainCamera, mainRenderer, planet, textGroup, planetGroup;
        let multiScene, multiCamera, multiRenderer, multiStars;
        let targetQuaternion = new THREE.Quaternion();

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraLon = 0, cameraLat = 0;
        let targetLon = 0, targetLat = 0;

        const videoLibrary = {
            'live': { title: 'MS3 LIVE: EL CONCIERTO DEL SIGLO', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', tag: 'MS3 EXCLUSIVO' },
            'vr_prog': { title: 'VER PROGRAMAS VR', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', tag: 'INTERACTIVO 360°' },
            'td_prog': { title: 'VER PROGRAMAS 2D', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', tag: 'ESTELAR' },
            'tendencias': { title: 'CÓDIGO VR: INVESTIGACIÓN', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', tag: 'TENDENCIAS' },
            'noticias': { title: 'PLANETA 360: NOTICIAS INMERSIVAS', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', tag: 'NOTICIAS' },
            'cine': { title: 'CINE VR: EXPERIENCIA TOTAL', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', tag: 'CINEMATOGRÁFICO' }
        };

        let activeVideoElement = null;
        let activeVideoTexture = null;

        function playVideoOnScreen(videoKey, meshToReplace) {
            const data = videoLibrary[videoKey];
            if (!data) return;

            if (activeVideoElement) {
                activeVideoElement.pause();
                activeVideoElement.remove();
            }

            const video = document.createElement('video');
            video.src = data.url;
            video.crossOrigin = 'anonymous';
            video.loop = true;
            video.muted = false;
            video.playsInline = true;
            video.autoplay = true;
            video.play().catch(e => console.log("Reproducción automática bloqueada por navegador:", e));

            activeVideoElement = video;
            activeVideoTexture = new THREE.VideoTexture(video);
            activeVideoTexture.minFilter = THREE.LinearFilter;
            activeVideoTexture.magFilter = THREE.LinearFilter;

            if (meshToReplace) {
                meshToReplace.material.map = activeVideoTexture;
                meshToReplace.material.needsUpdate = true;
            }
        }

        // Escena de Presentación Inicial
        mainScene = new THREE.Scene();
        mainCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        mainRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        mainRenderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(mainRenderer.domElement);

        mainScene.add(new THREE.AmbientLight(0xffffff, 1.8));

        const pointLight1 = new THREE.PointLight(0xff00ff, 4, 60);
        pointLight1.position.set(6, 6, 6);
        mainScene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00ffff, 4, 60);
        pointLight2.position.set(-6, -6, 6);
        mainScene.add(pointLight2);

        planetGroup = new THREE.Group();
        const planetGeometry = new THREE.IcosahedronGeometry(1.4, 4); 
        const planetMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9
        });
        planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.y = -1.5;
        planetGroup.add(planet);

        textGroup = new THREE.Group();
        textGroup.position.y = 0.8;

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', {
                font: font, size: 1.2, height: 0.4, curveSegments: 12,
                bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelOffset: 0, bevelSegments: 5
            });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const mirrorMaterial = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0, reflectivity: 1.0
            });
            const textMesh = new THREE.Mesh(textGeo, mirrorMaterial);
            textMesh.position.x = centerOffset;
            textGroup.add(textMesh);

            const neonBorderMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.7 });
            const borderMesh = new THREE.Mesh(textGeo, neonBorderMaterial);
            borderMesh.position.x = centerOffset;
            borderMesh.scale.set(1.02, 1.02, 1.02);
            textGroup.add(borderMesh);
        });

        mainScene.add(planetGroup);
        mainScene.add(textGroup);
        mainCamera.position.z = 5;

        // Entorno Multiverso 360° Inmersivo con pantallas alrededor
        let interactiveScreens = [];
        function initMultiverseRoom() {
            multiScene = new THREE.Scene();
            multiCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            multiRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            multiRenderer.setSize(window.innerWidth, window.innerHeight);
            multiRenderer.setClearColor(0x000000, 0);
            multiverseRoomContainer.appendChild(multiRenderer.domElement);

            const starGeo = new THREE.BufferGeometry();
            const starMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.2 });
            const positions = new Float32Array(6000);
            for(let i = 0; i < 6000; i++) positions[i] = (Math.random() - 0.5) * 150;
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            multiStars = new THREE.Points(starGeo, starMat);
            multiScene.add(multiStars);

            multiScene.add(new THREE.AmbientLight(0xffffff, 2.0));

            interactiveScreens = [];
            const radius = 5.0;
            
            // Configuración de pantallas alrededor distribuidas en 360 grados inspiradas en la interfaz de la imagen
            const screensData = [
                { key: 'live', title: 'MS3 LIVE: EL CONCIERTO DEL SIGLO', subtitle: 'MS3 EXCLUSIVO • 360°', angle: 0, y: 1.2, w: 4.2, h: 2.2, color: '#00ffff' },
                { key: 'vr_prog', title: 'VER PROGRAMAS VR', subtitle: 'EXPERIENCIA INTERACTIVA', angle: Math.PI * 0.35, y: -0.2, w: 3.2, h: 1.8, color: '#ff00ff' },
                { key: 'td_prog', title: 'VER PROGRAMAS 2D', subtitle: 'CONTENIDO ESTELAR', angle: Math.PI * 0.7, y: 1.0, w: 3.4, h: 1.9, color: '#00ffff' },
                { key: 'tendencias', title: 'CÓDIGO VR: INVESTIGACIÓN', subtitle: 'TENDENCIAS AHORA • 230 min', angle: Math.PI, y: -1.0, w: 3.4, h: 1.8, color: '#ff00ff' },
                { key: 'noticias', title: 'PLANETA 360: NOTICIAS', subtitle: 'NOTICIAS INMERSIVAS • 30 min', angle: Math.PI * 1.35, y: 0.8, w: 3.2, h: 1.7, color: '#00ffff' },
                { key: 'cine', title: 'CINE VR: CARTELERA', subtitle: 'ESTRENOS EXCLUSIVOS', angle: Math.PI * 1.7, y: -0.5, w: 3.5, h: 1.8, color: '#ff00ff' }
            ];

            screensData.forEach((item) => {
                const x = Math.sin(item.angle) * radius;
                const z = Math.cos(item.angle) * radius;

                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // Fondo y estilo de tarjeta similar al banner de la plataforma
                ctx.fillStyle = '#0a0a23';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = item.color;
                ctx.lineWidth = 12;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                // Badge superior derecho
                ctx.fillStyle = item.color;
                ctx.fillRect(canvas.width - 320, 30, 280, 50);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 22px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(item.subtitle, canvas.width - 180, 63);

                // Título principal
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 42px Inter';
                ctx.textAlign = 'left';
                ctx.fillText(item.title, 60, 180);

                // Botón interactivo "VER AHORA" / "REPRODUCIR"
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(60, 280, 240, 80);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 28px Inter';
                ctx.textAlign = 'center';
                ctx.fillText('▶ VER AHORA', 180, 332);

                const texture = new THREE.CanvasTexture(canvas);
                const planeGeo = new THREE.PlaneGeometry(item.w, item.h);
                const planeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                const screenMesh = new THREE.Mesh(planeGeo, planeMat);

                screenMesh.position.set(x, item.y, z);
                screenMesh.lookAt(0, item.y, 0);
                screenMesh.userData = { videoKey: item.key };
                
                multiScene.add(screenMesh);
                interactiveScreens.push(screenMesh);
            });

            setupControls(multiverseRoomContainer);
        }

        function enterMultiverse() {
            if (isSystemActive) return;
            isSystemActive = true;
            window.addEventListener('deviceorientation', handleOrientation, true);
            document.getElementById('instruction').style.opacity = '0';
            
            gsap.to(mainCamera.position, { z: -1.5, duration: 2.0, ease: "power2.inOut", onComplete: () => {
                initMultiverseRoom();
                container.style.opacity = '0';
                multiverseRoomContainer.style.opacity = '1';
                multiverseRoomContainer.style.pointerEvents = 'auto';
                vrBtn.style.display = 'block';
                touchInstruction.style.display = 'block';
            }});
        }

        function setupControls(domElem) {
            domElem.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            domElem.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);
        }

        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (!isDragging || !isSystemActive) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetLon -= deltaX * 0.4;
            targetLat += deltaY * 0.4;
            targetLat = Math.max(-85, Math.min(85, targetLat));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            checkScreenClick(e.clientX, e.clientY);
        }

        let touchStartX = 0, touchStartY = 0;
        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                previousMousePosition = { x: touchStartX, y: touchStartY };
            }
        }

        function onTouchMove(e) {
            if (!isDragging || !isSystemActive || e.touches.length !== 1) return;
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const deltaX = currentX - previousMousePosition.x;
            const deltaY = currentY - previousMousePosition.y;

            targetLon -= deltaX * 0.5;
            targetLat += deltaY * 0.5;
            targetLat = Math.max(-85, Math.min(85, targetLat));

            previousMousePosition = { x: currentX, y: currentY };
        }

        function onTouchEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            if (e.changedTouches.length > 0) {
                checkScreenClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkScreenClick(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            if (!multiCamera) return;

            raycaster.setFromCamera(mouse, multiCamera);
            const intersects = raycaster.intersectObjects(interactiveScreens);

            if (intersects.length > 0) {
                const selectedScreen = intersects[0].object;
                const videoKey = selectedScreen.userData.videoKey;
                playVideoOnScreen(videoKey, selectedScreen);
            }
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const Euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(Euler);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (activeVideoTexture) {
                activeVideoTexture.needsUpdate = true;
            }

            if (!isSystemActive) {
                planet.rotation.y += 0.008;
                planet.rotation.x += 0.003;
                textGroup.rotation.y += 0.006;
                mainRenderer.render(mainScene, mainCamera);
            } else {
                cameraLon += (targetLon - cameraLon) * 0.1;
                cameraLat += (targetLat - cameraLat) * 0.1;

                const phi = THREE.MathUtils.degToRad(90 - cameraLat);
                const theta = THREE.MathUtils.degToRad(cameraLon);

                const targetLookAt = new THREE.Vector3(
                    Math.sin(phi) * Math.sin(theta),
                    Math.cos(phi),
                    Math.sin(phi) * Math.cos(theta)
                );

                multiCamera.lookAt(targetLookAt);
                if (multiStars) multiStars.rotation.y += 0.0005;

                if (isVRMode) {
                    renderStereo(multiRenderer, multiScene, multiCamera);
                } else {
                    multiRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    multiRenderer.render(multiScene, multiCamera);
                }
            }
        }

        function renderStereo(targetRenderer, targetScene, targetCamera) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            targetRenderer.setViewport(0, 0, width / 2, height);
            targetRenderer.setScissor(0, 0, width / 2, height);
            targetRenderer.setScissorTest(true);
            targetRenderer.render(targetScene, targetCamera);
            
            targetRenderer.setViewport(width / 2, 0, width / 2, height);
            targetRenderer.setScissor(width / 2, 0, width / 2, height);
            targetRenderer.render(targetScene, targetCamera);
            targetRenderer.setScissorTest(false);
        }

        animate();

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        window.addEventListener('click', (e) => {
            if (!isSystemActive && e.target !== vrBtn) {
                enterMultiverse();
            }
        });
        window.addEventListener('touchend', (e) => {
            if (!isSystemActive && e.target !== vrBtn) {
                enterMultiverse();
            }
        });
    </script>
</body>
</html>
