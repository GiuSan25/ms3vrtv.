<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        #instruction { position: absolute; bottom: 30px; width: 100%; text-align: center; color: #fff; z-index: 3; font-size: 1.2rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; text-shadow: 0 0 10px #0ff; }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
        }
        #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    </style>
</head>
<body>

    <button id="vr-btn" style="display: none;">Ver en VR</button>
    <div id="instruction">Toca la esfera para ingresar al multiverso MS3</div>
    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const vrBtn = document.getElementById('vr-btn');
        let isSystemActive = false;
        let isVRMode = false;
        let internalScene, internalCamera, internalRenderer, stars;
        let targetQuaternion = new THREE.Quaternion();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 1. Esfera con más líneas (mayor subdivisión y wireframe denso) positioned lower
        const planetGroup = new THREE.Group();
        const planetGeometry = new THREE.IcosahedronGeometry(1.6, 3); // Más detalle/líneas
        const planetMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.y = -1.2; // Ubicada más abajo
        planetGroup.add(planet);

        // 2. Letras MS3 3D Neón futurista ubicadas por encima
        const textGroup = new THREE.Group();
        textGroup.position.y = 1.2; // Ubicadas arriba

        // Creación procedural de estructuras estéticas estilo neón para simular las letras "MS3"
        const neonMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
        const cyanNeonMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });

        // Estructura modular futurista representativa de MS3
        const barGeo = new THREE.BoxGeometry(0.3, 1.8, 0.3);
        
        // M
        const m1 = new THREE.Mesh(barGeo, cyanNeonMaterial); m1.position.set(-1.8, 0, 0);
        const m2 = new THREE.Mesh(barGeo, cyanNeonMaterial); m2.position.set(-1.0, 0, 0);
        textGroup.add(m1, m2);

        // S
        const s1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.3), neonMaterial); s1.position.set(0.1, 0.8, 0);
        const s2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.3), neonMaterial); s2.position.set(0.1, 0, 0);
        const s3 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.3), neonMaterial); s3.position.set(0.1, -0.8, 0);
        textGroup.add(s1, s2, s3);

        // 3 (Forma geométrica neón lateral)
        const numGeo = new THREE.BoxGeometry(1.0, 1.8, 0.3);
        const num = new THREE.Mesh(numGeo, cyanNeonMaterial); num.position.set(1.8, 0, 0);
        textGroup.add(num);

        scene.add(planetGroup);
        scene.add(textGroup);
        camera.position.z = 5;

        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            // Multiverso interior: Estrellas y portales flotantes dinámicos
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15 });
            const starPositions = new Float32Array(4500);
            for(let i=0; i<4500; i++) starPositions[i] = (Math.random() - 0.5) * 120;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            const screenGeometry = new THREE.PlaneGeometry(2, 1.5);
            const material = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
            for(let y = -1; y <= 1; y++) {
                for(let x = -2; x <= 2; x++) {
                    const screen = new THREE.Mesh(screenGeometry, material);
                    screen.position.set(x * 2.2, y * 1.7, -5);
                    internalScene.add(screen);
                }
            }
            vrBtn.style.display = 'block';
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const Euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(Euler);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                // Rotación en su propio eje a 360 grados de la esfera y el texto
                planet.rotation.y += 0.008;
                planet.rotation.x += 0.003;
                textGroup.rotation.y += 0.008;
                renderer.render(scene, camera);
            } else {
                if(stars) stars.rotation.y += 0.0005;
                internalCamera.quaternion.slerp(targetQuaternion, 0.1);
                
                if (isVRMode) {
                    renderVR();
                } else {
                    internalRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    internalRenderer.render(internalScene, internalCamera);
                }
            }
        }

        function renderVR() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Render Left
            internalRenderer.setViewport(0, 0, width / 2, height);
            internalRenderer.setScissor(0, 0, width / 2, height);
            internalRenderer.setScissorTest(true);
            internalRenderer.render(internalScene, internalCamera);
            
            // Render Right
            internalRenderer.setViewport(width / 2, 0, width / 2, height);
            internalRenderer.setScissor(width / 2, 0, width / 2, height);
            internalRenderer.render(internalScene, internalCamera);
            internalRenderer.setScissorTest(false);
        }

        animate();

        async function startExperience() {
            if (isSystemActive) return;
            window.addEventListener('deviceorientation', handleOrientation, true);
            document.getElementById('instruction').style.opacity = '0';
            
            // Animación de entrada directa simulando el viaje hacia el multiverso dentro de la esfera
            gsap.to(camera.position, { z: -1.5, duration: 2.2, ease: "power2.inOut", onComplete: () => {
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
                container.style.opacity = '0';
                isSystemActive = true;
            }});
        }

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        window.addEventListener('click', startExperience);
        window.addEventListener('touchend', startExperience);
    </script>
</body>
</html>
