<!DOCTYPE html>
<html lang="es">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; overflow: hidden; }

        #top-ui-container {
            position: fixed; top: 15px; right: 15px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.9); border: 2px solid #00f0ff; color: #00f0ff; 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); backdrop-filter: blur(12px); 
            padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; 
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; 
            white-space: nowrap; pointer-events: auto;
        }

        .control-btn:active { transform: scale(0.95); }

        #instruction { 
            position: fixed; bottom: 25px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 0.95rem; padding: 0 15px; pointer-events: none; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        .floating-card { pointer-events: auto; user-select: none; max-width: 92vw; }
        .interactive-btn { pointer-events: auto; cursor: pointer; }

        .neon-box-cyan {
            border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 20px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .neon-box-magenta {
            border: 2px solid #f000ff; box-shadow: 0 0 25px rgba(240, 0, 255, 0.5), inset 0 0 20px rgba(240, 0, 255, 0.2);
            border-radius: 20px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        #about-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        .modal-close-btn { margin-top: 20px; padding: 12px 30px; background: #0ff; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 1rem; }

        .universe-screen-card {
            border-radius: 20px; overflow: hidden;
            background: rgba(10, 6, 24, 0.95); border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0,240,255,0.4);
            pointer-events: auto; display: flex; flex-direction: column; backdrop-filter: blur(12px);
        }

        .cinema-screen-container {
            width: 900px; max-width: 95vw;
            background: rgba(5, 3, 12, 0.98);
            border: 4px solid #00f0ff;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.8), inset 0 0 40px rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .cinema-screen-container.fullscreen-mode {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            max-width: none !important; border-radius: 0 !important;
            z-index: 9999 !important; padding: 10px !important;
            justify-content: center !important;
        }
        .cinema-screen-container.fullscreen-mode .video-wrapper-box {
            flex-grow: 1 !important;
            height: auto !important;
            padding-bottom: 0 !important;
        }
        .cinema-screen-container.fullscreen-mode iframe,
        .cinema-screen-container.fullscreen-mode video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
        }

        #mobile-bottom-dock {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92vw; max-width: 450px; z-index: 900; display: none;
            flex-direction: column; gap: 8px; pointer-events: auto;
        }
    </style>
</head>
<body>

            <button class="interactive-btn control-btn justify-start w-full text-xs py-2.5" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR</span></button>

            <div class="css3d-container" id="css3d-container-left"></div>

        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>

        <div class="neon-box-cyan p-6 max-w-sm text-center mx-4">

    <script>

        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 4.5);
