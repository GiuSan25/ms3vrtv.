<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor 360 VR</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Botón de inicio requerido en móviles modernos para habilitar sensores y audio */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #overlay p {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Toca para iniciar la experiencia 360°</h1>
        <p>Arrastra con el mouse o mueve tu celular para explorar</p>
    </div>

    <div id="webgl-container"></div>

    <!-- Video oculto que sirve como textura -->
    <video id="video" src="tu-video-360.mp4" crossorigin="anonymous" playsinline webkit-playsinline muted loop></video>

    <!-- Importar Three.js y los controles necesarios mediante ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        let camera, scene, renderer, controls;
        let video, texture;
        let isMobile = false;

        const container = document.getElementById('webgl-container');
        const overlay = document.getElementById('overlay');

        // Detectar si es dispositivo móvil
        if (/Mobi|Android/i.test(navigator.userAgent)) {
            isMobile = true;
        }

        overlay.addEventListener('click', () => {
            video = document.getElementById('video');
            video.play();
            overlay.style.display = 'none';

            init();
            animate();
        });

        function init() {
            // 1. Escena y Cámara
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            
            // Posicionar la cámara mirando hacia el interior de la esfera
            camera.target = new THREE.Vector3(0, 0, 0);

            // 2. Textura de Video sobre una Esfera invertida
            texture = new THREE.VideoTexture(video);
            texture.colorSpace = THREE.SRGBColorSpace;

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            // Invertir la geometría en el eje X para que el video se vea por dentro de la esfera
            geometry.scale(-1, 1, 1);

            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 4. Controles (Mouse para PC / Giroscopio para Móvil)
            if (isMobile) {
                controls = new DeviceOrientationControls(camera);
            } else {
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableZoom = false; // Desactivar zoom para mantener la inmersión 360
                controls.enablePan = false;  // Desactivar paneo lateral
                controls.rotateSpeed = -0.5; // Invierte el arrastre para que el mouse mueva la vista de forma natural
            }

            // Evento para adaptar la pantalla al rotar el dispositivo o cambiar tamaño de ventana
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls) {
                controls.update();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
