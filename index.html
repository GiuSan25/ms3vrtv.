<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plataforma MS3 - Reproductor</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
    .container { max-width: 600px; margin: 0 auto; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
    video { width: 100%; margin-top: 15px; border-radius: 8px; }
    .oculto { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>MS3 Media Player</h1>

    <!-- FORMULARIO DE INGRESO -->
    <div id="seccion-login">
      <h3>Ingresa tu correo para recibir tu acceso</h3>
      <input type="email" id="email" placeholder="tu@correo.com" required>
      <button onclick="solicitarAcceso()">Enviar enlace de acceso</button>
      <p id="mensaje-login"></p>
    </div>

    <!-- REPRODUCTOR DE VIDEO (Protegido) -->
    <div id="seccion-reproductor" class="oculto">
      <h3 id="bienvenida"></h3>
      <video id="reproductor" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Tu navegador no soporta el reproductor de video.
      </video>
      <br>
      <button onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>

  <script>
    const URL_API = 'http://localhost:3000/api';
    const CONTENIDO_ID = 'video_demo_1'; // ID único del video/audio

    const urlParams = new URLSearchParams(window.location.search);
    const tokenUrl = urlParams.get('token');

    // Si viene un token en la URL, guardarlo y limpiar la dirección
    if (tokenUrl) {
      localStorage.setItem('token_ms3', tokenUrl);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    const token = localStorage.getItem('token_ms3');

    if (token) {
      iniciarReproductor();
    }

    // 1. Pedir el enlace mágico al servidor
    async function solicitarAcceso() {
      const email = document.getElementById('email').value;
      const res = await fetch(`${URL_API}/solicitar-acceso`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      document.getElementById('mensaje-login').innerText = data.mensaje || data.error;
    }

    // 2. Cargar el reproductor y sincronizar el punto de reproducción
    async function iniciarReproductor() {
      document.getElementById('seccion-login').classList.add('oculto');
      document.getElementById('seccion-reproductor').classList.remove('oculto');

      const reproductor = document.getElementById('reproductor');

      // Obtener el tiempo donde se quedó el usuario
      try {
        const res = await fetch(`${URL_API}/progreso/${CONTENIDO_ID}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.tiempo) {
          reproductor.currentTime = data.tiempo;
        }
      } catch (err) {
        console.error("Error al cargar el progreso", err);
      }

      // Guardar el progreso automáticamente cada 5 segundos mientras se reproduce
      setInterval(() => {
        if (!reproductor.paused) {
          guardarProgreso(reproductor.currentTime);
        }
      }, 5000);

      // Guardar progreso al pausar
      reproductor.onpause = () => guardarProgreso(reproductor.currentTime);
    }

    // 3. Enviar la posición actual al servidor
    async function guardarProgreso(tiempo) {
      await fetch(`${URL_API}/progreso`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ contenidoId: CONTENIDO_ID, tiempo })
      });
    }

    function cerrarSesion() {
      localStorage.removeItem('token_ms3');
      location.reload();
    }
  </script>
</body>
</html>
