<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Importante: Añadimos DeviceOrientationControls para un movimiento fluido -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: linear-gradient(135deg, #4c1d95, #be185d); }
        #instruction { position: absolute; bottom: 30px; width: 100%; text-align: center; color: #fff; z-index: 3; font-size: 1.2rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="instruction">Toca la pantalla para activar la experiencia inmersiva</div>
    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        let isSystemActive = false;
        let internalScene, internalCamera, internalRenderer, stars, controls;

        // Entry Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
        scene.add(planet);
        camera.position.z = 5;

        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            // Inicializar controles de giroscopio
            controls = new THREE.DeviceOrientationControls(internalCamera);

            // Create Stars
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
            const starPositions = new Float32Array(1000 * 3);
            for(let i=0; i<3000; i++) starPositions[i] = (Math.random() - 0.5) * 100;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            // Create Static TV-wall screens
            const screenGeometry = new THREE.PlaneGeometry(2, 1.5);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, side: THREE.DoubleSide });
            
            for(let y = -1; y <= 1; y++) {
                for(let x = -2; x <= 2; x++) {
                    const screen = new THREE.Mesh(screenGeometry, material);
                    screen.position.set(x * 2.2, y * 1.7, -5);
                    internalScene.add(screen);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                planet.rotation.y += 0.005;
                renderer.render(scene, camera);
            } else {
                if(stars) stars.rotation.y += 0.0005;
                if(controls) controls.update(); // Actualizar la orientación del giroscopio en cada fotograma
                internalRenderer.render(internalScene, internalCamera);
            }
        }
        animate();

        // Función para activar permisos y la transición
        async function startExperience() {
            if (isSystemActive) return;

            // Solicitar permisos de giroscopio en iOS (13+) de forma segura
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('Se requiere permiso para usar el giroscopio.');
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
            }

            document.getElementById('instruction').style.opacity = '0';
            
            gsap.to(camera.position, { 
                z: 0.5, 
                duration: 2, 
                ease: "power2.inOut", 
                onComplete: () => {
                    initInternalSystem();
                    envContainer.style.opacity = '1';
                    envContainer.style.pointerEvents = 'auto';
                    container.style.opacity = '0';
                    isSystemActive = true;
                }
            });
        }

        window.addEventListener('click', startExperience);
        window.addEventListener('touchend', startExperience);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (internalCamera && internalRenderer) {
                internalCamera.aspect = window.innerWidth / window.innerHeight;
                internalCamera.updateProjectionMatrix();
                internalRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
