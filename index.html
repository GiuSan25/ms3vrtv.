<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Universo 360 VR Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }

        body.vr-mode #eye-right {
            display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4);
        }

        #eye-right { display: none; }

        .webgl-canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* PUNTERO DE MIRADA (GAZE RETICLE) */
        .gaze-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.5); z-index: 999; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); display: flex; align-items: center; justify-content: center;
        }

        .gaze-dot {
            width: 6px; height: 6px; background: #00f0ff; border-radius: 50%;
            box-shadow: 0 0 8px #00f0ff;
        }

        .gaze-progress {
            position: absolute; top: -4px; left: -4px; width: 34px; height: 34px;
            border-radius: 50%; border: 3px solid transparent; border-top-color: #f000ff;
            opacity: 0; transform: rotate(0deg); transition: opacity 0.2s ease;
        }

        .gaze-reticle.active .gaze-progress {
            opacity: 1;
            animation: gazeFill 3s linear forwards;
        }

        @keyframes gazeFill {
            0% { transform: rotate(0deg); border-top-color: #00f0ff; border-right-color: transparent; border-bottom-color: transparent; border-left-color: transparent; }
            25% { border-right-color: #00f0ff; }
            50% { border-bottom-color: #f000ff; }
            75% { border-left-color: #f000ff; }
            100% { transform: rotate(360deg); border-color: #f000ff; }
        }

        #top-controls {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 15px;
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap;
        }

        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }
        .control-btn.active { border-color: #f000ff; color: #f000ff; box-shadow: 0 0 20px rgba(240, 0, 255, 0.6); }

        #mobile-menu-toggle {
            display: none; position: fixed; top: 15px; right: 15px; z-index: 1100; background: rgba(10, 6, 24, 0.9);
            border: 2px solid #00f0ff; color: #00f0ff; padding: 10px; border-radius: 50%; backdrop-filter: blur(8px); cursor: pointer;
        }

        #mobile-drawer {
            position: fixed; top: 0; right: -280px; width: 260px; height: 100dvh; background: rgba(10, 6, 24, 0.95);
            border-left: 2px solid #00f0ff; z-index: 1050; display: flex; flex-direction: column; padding: 80px 20px 20px 20px; gap: 15px; transition: right 0.4s ease-in-out;
        }
        #mobile-drawer.open { right: 0; }

        @media (max-width: 768px) {
            #top-controls { display: none; }
            #mobile-menu-toggle { display: flex; }
        }

        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        .ui-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
            overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 80px 10px 30px 10px;
            -webkit-overflow-scrolling: touch;
        }

        body.vr-mode .desktop-canvas-frame { transform: scale(0.65); transform-origin: top center; }

        .desktop-canvas-frame {
            width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: transform 0.3s ease;
        }

        .interactive-btn { transition: transform 0.2s ease, border-color 0.2s ease; }
        .interactive-btn.gaze-hover { transform: scale(1.08); border-color: #f000ff !important; }

        .back-btn-floating {
            background: rgba(10, 6, 24, 0.9); border: 2px solid #f000ff; color: #f000ff; box-shadow: 0 0 15px rgba(240, 0, 255, 0.5);
            backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 9999px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; align-self: flex-start; margin-bottom: -10px;
        }

        .neon-box-cyan {
            border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.25);
            border-radius: 16px; background: rgba(10, 6, 24, 0.85); backdrop-filter: blur(10px);
        }

        .neon-box-magenta {
            border: 2px solid #f000ff; box-shadow: 0 0 25px rgba(240, 0, 255, 0.5), inset 0 0 20px rgba(240, 0, 255, 0.25);
            border-radius: 16px; background: rgba(10, 6, 24, 0.85); backdrop-filter: blur(10px);
        }

        .pill-btn {
            background: rgba(10, 10, 25, 0.9); border-radius: 9999px; font-weight: 700; transition: all 0.3s ease;
            cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center;
        }

        #video-modal, #about-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px #0ff; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="mobile-menu-toggle" onclick="toggleMobileMenu()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>

    <div id="mobile-drawer">
        <h3 class="text-cyan-400 font-bold text-lg mb-2 text-center border-b border-cyan-500/30 pb-2">MENÚ MS3</h3>
        <button id="gyro-btn-mobile" class="control-btn justify-center" onclick="requestIOSPermissions()"><span>GIROSCOPIO: OFF</span></button>
        <button id="vr-btn-mobile" class="control-btn justify-center" onclick="toggleVRMode()"><span>VER EN VR</span></button>
        <button class="control-btn justify-center" onclick="openAboutModal()"><span>NOSOTROS</span></button>
    </div>

    <div id="top-controls">
        <button id="gyro-btn" class="control-btn" onclick="requestIOSPermissions()"><span>GIROSCOPIO: OFF</span></button>
        <button id="vr-btn" class="control-btn" onclick="toggleVRMode()"><span>VER EN VR</span></button>
        <button class="control-btn" onclick="openAboutModal()"><span>NOSOTROS</span></button>
    </div>

    <div id="instruction">Fija la mirada 3 seg sobre los elementos para interactuar</div>

    <div id="vr-view-container">
        <!-- OJO IZQUIERDO -->
        <div class="vr-eye" id="eye-left">
            <div class="gaze-reticle" id="reticle-left"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="ui-interface" id="ui-left">
                <div class="desktop-canvas-frame">
                    <button class="back-btn-floating interactive-btn" onclick="exitMultiverse(event)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER A MS3</span>
                    </button>

                    <div class="w-full neon-box-cyan p-6 flex flex-col justify-between h-[280px]" style="background-image: linear-gradient(to right, rgba(12,9,31,0.92), rgba(12,9,31,0.6)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1200&auto=format&fit=crop'); background-size: cover;">
                        <div>
                            <span class="text-xs font-semibold text-cyan-300">MS3 LIVE</span>
                            <h1 class="text-3xl font-extrabold text-white mt-2">EL CONCIERTO DEL SIGLO</h1>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black px-6 py-2.5 rounded-xl font-bold">VER AHORA</button>
                        </div>
                    </div>
                    <div class="w-full grid grid-cols-3 gap-4">
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')" class="interactive-btn pill-btn neon-box-cyan py-3 text-cyan-400">PROGRAMAS VR</button>
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn pill-btn neon-box-magenta py-3 text-fuchsia-400">PROGRAMAS 2D</button>
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn pill-btn neon-box-cyan py-3 text-cyan-400">EN VIVO</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- OJO DERECHO -->
        <div class="vr-eye" id="eye-right">
            <div class="gaze-reticle" id="reticle-right"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="ui-interface" id="ui-right">
                <div class="desktop-canvas-frame">
                    <button class="back-btn-floating interactive-btn" onclick="exitMultiverse(event)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER A MS3</span>
                    </button>

                    <div class="w-full neon-box-cyan p-6 flex flex-col justify-between h-[280px]" style="background-image: linear-gradient(to right, rgba(12,9,31,0.92), rgba(12,9,31,0.6)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1200&auto=format&fit=crop'); background-size: cover;">
                        <div>
                            <span class="text-xs font-semibold text-cyan-300">MS3 LIVE</span>
                            <h1 class="text-3xl font-extrabold text-white mt-2">EL CONCIERTO DEL SIGLO</h1>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black px-6 py-2.5 rounded-xl font-bold">VER AHORA</button>
                        </div>
                    </div>
                    <div class="w-full grid grid-cols-3 gap-4">
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')" class="interactive-btn pill-btn neon-box-cyan py-3 text-cyan-400">PROGRAMAS VR</button>
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn pill-btn neon-box-magenta py-3 text-fuchsia-400">PROGRAMAS 2D</button>
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn pill-btn neon-box-cyan py-3 text-cyan-400">EN VIVO</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="video-modal">
        <video id="active-video" controls autoplay playsinline></video>
        <button class="modal-close-btn interactive-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <div id="about-modal">
        <div class="neon-box-cyan p-8 max-w-md text-center">
            <h2 class="text-3xl font-bold text-cyan-400 mb-4">SOBRE NOSOTROS</h2>
            <p class="text-gray-300 mb-6">Plataforma inmersiva 360° diseñada para experiencias interactivas y realidad virtual.</p>
            <button class="modal-close-btn interactive-btn" onclick="closeAboutModal()">CERRAR</button>
        </div>
    </div>

    <script>
        let scene, camera, cameraLeft, cameraRight, cameraRig, rendererLeft, rendererRight;
        let planet, textGroup, planetGroup, universeSphere, starField, backgroundRingGroup;
        let isSystemActive = false, isGyroActive = false, isVRMode = false, mobileMenuOpen = false;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let dragDistance = 0;

        let deviceQuaternion = new THREE.Quaternion();
        const eyeSeparation = 0.064;

        // Variables de Raycaster para el Puntero de Mirada (Gaze)
        let raycaster = new THREE.Raycaster();
        let gazeTarget = null;
        let gazeTimer = null;
        const GAZE_TIME = 3000; // 3 segundos

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const uiLeft = document.getElementById('ui-left');
        const uiRight = document.getElementById('ui-right');
        const instruction = document.getElementById('instruction');

        scene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.z = 5;

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        containerRight.appendChild(rendererRight.domElement);

        scene.add(new THREE.AmbientLight(0x3a1050, 1.5));
        const pLightCyan = new THREE.PointLight(0x00f0ff, 4, 80); pLightCyan.position.set(-8, 8, 8); scene.add(pLightCyan);
        const pLightPink = new THREE.PointLight(0xf000ff, 4, 80); pLightPink.position.set(8, -8, 8); scene.add(pLightPink);
        const pLightViolet = new THREE.PointLight(0x8a2be2, 3, 80); pLightViolet.position.set(0, 0, -10); scene.add(pLightViolet);

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 2500;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xf000ff), new THREE.Color(0x9d4edd), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);

            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starsMaterial = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.9 });
        starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        backgroundRingGroup = new THREE.Group();
        const ringGeo1 = new THREE.TorusGeometry(12, 0.05, 16, 100);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.35 });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1); ring1.rotation.x = Math.PI / 3;

        const ringGeo2 = new THREE.TorusGeometry(16, 0.05, 16, 100);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xf000ff, wireframe: true, transparent: true, opacity: 0.3 });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2); ring2.rotation.y = Math.PI / 4;

        backgroundRingGroup.add(ring1); backgroundRingGroup.add(ring2); scene.add(backgroundRingGroup);

        planetGroup = new THREE.Group();
        const planetMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9 });
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 4), planetMaterial);
        planet.position.y = -1.5;
        planetGroup.add(planet);
        scene.add(planetGroup);

        textGroup = new THREE.Group(); textGroup.position.y = 0.8;

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', { font: font, size: 1.2, height: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelOffset: 0, bevelSegments: 5 });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const mirrorMaterial = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0, reflectivity: 1.0 });
            const textMesh = new THREE.Mesh(textGeo, mirrorMaterial); textMesh.position.x = centerOffset; textGroup.add(textMesh);

            const neonBorderMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.7 });
            const borderMesh = new THREE.Mesh(textGeo, neonBorderMaterial); borderMesh.position.x = centerOffset; borderMesh.scale.set(1.02, 1.02, 1.02); textGroup.add(borderMesh);
        });
        scene.add(textGroup);

        // --- SISTEMA DE SELECCIÓN POR MIRADA (GAZE SELECTION 3 SEGUNDOS) ---
        function checkGazePointer() {
            let elementToTrigger = null;

            if (!isSystemActive) {
                // Raycast a la Esfera Central en el Universo
                raycaster.setFromCamera(new THREE.Vector2(0, 0), isVRMode ? cameraLeft : camera);
                const intersects = raycaster.intersectObjects([planet]);
                if (intersects.length > 0) {
                    elementToTrigger = planet;
                }
            } else {
                // Raycast DOM desde la mirada central
                const centerElement = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
                if (centerElement && centerElement.closest('.interactive-btn')) {
                    elementToTrigger = centerElement.closest('.interactive-btn');
                }
            }

            if (elementToTrigger) {
                if (gazeTarget !== elementToTrigger) {
                    resetGazeTimer();
                    gazeTarget = elementToTrigger;
                    
                    document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.add('active'));
                    if (gazeTarget.classList) gazeTarget.classList.add('gaze-hover');

                    gazeTimer = setTimeout(() => {
                        triggerGazeAction(gazeTarget);
                        resetGazeTimer();
                    }, GAZE_TIME);
                }
            } else {
                resetGazeTimer();
            }
        }

        function resetGazeTimer() {
            if (gazeTimer) clearTimeout(gazeTimer);
            if (gazeTarget && gazeTarget.classList) gazeTarget.classList.remove('gaze-hover');
            gazeTarget = null;
            gazeTimer = null;
            document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.remove('active'));
        }

        function triggerGazeAction(target) {
            if (target === planet) {
                enterMultiverse();
            } else if (target && typeof target.click === 'function') {
                target.click();
            }
        }

        // Interacción Táctil y Mouse
        function onPointerDown(e) {
            if (e.target.closest('#top-controls') || e.target.closest('#mobile-drawer') || e.target.closest('#mobile-menu-toggle') || e.target.closest('.ui-interface') || e.target.closest('#video-modal') || e.target.closest('#about-modal')) return;
            
            isDragging = true;
            dragDistance = 0;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x, y };
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;

            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            targetRotationY += deltaX * 0.005;
            targetRotationX += deltaY * 0.005;

            targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));

            previousMousePosition = { x, y };
        }

        function onPointerUp(e) {
            if (isDragging && dragDistance < 12) {
                if (!isSystemActive && !e.target.closest('#top-controls') && !e.target.closest('#mobile-drawer') && !e.target.closest('#mobile-menu-toggle')) {
                    enterMultiverse();
                }
            }
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        function requestIOSPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') setGyro(!isGyroActive);
                }).catch(console.error);
            } else setGyro(!isGyroActive);
        }

        function handleOrientation(e) {
            if (!isGyroActive) return;

            const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
            const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
            const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(euler);

            const orientFix = new THREE.Quaternion();
            orientFix.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
            deviceQuaternion.multiply(orientFix);
        }

        function setGyro(enable) {
            isGyroActive = enable;
            const text = isGyroActive ? 'GIROSCOPIO: ON' : 'GIROSCOPIO: OFF';
            document.querySelectorAll('#gyro-btn, #gyro-btn-mobile').forEach(b => {
                b.classList.toggle('active', isGyroActive);
                b.querySelector('span').innerText = text;
            });

            if (isGyroActive) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                if (!isVRMode) toggleVRMode();
            } else {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                cameraRig.quaternion.set(0, 0, 0, 1);
                targetRotationX = 0; targetRotationY = 0;
            }
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.querySelectorAll('#vr-btn, #vr-btn-mobile').forEach(b => {
                b.classList.toggle('active', isVRMode);
                b.querySelector('span').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';
            });

            if (isVRMode && !isGyroActive) requestIOSPermissions();
            onWindowResize();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGyroActive) {
                cameraRig.quaternion.slerp(deviceQuaternion, 0.2);
            } else {
                currentRotationX += (targetRotationX - currentRotationX) * 0.08;
                currentRotationY += (targetRotationY - currentRotationY) * 0.08;

                cameraRig.rotation.x = currentRotationX;
                cameraRig.rotation.y = currentRotationY;
            }

            planet.rotation.y += 0.008;
            textGroup.rotation.y += 0.006;

            starField.rotation.y += 0.0006;
            starField.rotation.x += 0.0003;
            backgroundRingGroup.rotation.y += 0.002;
            backgroundRingGroup.rotation.z += 0.001;

            checkGazePointer();

            if (isVRMode) {
                rendererLeft.render(scene, cameraLeft);
                rendererRight.render(scene, cameraRight);
            } else {
                rendererLeft.render(scene, camera);
            }
        }
        animate();

        function enterMultiverse() {
            if (isSystemActive) return;
            isSystemActive = true;
            instruction.style.opacity = '0';
            
            gsap.to(cameraRig.position, { z: -1.5, duration: 1.5, onComplete: () => {
                planetGroup.visible = false;
                textGroup.visible = false;
                
                [uiLeft, uiRight].forEach(ui => {
                    ui.style.opacity = '1';
                    ui.style.pointerEvents = 'auto';
                });
            }});
        }

        function exitMultiverse(event) {
            if (event) event.stopPropagation();
            if (!isSystemActive) return;
            
            [uiLeft, uiRight].forEach(ui => {
                ui.style.opacity = '0';
                ui.style.pointerEvents = 'none';
            });

            planetGroup.visible = true;
            textGroup.visible = true;

            targetRotationX = 0; targetRotationY = 0;

            gsap.to(cameraRig.position, { z: 5, duration: 1.5, onComplete: () => {
                isSystemActive = false;
                instruction.style.opacity = '1';
            }});
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            document.getElementById('mobile-drawer').classList.toggle('open', mobileMenuOpen);
        }

        function openAboutModal() { document.getElementById('about-modal').style.display = 'flex'; }
        function closeAboutModal() { document.getElementById('about-modal').style.display = 'none'; }
        function openVideo(url) {
            const v = document.getElementById('active-video');
            v.src = url;
            document.getElementById('video-modal').style.display = 'flex';
            v.play();
        }
        function closeVideo() {
            const v = document.getElementById('active-video');
            v.pause(); v.src = "";
            document.getElementById('video-modal').style.display = 'none';
        }

        function onWindowResize() {
            const width = isVRMode ? window.innerWidth / 2 : window.innerWidth;
            const height = window.innerHeight;
            
            camera.aspect = window.innerWidth / height;
            camera.updateProjectionMatrix();

            cameraLeft.aspect = width / height;
            cameraLeft.updateProjectionMatrix();

            cameraRight.aspect = width / height;
            cameraRight.updateProjectionMatrix();

            rendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            rendererRight.setSize(width, height);
        }
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
