<!DOCTYPE html>

        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb { background: #db2777; border-radius: 3px; }
        .glow-pink { text-shadow: 0 0 30px rgba(236, 72, 153, 0.8), 0 0 60px rgba(168, 85, 247, 0.6); }
        .glow-box { box-shadow: 0 0 35px rgba(219, 39, 119, 0.5), 0 0 15px rgba(168, 85, 247, 0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #space-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

</head>
<body class="bg-[#030307] text-white selection:bg-pink-600 selection:text-white">

    <div id="main-app" class="opacity-0 transition-opacity duration-1000 flex min-h-screen">

                <button onclick="switchTab('tendencias', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition cursor-pointer"><i class="fa-solid fa-fire"></i><span>Tendencias</span></button>

                <button onclick="switchTab('peliculas', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition cursor-pointer"><i class="fa-solid fa-film"></i><span>Películas</span></button>
                <button onclick="switchTab('series', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition cursor-pointer"><i class="fa-solid fa-tv"></i><span>Series</span></button>
                <button onclick="switchTab('milista', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-white/5 hover:text-white transition cursor-pointer"><i class="fa-solid fa-list"></i><span>Mi lista</span></button>

                    <i class="fa-solid fa-magnifying-glass text-pink-400 mr-2 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Buscar contenido..." onkeyup="handleSearch(event)" class="bg-transparent border-none outline-none text-xs w-full text-white placeholder-gray-500">

                    <button onclick="openVRExperience('MS3 Hub Inmersivo')" class="flex items-center space-x-2 px-3.5 py-1.5 bg-pink-600/20 border border-pink-500/40 rounded-full text-xs font-semibold text-pink-300 hover:bg-pink-600/30 transition cursor-pointer shadow-md shadow-pink-600/25">
                        <i class="fa-solid fa-vr-cardboard"></i><span>Modo VR</span>
