<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor VR Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            background-color: #0b0b0b;
            color: #fff;
            overflow: hidden;
        }

        /* Sección Principal de Inicio */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 50px;
            background: url('img/portada-placeholder.jpg') no-repeat center center/cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #ccc;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary {
            background-color: #e50914;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #b20710;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* Contenedor del Reproductor de Video (Pantalla Completa) */
        .player-fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .player-fullscreen-container.active {
            display: flex;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Modo Gafas VR (Pantalla Partida Estéreo) */
        .vr-split video {
            width: 50% !important;
            height: 100%;
            float: left;
        }
        .vr-split {
            display: flex !important;
            justify-content: space-between;
        }

        /* Controles Dinámicos Superiores/Inferiores */
        .player-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none; /* Permite hacer clic a través si no hay controles */
            transition: opacity 0.3s ease;
        }

        .player-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .control-top {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: auto;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .control-btn {
            background: transparent;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Sección de Inicio (Hero) -->
    <section class="hero-container" id="heroSection">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Experiencia Inmersiva</h1>
            <p>Sumérgete en una nueva dimensión visual con soporte completo para reproducción en pantalla grande y modo estereoscópico para gafas VR.</p>
            <div class="button-group">
                <button class="btn btn-primary" id="watchNowBtn">Ver Ahora</button>
                <button class="btn btn-secondary" id="addListBtn">Agregar a la lista</button>
            </div>
        </div>
    </section>

    <!-- Contenedor del Reproductor Oculto por Defecto -->
    <div class="player-fullscreen-container" id="playerContainer">
        <video id="mainVideo" crossorigin="anonymous">
            <source src="tu-video-360-o-normal.mp4" type="video/mp4">
            <!-- Pista de subtítulos opcional -->
            <track src="subtitulos-es.vtt" kind="subtitles" srclang="es" label="Español">
            Tu navegador no soporta el elemento de video.
        </video>

        <!-- Capa de Controles Interactivos -->
        <div class="player-controls" id="playerControls">
            <div class="control-top">
                <button class="close-btn" id="closeBtn" title="Salir">✕</button>
            </div>
            <div class="control-bottom">
                <button class="control-btn" id="playPauseBtn">Pausar</button>
                <button class="control-btn" id="subtitlesBtn">Subtítulos: OFF</button>
                <button class="control-btn" id="vrModeBtn">Modo VR (Pantalla Partida)</button>
            </div>
        </div>
    </div>

    <script>
        const watchNowBtn = document.getElementById('watchNowBtn');
        const playerContainer = document.getElementById('playerContainer');
        const mainVideo = document.getElementById('mainVideo');
        const closeBtn = document.getElementById('closeBtn');
        const playerControls = document.getElementById('playerControls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const subtitlesBtn = document.getElementById('subtitlesBtn');
        const vrModeBtn = document.getElementById('vrModeBtn');

        let controlsTimeout;

        // 1. Reproducir video en pantalla completa al presionar "Ver Ahora"
        watchNowBtn.addEventListener('click', () => {
            playerContainer.classList.add('active');
            mainVideo.play();
            
            // Solicitar pantalla completa del navegador si es compatible
            if (playerContainer.requestFullscreen) {
                playerContainer.requestFullscreen();
            } else if (playerContainer.webkitRequestFullscreen) {
                playerContainer.webkitRequestFullscreen();
            }
        });

        // 2. Cerrar reproductor y salir
        const closePlayer = () => {
            mainVideo.pause();
            mainVideo.currentTime = 0;
            playerContainer.classList.remove('active');
            playerContainer.classList.remove('vr-split');
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        };

        closeBtn.addEventListener('click', closePlayer);

        // 3. Ocultar/Mostrar controles al tocar la pantalla
        const toggleControls = () => {
            playerControls.classList.toggle('hidden');
        };

        playerContainer.addEventListener('click', (e) => {
            // Evitar que los clics en los botones disparen el ocultamiento inmediato
            if(e.target.tagName === 'BUTTON') return;
            toggleControls();
        });

        // 4. Controles de Reproducción (Play/Pause)
        playPauseBtn.addEventListener('click', () => {
            if (mainVideo.paused) {
                mainVideo.play();
                playPauseBtn.textContent = "Pausar";
            } else {
                mainVideo.pause();
                playPauseBtn.textContent = "Reproducir";
            }
        });

        // 5. Activar / Desactivar Subtítulos
        const textTracks = mainVideo.textTracks;
        if (textTracks && textTracks.length > 0) {
            textTracks[0].mode = 'hidden'; // Inicialmente ocultos
        }

        subtitlesBtn.addEventListener('click', () => {
            if (textTracks && textTracks.length > 0) {
                const track = textTracks[0];
                if (track.mode === 'showing') {
                    track.mode = 'hidden';
                    subtitlesBtn.textContent = "Subtítulos: OFF";
                } else {
                    track.mode = 'showing';
                    subtitlesBtn.textContent = "Subtítulos: ON";
                }
            } else {
                alert("No hay subtítulos disponibles para este video.");
            }
        });

        // 6. Partido de pantalla para Gafas VR (Esterescópico básico)
        vrModeBtn.addEventListener('click', () => {
            playerContainer.classList.toggle('vr-split');
            if(playerContainer.classList.contains('vr-split')) {
                vrModeBtn.textContent = "Modo Normal";
            } else {
                vrModeBtn.textContent = "Modo VR (Pantalla Partida)";
            }
        });
    </script>
</body>
</html>
