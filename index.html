<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Universo Multiverse Cinema Hub 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; overflow: hidden; }

        #top-ui-container {
            position: fixed; top: 15px; right: 15px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.9); border: 2px solid #00f0ff; color: #00f0ff; 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); backdrop-filter: blur(12px); 
            padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 0.9rem; 
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; 
            white-space: nowrap; pointer-events: auto;
        }

        .control-btn:active { transform: scale(0.95); }

        #instruction { 
            position: fixed; bottom: 25px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 0.95rem; padding: 0 15px; pointer-events: none; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        .floating-card { pointer-events: auto; user-select: none; max-width: 92vw; }
        .interactive-btn { pointer-events: auto; cursor: pointer; }

        .neon-box-cyan {
            border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 20px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .neon-box-magenta {
            border: 2px solid #f000ff; box-shadow: 0 0 25px rgba(240, 0, 255, 0.5), inset 0 0 20px rgba(240, 0, 255, 0.2);
            border-radius: 20px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        #about-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        .modal-close-btn { margin-top: 20px; padding: 12px 30px; background: #0ff; color: #000; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 1rem; }

        .universe-screen-card {
            border-radius: 20px; overflow: hidden;
            background: rgba(10, 6, 24, 0.95); border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0,240,255,0.4);
            pointer-events: auto; display: flex; flex-direction: column; backdrop-filter: blur(12px);
        }

        .cinema-screen-container {
            width: 900px; max-width: 95vw;
            background: rgba(5, 3, 12, 0.98);
            border: 4px solid #00f0ff;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.8), inset 0 0 40px rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .cinema-screen-container.fullscreen-mode {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            max-width: none !important; border-radius: 0 !important;
            z-index: 9999 !important; padding: 10px !important;
            justify-content: center !important;
        }
        .cinema-screen-container.fullscreen-mode .video-wrapper-box {
            flex-grow: 1 !important;
            height: auto !important;
            padding-bottom: 0 !important;
        }
        .cinema-screen-container.fullscreen-mode iframe,
        .cinema-screen-container.fullscreen-mode video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
        }

        /* Contenedor móvil adaptable en 2D */
        #mobile-bottom-dock {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92vw; max-width: 450px; z-index: 900; display: none;
            flex-direction: column; gap: 8px; pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>MENÚ</span>
        </button>
        <div id="dropdown-menu" class="hidden mt-3 w-60 neon-box-cyan p-3 flex flex-col gap-2.5 transition-all duration-300 transform scale-95 opacity-0">
            <button class="interactive-btn control-btn justify-start w-full text-xs py-2.5" onclick="requestIOSPermissions()"><span id="gyro-btn-text">GIROSCOPIO: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-xs py-2.5" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-xs py-2.5" onclick="toggleAudio()"><span id="audio-btn-text">AUDIO: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-xs py-2.5" onclick="openAboutModal()"><span>NOSOTROS</span></button>
        </div>
    </div>

    <div id="instruction">Arrastra con el dedo en 360° | Toca la esfera MS3 para entrar</div>

    <!-- Dock móvil inferior para visualización directa en pantallas pequeñas -->
    <div id="mobile-bottom-dock" class="neon-box-cyan p-3">
        <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
            <span>📺 ESTACIÓN MÓVIL: TOUR TUCUMANO</span>
            <button onclick="exitMultiverse()" class="text-fuchsia-400 font-black">✕ SALIR</button>
        </div>
        <div class="relative w-full pb-[56.25%] h-0 rounded-xl overflow-hidden border border-cyan-400/60 bg-black mt-2">
            <iframe class="absolute top-0 left-0 w-full h-full pointer-events-auto" src="https://www.youtube.com/embed/_P7bMsIi2hU" title="TOUR DE SANGUCHERÍAS 🥪" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <button onclick="openSuperCinemaFromCard('https://www.youtube.com/embed/_P7bMsIi2hU', 'TOUR DE SANGUCHERÍAS 🥪', 'iframe')" class="interactive-btn w-full bg-cyan-500 text-black font-black py-2.5 rounded-xl text-center text-xs uppercase shadow-[0_0_15px_rgba(0,240,255,0.6)] mt-2">
            ⛶ EXPANDIR A SUPER CINE CURVO
        </button>
    </div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>

        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="about-modal">
        <div class="neon-box-cyan p-6 max-w-sm text-center mx-4">
            <h2 class="text-2xl font-bold text-cyan-400 mb-3">SOBRE NOSOTROS</h2>
            <p class="text-gray-300 text-sm mb-5 leading-relaxed">Plataforma inmersiva 360° con galerías de entornos fotográficos reales y virtuales optimizada para dispositivos móviles.</p>
            <button class="modal-close-btn interactive-btn" onclick="closeAboutModal()">CERRAR</button>
        </div>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let composerLeft, composerRight;
        let planet, textGroup, planetGroup, universeSphere, starField;
        let hudGroup = null, surroundingScreensGroup = null, cinemaScreenGroup = null;
        let isTopMenuOpen = false;

        let isSystemActive = false, isGyroActive = false, isVRMode = false, isAudioActive = false;
        let audioCtx, ambientNode;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let dragDistance = 0;

        const eyeSeparation = 0.064;
        let raycaster = new THREE.Raycaster();

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const cssContainerLeft = document.getElementById('css3d-container-left');
        const cssContainerRight = document.getElementById('css3d-container-right');
        const instruction = document.getElementById('instruction');

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 4.5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        rendererLeft.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        rendererRight.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        containerRight.appendChild(rendererRight.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        cssContainerLeft.appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        cssContainerRight.appendChild(cssRendererRight.domElement);

        const renderSceneLeft = new THREE.RenderPass(scene, cameraLeft);
        const renderSceneRight = new THREE.RenderPass(scene, cameraRight);
        const renderSceneMono = new THREE.RenderPass(scene, camera);

        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);

        composerLeft = new THREE.EffectComposer(rendererLeft);
        composerLeft.addPass(renderSceneMono);
        composerLeft.addPass(bloomPass);

        composerRight = new THREE.EffectComposer(rendererRight);
        composerRight.addPass(renderSceneRight);
        composerRight.addPass(bloomPass);

        scene.add(new THREE.AmbientLight(0x3a1050, 1.5));
        const pLightCyan = new THREE.PointLight(0x00f0ff, 4, 80); pLightCyan.position.set(-8, 8, 8); scene.add(pLightCyan);
        const pLightPink = new THREE.PointLight(0xf000ff, 4, 80); pLightPink.position.set(8, -8, 8); scene.add(pLightPink);

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        const textureLoader = new THREE.TextureLoader();
        
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xf000ff), new THREE.Color(0x9d4edd), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.9 }));
        scene.add(starField);

        planetGroup = new THREE.Group();
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 3), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9 }));
        planet.position.y = -1.2;
        planetGroup.add(planet);
        scene.add(planetGroup);

        textGroup = new THREE.Group(); textGroup.position.y = 0.8;
        const fontLoader = new THREE.FontLoader();
        fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', { font: font, size: 1.0, height: 0.3, curveSegments: 8, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03 });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            const textMesh = new THREE.Mesh(textGeo, new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0 }));
            textMesh.position.x = centerOffset; textGroup.add(textMesh);
        });
        scene.add(textGroup);

        function toggleAudio() {
            isAudioActive = !isAudioActive;
            document.getElementById('audio-btn-text').innerText = isAudioActive ? 'AUDIO: ON' : 'AUDIO: OFF';
            if (isAudioActive) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playAmbientSpaceSound();
            } else {
                if (ambientNode) { ambientNode.stop(); ambientNode.disconnect(); ambientNode = null; }
            }
        }

        function playAmbientSpaceSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(55, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            ambientNode = osc;
        }

        function playClickSound() {
            if (!isAudioActive || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function toggleTopMenu(e) {
            if (e) e.stopPropagation();
            playClickSound();
            const dropdown = document.getElementById('dropdown-menu');
            isTopMenuOpen = !isTopMenuOpen;

            if (isTopMenuOpen) {
                dropdown.classList.remove('hidden');
                setTimeout(() => {
                    dropdown.classList.remove('scale-95', 'opacity-0');
                    dropdown.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                dropdown.classList.remove('scale-100', 'opacity-100');
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        function createMultiverseHUD() {
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[95vw] max-w-[650px] flex flex-col gap-4 floating-card p-4";
            mainContainer.innerHTML = `
                <div class="flex justify-between items-center">
                    <button class="interactive-btn bg-black/90 border-2 border-fuchsia-500 text-fuchsia-300 px-5 py-2.5 rounded-2xl font-black text-sm flex items-center gap-2 shadow-[0_0_20px_rgba(240,0,255,0.6)]" onclick="exitMultiverse(event)">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER</span>
                    </button>
                    <div class="flex gap-2">
                        <button onclick="switchTab('home')" class="interactive-btn control-btn px-4 py-2 text-xs">INICIO</button>
                        <button onclick="switchTab('gallery')" class="interactive-btn control-btn px-4 py-2 text-xs">360°</button>
                    </div>
                </div>

                <div id="tab-home" class="w-full neon-box-cyan p-5 flex flex-col gap-4 rounded-2xl">
                    <div>
                        <span class="text-xs font-extrabold tracking-widest text-cyan-300 uppercase">MS3 Multiverse Master</span>
                        <h1 class="text-2xl font-black text-white mt-1 drop-shadow-[0_0_10px_#00f0ff]">EL CONCIERTO DEL SIGLO</h1>
                        <p class="text-gray-300 text-xs mt-2 leading-relaxed">Explora las estaciones espaciales 3D flotantes o interactúa con el dock inferior en tu móvil.</p>
                    </div>
                </div>

                <div id="tab-gallery" class="w-full neon-box-magenta p-5 hidden flex-col gap-3 rounded-2xl">
                    <h2 class="text-lg font-black text-fuchsia-300 text-center">ENTORNO 360°</h2>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="changeEnvironment('ny')" class="interactive-btn neon-box-cyan p-3 text-cyan-300 font-bold text-xs text-center rounded-xl">Depto NY</button>
                        <button onclick="changeEnvironment('carlospaz')" class="interactive-btn neon-box-cyan p-3 text-cyan-300 font-bold text-xs text-center rounded-xl">Villa Carlos Paz</button>
                        <button onclick="changeEnvironment('futurist')" class="interactive-btn neon-box-cyan p-3 text-cyan-300 font-bold text-xs text-center rounded-xl">Sala Futurista</button>
                        <button onclick="changeEnvironment('gaming')" class="interactive-btn neon-box-cyan p-3 text-cyan-300 font-bold text-xs text-center rounded-xl">Sala RGB</button>
                        <button onclick="changeEnvironment('space')" class="interactive-btn neon-box-cyan p-3 text-cyan-300 font-bold text-xs text-center rounded-xl col-span-2">Abismo Espacial</button>
                    </div>
                </div>
            `;

            hudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.002, 0.002, 0.002);
            hudGroup.add(cssObject);
            hudGroup.position.set(0, 0, -2.0);
            cssScene.add(hudGroup);

            createSurroundingScreens();
            
            // Mostrar también el dock adaptable inferior en móvil
            document.getElementById('mobile-bottom-dock').style.display = 'flex';
        }

        function createSurroundingScreens() {
            surroundingScreensGroup = new THREE.Group();
            
            const screensData = [
                { 
                    title: 'TOUR DE SANGUCHERÍAS 🥪', 
                    type: 'iframe', 
                    url: 'https://www.youtube.com/embed/_P7bMsIi2hU', 
                    x: -4.5, y: 1.8, z: -1.0 
                },
                { 
                    title: 'Big Buck Bunny', 
                    type: 'video', 
                    url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 
                    x: 4.5, y: 1.8, z: -1.0 
                },
                { 
                    title: 'Elephants Dream', 
                    type: 'video', 
                    url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 
                    x: -4.5, y: -1.5, z: 2.0 
                },
                { 
                    title: 'Sintel Fantasy', 
                    type: 'video', 
                    url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4', 
                    x: 4.5, y: -1.5, z: 2.0 
                }
            ];

            screensData.forEach((data, i) => {
                const screenDiv = document.createElement('div');
                screenDiv.className = 'universe-screen-card interactive-btn p-3 flex flex-col gap-2 w-[280px]';
                
                let mediaContent = '';
                if (data.type === 'iframe') {
                    mediaContent = `<div class="relative w-full pb-[56.25%] h-0 rounded-lg overflow-hidden bg-black border border-cyan-500/50">
                        <iframe class="absolute top-0 left-0 w-full h-full pointer-events-auto" src="${data.url}" title="${data.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>`;
                } else {
                    mediaContent = `<div class="relative rounded-lg overflow-hidden bg-black border border-cyan-500/50">
                        <video src="${data.url}" controls playsinline class="w-full h-[140px] object-cover pointer-events-auto"></video>
                    </div>`;
                }

                screenDiv.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-cyan-300 font-bold uppercase">
                        <span>ESTACIÓN #${i + 1}</span>
                    </div>
                    ${mediaContent}
                    <span class="text-white font-bold text-sm truncate">${data.title}</span>
                    <button onclick="openSuperCinemaFromCard('${data.url}', '${data.title}', '${data.type}')" class="interactive-btn w-full bg-cyan-500 text-black font-black py-2 rounded-xl text-center text-xs uppercase shadow-[0_0_15px_rgba(0,240,255,0.6)]">
                        🎬 EXPANDIR A CINE CURVO
                    </button>
                `;

                const cssObj = new THREE.CSS3DObject(screenDiv);
                cssObj.scale.set(0.0022, 0.0022, 0.0022);
                cssObj.position.set(data.x, data.y, data.z);
                cssObj.lookAt(0, 0, 0);

                surroundingScreensGroup.add(cssObj);
            });

            cssScene.add(surroundingScreensGroup);
        }

        function openSuperCinemaFromCard(url, titleText, type) {
            playClickSound();
            if (cinemaScreenGroup) {
                cssScene.remove(cinemaScreenGroup);
                cinemaScreenGroup = null;
            }

            const cinemaDiv = document.createElement('div');
            cinemaDiv.className = 'cinema-screen-container';
            cinemaDiv.id = 'active-cinema-container';
            
            let innerMedia = '';
            if (type === 'iframe') {
                innerMedia = `<iframe class="absolute top-0 left-0 w-full h-full pointer-events-auto" src="${url}?autoplay=1" title="${titleText}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
            } else {
                innerMedia = `<video src="${url}" controls autoplay playsinline class="w-full max-h-[400px] object-contain"></video>`;
            }

            cinemaDiv.innerHTML = `
                <div class="flex justify-between items-center border-b border-cyan-500/40 pb-3">
                    <span class="text-cyan-400 font-black text-sm md:text-xl tracking-wider uppercase truncate max-w-[60%]">${titleText}</span>
                    <div class="flex gap-2">
                        <button onclick="toggleCinemaFullscreen()" class="interactive-btn bg-cyan-500 text-black font-black px-3 py-1.5 rounded-xl text-[10px] md:text-xs shadow-[0_0_15px_rgba(0,240,255,0.8)]" id="fullscreen-btn-text">
                            ⛶ PANTALLA COMPLETA
                        </button>
                        <button onclick="closeSuperCinema()" class="interactive-btn bg-fuchsia-600 text-white font-black px-3 py-1.5 rounded-xl text-[10px] md:text-xs shadow-[0_0_15px_rgba(240,0,255,0.8)]">
                            ✕ CERRAR
                        </button>
                    </div>
                </div>
                <div class="video-wrapper-box relative w-full pb-[56.25%] h-0 rounded-2xl overflow-hidden border-2 border-cyan-400 shadow-[0_0_30px_rgba(0,240,255,0.4)] bg-black flex justify-center items-center">
                    ${innerMedia}
                </div>
            `;

            cinemaScreenGroup = new THREE.Group();
            const cssObj = new THREE.CSS3DObject(cinemaDiv);
            cssObj.scale.set(0.003, 0.003, 0.003);
            cssObj.position.set(0, 0.5, -2.5);
            cinemaScreenGroup.add(cssObj);
            cssScene.add(cinemaScreenGroup);

            if (hudGroup) hudGroup.visible = false;
        }

        function toggleCinemaFullscreen() {
            playClickSound();
            const container = document.getElementById('active-cinema-container');
            const btnText = document.getElementById('fullscreen-btn-text');
            if (!container) return;

            container.classList.toggle('fullscreen-mode');
            const isFull = container.classList.contains('fullscreen-mode');
            btnText.innerText = isFull ? '🗗 SALIR' : '⛶ PANTALLA COMPLETA';
        }

        function closeSuperCinema() {
            playClickSound();
            if (cinemaScreenGroup) {
                cssScene.remove(cinemaScreenGroup);
                cinemaScreenGroup = null;
            }
            if (hudGroup) hudGroup.visible = true;
        }

        function switchTab(tab) {
            playClickSound();
            const home = document.getElementById('tab-home');
            const gallery = document.getElementById('tab-gallery');
            if (tab === 'home') {
                home.classList.remove('hidden'); home.classList.add('flex');
                gallery.classList.remove('flex'); gallery.classList.add('hidden');
            } else {
                gallery.classList.remove('hidden'); gallery.classList.add('flex');
                home.classList.remove('flex'); home.classList.add('hidden');
            }
        }

        function changeEnvironment(type) {
            playClickSound();
            let urls = {
                'ny': 'https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1200&auto=format&fit=crop',
                'carlospaz': 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop',
                'futurist': 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop',
                'gaming': 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop'
            };

            if (type === 'space') {
                universeSphere.material.map = null;
                universeSphere.material.color.setHex(0x070216);
                universeSphere.material.needsUpdate = true;
                starField.visible = true;
            } else {
                starField.visible = false;
                textureLoader.load(urls[type], (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.repeat.x = -1;
                    universeSphere.material.map = texture;
                    universeSphere.material.color.setHex(0xffffff);
                    universeSphere.material.needsUpdate = true;
                });
            }
        }

        function openAboutModal() {
            playClickSound();
            document.getElementById('about-modal').style.display = 'flex';
        }

        function closeAboutModal() {
            playClickSound();
            document.getElementById('about-modal').style.display = 'none';
        }

        function exitMultiverse(e) {
            if (e) e.stopPropagation();
            playClickSound();
            if (hudGroup) { cssScene.remove(hudGroup); hudGroup = null; }
            if (surroundingScreensGroup) { cssScene.remove(surroundingScreensGroup); surroundingScreensGroup = null; }
            if (cinemaScreenGroup) { cssScene.remove(cinemaScreenGroup); cinemaScreenGroup = null; }
            
            // Ocultar dock móvil inferior
            document.getElementById('mobile-bottom-dock').style.display = 'none';

            gsap.to(cameraRig.position, { x: 0, y: 0, z: 4.5, duration: 1.2, ease: 'power2.inOut' });
            gsap.to(planetGroup.scale, { x: 1, y: 1, z: 1, duration: 1.2 });
            gsap.to(textGroup.position, { y: 0.8, duration: 1.2 });
            isSystemActive = false;
            instruction.style.opacity = 1;
            instruction.innerText = "Arrastra con el dedo en 360° | Toca la esfera MS3 para entrar";
        }

        function enterMultiverse() {
            if (isSystemActive) return;
            playClickSound();
            isSystemActive = true;
            createMultiverseHUD();
            gsap.to(cameraRig.position, { x: 0, y: 0, z: 0, duration: 1.2, ease: 'power2.inOut' });
            gsap.to(planetGroup.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 1.2 });
            gsap.to(textGroup.position, { y: 3.5, duration: 1.2 });
            instruction.style.opacity = 0;
        }

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            dragDistance = 0;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            targetRotationX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, targetRotationX));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (dragDistance < 10 && !isSystemActive) {
                const mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(planet);
                if (intersects.length > 0) {
                    enterMultiverse();
                }
            }
        });

        function toggleVRMode() {
            playClickSound();
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.getElementById('vr-btn-text').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';
            handleResize();
        }

        function requestIOSPermissions() {
            playClickSound();
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        isGyroActive = true;
                        document.getElementById('gyro-btn-text').innerText = 'GIROSCOPIO: ON';
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    }
                }).catch(console.error);
            } else {
                isGyroActive = !isGyroActive;
                document.getElementById('gyro-btn-text').innerText = isGyroActive ? 'GIROSCOPIO: ON' : 'GIROSCOPIO: OFF';
                if (isGyroActive) {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                } else {
                    window.removeEventListener('deviceorientation', handleOrientation, true);
                }
            }
        }

        function handleOrientation(e) {
            if (!isGyroActive || !e.alpha) return;
            const alpha = THREE.MathUtils.degToRad(e.alpha);
            const beta = THREE.MathUtils.degToRad(e.beta);
            const gamma = THREE.MathUtils.degToRad(e.gamma);
            const zee = new THREE.Vector3(0, 0, 1);
            const cameraQuaternion = new THREE.Quaternion();
            const euler = new THREE.Euler();

            euler.set(beta, alpha, -gamma, 'YXZ');
            cameraQuaternion.setFromEuler(euler);
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;
            cameraQuaternion.multiply(new THREE.Quaternion().setFromAxisAngle(zee, -orient));
            cameraRig.quaternion.copy(cameraQuaternion);
        }

        function handleResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            cameraLeft.aspect = (width / 2) / height;
            cameraLeft.updateProjectionMatrix();

            cameraRight.aspect = (width / 2) / height;
            cameraRight.updateProjectionMatrix();

            rendererLeft.setSize(width, height);
            rendererRight.setSize(width, height);
            cssRendererLeft.setSize(width, height);
            cssRendererRight.setSize(width / 2, height);
            composerLeft.setSize(width, height);
            composerRight.setSize(width, height);
        }

        window.addEventListener('resize', handleResize);

        function animate() {
            requestAnimationFrame(animate);

            currentRotationX += (targetRotationX - currentRotationX) * 0.1;
            currentRotationY += (targetRotationY - currentRotationY) * 0.1;

            if (!isGyroActive) {
                cameraRig.rotation.y = currentRotationY;
                cameraRig.rotation.x = currentRotationX;
            }

            if (planetGroup) planetGroup.rotation.y += 0.005;

            if (isVRMode) {
                rendererLeft.autoClear = false;
                rendererLeft.clear();
                composerLeft.render();
                cssRendererLeft.render(cssScene, cameraLeft);

                rendererRight.autoClear = false;
                rendererRight.clear();
                composerRight.render();
                cssRendererRight.render(cssScene, cameraRight);
            } else {
                composerLeft.render();
                cssRendererLeft.render(cssScene, camera);
            }
        }

        animate();
    </script>
</body>
</html>
