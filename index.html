<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Multiverso Inmersivo VR 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; user-select: none; touch-action: none; }
        #vr-view-container { display: flex; width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 2; cursor: grab; }
        .vr-eye { position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }
        .webgl-canvas-container, .css3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .css3d-container { z-index: 10; }
        #top-ui-container { position: fixed; top: 20px; right: 20px; z-index: 1000; pointer-events: auto; }
        .control-btn { background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; padding: 12px 24px; border-radius: 9999px; cursor: pointer; pointer-events: auto; }
        #preview-modal, #video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .neon-box-magenta { border: 3px solid #f000ff; background: rgba(10, 6, 24, 0.95); border-radius: 24px; }
    </style>
</head>
<body>

    <div id="top-ui-container">
        <button class="control-btn" onclick="toggleVRMode()"><span>VR MODE</span></button>
    </div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left"><div class="webgl-canvas-container" id="canvas-container-left"></div><div class="css3d-container" id="css3d-container-left"></div></div>
        <div class="vr-eye" id="eye-right"><div class="webgl-canvas-container" id="canvas-container-right"></div><div class="css3d-container" id="css3d-container-right"></div></div>
    </div>

    <!-- Video 360 oculto -->
    <video id="video360" loop crossOrigin="anonymous" playsinline style="display:none;">
        <!-- Se requiere un archivo .mp4 directo para la textura -->
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
    </video>

    <div id="preview-modal">
        <div class="neon-box-magenta p-8 max-w-lg w-full flex flex-col gap-5">
            <h2 class="text-3xl font-black text-white">Video VR 360</h2>
            <button class="control-btn" onclick="start360Experience()">REPRODUCIR 360 VR</button>
            <button class="control-btn" onclick="document.getElementById('preview-modal').style.display='none'">CERRAR</button>
        </div>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let videoSphere, videoTexture;
        let isVRMode = false;

        // Inicialización básica
        scene = new THREE.Scene();
        cssScene = new THREE.Scene();
        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, 0.5, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, 0.5, 0.1, 1000);
        cameraRig.add(camera); cameraRig.add(cameraLeft); cameraRig.add(cameraRight);
        
        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        document.getElementById('canvas-container-left').appendChild(rendererLeft.domElement);
        document.getElementById('canvas-container-right').appendChild(rendererRight.domElement);

        // Setup Video 360
        function init360Video() {
            const video = document.getElementById('video360');
            videoTexture = new THREE.VideoTexture(video);
            const geometry = new THREE.SphereGeometry(50, 60, 40);
            geometry.scale(-1, 1, 1);
            videoSphere = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: videoTexture }));
            videoSphere.visible = false;
            scene.add(videoSphere);
        }

        function start360Experience() {
            document.getElementById('preview-modal').style.display = 'none';
            videoSphere.visible = true;
            document.getElementById('video360').play();
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isVRMode) {
                rendererLeft.render(scene, cameraLeft);
                rendererRight.render(scene, cameraRight);
            } else {
                rendererLeft.render(scene, camera);
            }
        }

        init360Video();
        animate();
    </script>
</body>
</html>
