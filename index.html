<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS3 - Transición al Metaverso</title>
  <style>
    /* RESET & ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0c10;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* NAVEGACIÓN Y HERO */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(11, 12, 16, 0.8);
      backdrop-filter: blur(5px);
    }

    .logo-container {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.08);
    }

    .logo-svg {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 8px #00f2fe);
    }

    .logo-text {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* SECCIONES DE LA PÁGINA */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    #inicio {
      background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
    }

    #metaverso-ms3 {
      background: radial-gradient(circle at center, #0f0c1b 0%, #05020a 100%);
      border-top: 1px solid rgba(0, 242, 254, 0.2);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 3.5rem;
      color: #00f2fe;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      margin-bottom: 15px;
    }

    p {
      max-width: 600px;
      color: #c5c6c7;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .hint {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 10px 20px;
      border-radius: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* CANVAS UNIVERSO (OVERLAY DE TRANSICIÓN) */
    #universe-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transition: opacity 0.4s ease;
      background: #000000;
    }

    #universe-canvas.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN -->
  <header>
    <div class="logo-container" id="logo-ms3" title="Haz clic para viajar al Metaverso">
      <!-- Logo vectorial generado dinámicamente -->
      <svg class="logo-svg" viewBox="0 0 100 100">
        <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="#00f2fe" stroke-width="4"/>
        <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">MS3</text>
      </svg>
      <span class="logo-text">MS3</span>
    </div>
  </header>

  <!-- CANVAS EFECTO UNIVERSO -->
  <canvas id="universe-canvas"></canvas>

  <!-- SECCIÓN PRINCIPAL -->
  <section id="inicio">
    <h1>Bienvenido a MS3 Web</h1>
    <p>Explora nuestras herramientas y tecnología de vanguardia.</p>
    <div class="hint">↖ Haz clic en el logo de MS3 para saltar al Metaverso</div>
  </section>

  <!-- SECCIÓN METAVERSO DE DESTINO -->
  <section id="metaverso-ms3">
    <h2>METAVERSO MS3</h2>
    <p>Has ingresado a la nueva dimensión digital. Bienvenido al entorno inmersivo de MS3 donde los límites físicos desaparecen.</p>
  </section>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    const canvas = document.getElementById('universe-canvas');
    const ctx = canvas.getContext('2d');
    const logo = document.getElementById('logo-ms3');
    const targetSection = document.getElementById('metaverso-ms3');

    let stars = [];
    const numStars = 1000;
    let speed = 2;
    let baseSpeed = 2;
    let maxSpeed = 80;
    let isAnimating = false;
    let animationId = null;

    // Redimensionar Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Inicializar Posición de las Estrellas
    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: (Math.random() - 0.5) * canvas.width * 2,
          y: (Math.random() - 0.5) * canvas.height * 2,
          z: Math.random() * canvas.width
        });
      }
    }
    initStars();

    // Bucle de Renderizado del Universo 3D
    function render() {
      // Fondo negro profundo
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Traza leve para efecto estela
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      stars.forEach(star => {
        // Mover estrella hacia la cámara
        star.z -= speed;

        // Si sobrepasa la pantalla, se reinicia al fondo
        if (star.z <= 0) {
          star.z = canvas.width;
          star.x = (Math.random() - 0.5) * canvas.width * 2;
          star.y = (Math.random() - 0.5) * canvas.height * 2;
        }

        // Proyección perspectiva 3D a 2D
        const k = 256 / star.z;
        const px = star.x * k + cx;
        const py = star.y * k + cy;

        if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
          const size = Math.max(0.5, (1 - star.z / canvas.width) * 3);
          
          // Color dinámico según la velocidad (Pasa de blanco a azul cian)
          const shade = Math.floor((1 - star.z / canvas.width) * 255);
          ctx.fillStyle = speed > 20 ? '#00f2fe' : `rgb(${shade}, ${shade}, ${shade})`;

          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (isAnimating) {
        animationId = requestAnimationFrame(render);
      }
    }

    // DISPARADOR DE LA TRANSICIÓN
    logo.addEventListener('click', () => {
      if (isAnimating) return; // Evitar múltiples clics continuos

      isAnimating = true;
      speed = baseSpeed;
      canvas.classList.add('active');
      render();

      // Fase 1: Aceleración (Salto a hipervelocidad)
      let acceleration = setInterval(() => {
        speed += 3;
        if (speed >= maxSpeed) {
          clearInterval(acceleration);

          // Fase 2: Hacer el Scroll al Metaverso en el pico de velocidad
          targetSection.scrollIntoView({ behavior: 'smooth' });

          // Fase 3: Desacelerar y desvanecer overlay
          setTimeout(() => {
            canvas.classList.remove('active');
            
            setTimeout(() => {
              isAnimating = false;
              cancelAnimationFrame(animationId);
              speed = baseSpeed;
            }, 500);

          }, 800);
        }
      }, 20);
    });
  </script>
</body>
</html>
