<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Universo 360 VR Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; }

        #top-ui-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }

        .gaze-reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.6); z-index: 999; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); display: flex; align-items: center; justify-content: center;
        }

        .gaze-dot { width: 6px; height: 6px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 8px #00f0ff; }

        .gaze-progress {
            position: absolute; top: -4px; left: -4px; width: 36px; height: 36px;
            border-radius: 50%; border: 3px solid transparent; opacity: 0; transition: opacity 0.2s ease;
        }

        .gaze-reticle.active .gaze-progress {
            opacity: 1; animation: gazeFill 3s linear forwards;
        }

        @keyframes gazeFill {
            0% { transform: rotate(0deg); border-top-color: #00f0ff; }
            50% { border-right-color: #f000ff; border-bottom-color: #f000ff; }
            100% { transform: rotate(360deg); border-color: #f000ff; }
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto;
        }

        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }

        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        .floating-card { pointer-events: auto; user-select: none; }
        .interactive-btn { pointer-events: auto; transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }
        .interactive-btn.gaze-hover, .floating-card.gaze-hover { transform: scale(1.04); border-color: #f000ff !important; }

        .neon-box-cyan {
            border: 3px solid #00f0ff; box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .neon-box-magenta {
            border: 3px solid #f000ff; box-shadow: 0 0 35px rgba(240, 0, 255, 0.6), inset 0 0 30px rgba(240, 0, 255, 0.3);
            border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .netflix-card {
            flex: 0 0 260px; height: 380px; border-radius: 16px; overflow: hidden; position: relative;
            border: 2px solid rgba(0, 240, 255, 0.4); transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; background: #111;
        }
        .netflix-card:hover, .netflix-card.gaze-hover {
            transform: scale(1.08); border-color: #f000ff; box-shadow: 0 0 25px rgba(240, 0, 255, 0.8); z-index: 10;
        }
        .netflix-card img { width: 100%; height: 100%; object-fit: cover; }
        .netflix-card .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }

        #video-modal, #about-modal, #preview-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px #0ff; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>MENÚ</span>
        </button>
        <div id="dropdown-menu" class="hidden mt-3 w-64 neon-box-cyan p-4 flex flex-col gap-3 transition-all duration-300 transform scale-95 opacity-0">
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="requestIOSPermissions()"><span id="gyro-btn-text">GIROSCOPIO: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="openAboutModal()"><span>NOSOTROS</span></button>
        </div>
    </div>

    <div id="instruction">Arrastra con el dedo/mouse en 360° | Toca la esfera MS3 para entrar</div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="gaze-reticle" id="reticle-left"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>

        <div class="vr-eye" id="eye-right">
            <div class="gaze-reticle" id="reticle-right"><div class="gaze-dot"></div><div class="gaze-progress"></div></div>
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="preview-modal">
        <div class="neon-box-magenta p-10 max-w-2xl w-full flex flex-col gap-6 relative">
            <h2 id="preview-title" class="text-4xl font-black text-white drop-shadow-[0_0_15px_#f000ff]">Título del Programa</h2>
            <p id="preview-desc" class="text-gray-300 text-lg leading-relaxed">Descripción detallada del contenido inmersivo VR exclusivo del multiverso.</p>
            <div class="flex gap-4 mt-4">
                <button id="preview-play-btn" class="interactive-btn bg-cyan-400 text-black px-8 py-4 rounded-xl font-black text-xl shadow-[0_0_20px_#00f0ff]" onclick="playFromPreview()">REPRODUCIR</button>
                <button class="interactive-btn bg-transparent border-2 border-white text-white px-8 py-4 rounded-xl font-bold text-xl" onclick="closePreviewModal()">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="video-modal">
        <video id="active-video" controls autoplay playsinline></video>
        <button class="modal-close-btn interactive-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <div id="about-modal">
        <div class="neon-box-cyan p-8 max-w-md text-center">
            <h2 class="text-3xl font-bold text-cyan-400 mb-4">SOBRE NOSOTROS</h2>
            <p class="text-gray-300 mb-6">Plataforma inmersiva 360° diseñada para experiencias interactivas y realidad virtual.</p>
            <button class="modal-close-btn interactive-btn" onclick="closeAboutModal()">CERRAR</button>
        </div>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let planet, textGroup, planetGroup, universeSphere, starField;
        let hudGroup = null;
        let isTopMenuOpen = false;
        let currentActiveView = 'home'; // 'home', 'multiverse', 'vr-programs'
        let selectedVideoData = null;

        let isSystemActive = false, isGyroActive = false, isVRMode = false;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let dragDistance = 0;

        let deviceQuaternion = new THREE.Quaternion();
        const eyeSeparation = 0.064;

        let raycaster = new THREE.Raycaster();
        let gazeTarget = null;
        let gazeTimer = null;
        const GAZE_TIME = 3000;

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const cssContainerLeft = document.getElementById('css3d-container-left');
        const cssContainerRight = document.getElementById('css3d-container-right');
        const instruction = document.getElementById('instruction');

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        containerRight.appendChild(rendererRight.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        cssContainerLeft.appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        cssContainerRight.appendChild(cssRendererRight.domElement);

        scene.add(new THREE.AmbientLight(0x3a1050, 1.5));
        const pLightCyan = new THREE.PointLight(0x00f0ff, 4, 80); pLightCyan.position.set(-8, 8, 8); scene.add(pLightCyan);
        const pLightPink = new THREE.PointLight(0xf000ff, 4, 80); pLightPink.position.set(8, -8, 8); scene.add(pLightPink);

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xf000ff), new THREE.Color(0x9d4edd), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.9 }));
        scene.add(starField);

        planetGroup = new THREE.Group();
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.9 }));
        planet.position.y = -1.5;
        planetGroup.add(planet);
        scene.add(planetGroup);

        textGroup = new THREE.Group(); textGroup.position.y = 0.8;
        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', { font: font, size: 1.2, height: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05 });
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            const textMesh = new THREE.Mesh(textGeo, new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0 }));
            textMesh.position.x = centerOffset; textGroup.add(textMesh);
        });
        scene.add(textGroup);

        function toggleTopMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('dropdown-menu');
            isTopMenuOpen = !isTopMenuOpen;

            if (isTopMenuOpen) {
                dropdown.classList.remove('hidden');
                setTimeout(() => {
                    dropdown.classList.remove('scale-95', 'opacity-0');
                    dropdown.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                dropdown.classList.remove('scale-100', 'opacity-100');
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        function createMultiverseHUD() {
            destroyMultiverseHUD();
            currentActiveView = 'multiverse';
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[1600px] flex flex-col gap-10 floating-card";
            mainContainer.innerHTML = `
                <button class="interactive-btn self-start bg-black/95 border-6 border-fuchsia-500 text-fuchsia-300 px-14 py-7 rounded-full font-black text-3xl flex items-center gap-6 shadow-[0_0_50px_rgba(240,0,255,0.9)] tracking-widest" onclick="exitMultiverse(event)">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span>VOLVER AL INICIO</span>
                </button>

                <div class="w-full neon-box-cyan p-12 flex flex-col justify-between h-[580px] rounded-3xl" style="background-image: linear-gradient(to right, rgba(10,6,24,0.95), rgba(10,6,24,0.6)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1600&auto=format&fit=crop'); background-size: cover;">
                    <div>
                        <span class="text-xl font-extrabold tracking-widest text-cyan-300 uppercase">MS3 Multiverse Live</span>
                        <h1 class="text-7xl font-black text-white mt-4 drop-shadow-[0_0_20px_#00f0ff]">EL CONCIERTO DEL SIGLO</h1>
                        <p class="text-gray-200 text-2xl mt-4 max-w-2xl leading-relaxed">Experiencia inmersiva 360° en vivo transmitida directamente desde el núcleo del Multiverso MS3.</p>
                    </div>
                    <div class="flex gap-6">
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black px-12 py-5 rounded-2xl font-black text-2xl shadow-[0_0_30px_#fff]">REPRODUCIR AHORA</button>
                    </div>
                </div>

                <div class="w-full grid grid-cols-3 gap-8">
                    <button onclick="openVRPrograms(event)" class="interactive-btn pill-btn neon-box-cyan py-7 text-cyan-300 font-black text-2xl text-center">PROGRAMAS VR</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn pill-btn neon-box-magenta py-7 text-fuchsia-300 font-black text-2xl text-center">PROGRAMAS 2D</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn pill-btn neon-box-cyan py-7 text-cyan-300 font-black text-2xl text-center">CANAL EN VIVO</button>
                </div>
            `;

            hudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.0055, 0.0055, 0.0055);
            hudGroup.add(cssObject);
            
            const isMobile = window.innerWidth <= 768;
            hudGroup.position.set(0, 0, isMobile ? -5.5 : -4.5);
            cssScene.add(hudGroup);
        }

        function openVRPrograms(e) {
            if (e) e.stopPropagation();
            destroyMultiverseHUD();
            currentActiveView = 'vr-programs';

            const vrContainer = document.createElement('div');
            vrContainer.className = "w-[1600px] flex flex-col gap-8 floating-card pb-12";
            vrContainer.innerHTML = `
                <div class="flex items-center justify-between">
                    <button class="interactive-btn bg-black/95 border-4 border-cyan-400 text-cyan-300 px-10 py-5 rounded-full font-black text-2xl flex items-center gap-4 shadow-[0_0_30px_rgba(0,240,255,0.7)]" onclick="createMultiverseHUD()">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER AL MULTIVERSO</span>
                    </button>
                    <h1 class="text-5xl font-black text-white drop-shadow-[0_0_20px_#00f0ff] uppercase tracking-wider">PROGRAMAS VR</h1>
                </div>

                <div class="flex flex-col gap-4">
                    <h2 class="text-3xl font-bold text-cyan-300">EXPLORACIÓN ESPACIAL 360°</h2>
                    <div class="flex gap-6 overflow-x-auto pb-4 pt-2 px-2 no-scrollbar">
                        <div class="netflix-card interactive-btn" onclick="openPreview('Viaje a Marte 360', 'Explora las dunas rojas y bases espaciales de la próxima frontera humana con total libertad de movimiento.', 'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
                            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=600&auto=format&fit=crop" alt="Marte">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Viaje a Marte</h3><p class="text-cyan-300 text-sm">VR 360° • 4K</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Estación Espacial ISS', 'Vive un día completo flotando en órbita terrestre dentro de la Estación Espacial Internacional.', 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
                            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop" alt="ISS">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Estación ISS</h3><p class="text-cyan-300 text-sm">Inmersivo • 60FPS</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Nebulosa de Orión', 'Un viaje psicodélico y científico a través del nacimiento de nuevas estrellas en el cosmos profundo.', 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
                            <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop" alt="Orión">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Nebulosa Orión</h3><p class="text-cyan-300 text-sm">Cinemático 3D</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Agujero Negro', 'Traspasa el horizonte de sucesos en una simulación física interactiva sin precedentes.', 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
                            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=600&auto=format&fit=crop" alt="Agujero Negro">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Agujero Negro</h3><p class="text-cyan-300 text-sm">Ficción • VR</p></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-4">
                    <h2 class="text-3xl font-bold text-fuchsia-300">DIMENSIONES ALTERNATIVAS</h2>
                    <div class="flex gap-6 overflow-x-auto pb-4 pt-2 px-2 no-scrollbar">
                        <div class="netflix-card interactive-btn" onclick="openPreview('Cyberpunk City 2099', 'Recorre las calles iluminadas por neón de una metrópolis futurista gobernada por inteligencias artificiales.', 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" alt="Cyberpunk">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Cyberpunk 2099</h3><p class="text-fuchsia-300 text-sm">Interactivo</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Bosque Bioluminiscente', 'Un santuario natural alienígena donde cada planta responde a tu presencia visual.', 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
                            <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=600&auto=format&fit=crop" alt="Bosque">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Bosque Místico</h3><p class="text-fuchsia-300 text-sm">Relax VR</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Templo Cudimensional', 'Geometría sagrada y acertijos visuales en un espacio de cuatro dimensiones espaciales.', 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
                            <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop" alt="Templo">
                            <div class="card-info"><h3 class="text-white text-xl font-bold">Templo 4D</h3><p class="text-fuchsia-300 text-sm">Puzzle VR</p></div>
                        </div>
                    </div>
                </div>
            `;

            hudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(vrContainer);
            cssObject.scale.set(0.0055, 0.0055, 0.0055);
            hudGroup.add(cssObject);
            
            const isMobile = window.innerWidth <= 768;
            hudGroup.position.set(0, 0, isMobile ? -5.5 : -4.5);
            cssScene.add(hudGroup);
            gsap.fromTo(hudGroup.scale, { x: 0.01, y: 0.01, z: 0.01 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: "back.out(1.4)" });
        }

        function openPreview(title, desc, imgUrl, videoUrl) {
            selectedVideoData = videoUrl;
            document.getElementById('preview-title').innerText = title;
            document.getElementById('preview-desc').innerText = desc;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function playFromPreview() {
            closePreviewModal();
            if (selectedVideoData) {
                openVideo(selectedVideoData);
            }
        }

        function destroyMultiverseHUD() {
            if (hudGroup) { 
                cssScene.remove(hudGroup); 
                hudGroup = null; 
            }
        }

        function checkGazePointer() {
            let elementToTrigger = null;

            if (!isSystemActive) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), isVRMode ? cameraLeft : camera);
                const intersects = raycaster.intersectObjects([planet]);
                if (intersects.length > 0) elementToTrigger = planet;
            }
            
            if (!elementToTrigger) {
                const centerElement = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
                if (centerElement && centerElement.closest('.interactive-btn')) {
                    elementToTrigger = centerElement.closest('.interactive-btn');
                }
            }

            if (elementToTrigger) {
                if (gazeTarget !== elementToTrigger) {
                    resetGazeTimer();
                    gazeTarget = elementToTrigger;
                    document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.add('active'));
                    if (gazeTarget.classList) gazeTarget.classList.add('gaze-hover');

                    gazeTimer = setTimeout(() => {
                        triggerGazeAction(gazeTarget);
                        resetGazeTimer();
                    }, GAZE_TIME);
                }
            } else {
                resetGazeTimer();
            }
        }

        function resetGazeTimer() {
            if (gazeTimer) clearTimeout(gazeTimer);
            if (gazeTarget && gazeTarget.classList) gazeTarget.classList.remove('gaze-hover');
            gazeTarget = null;
            gazeTimer = null;
            document.querySelectorAll('.gaze-reticle').forEach(r => r.classList.remove('active'));
        }

        function triggerGazeAction(target) {
            if (target === planet) enterMultiverse();
            else if (target && typeof target.click === 'function') target.click();
        }

        function onPointerDown(e) {
            if (e.target.closest('#top-ui-container') || e.target.closest('#video-modal') || e.target.closest('#about-modal') || e.target.closest('#preview-modal')) return;
            isDragging = true;
            dragDistance = 0;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x, y };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;

            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

            targetRotationY += deltaX * 0.004;
            targetRotationX += deltaY * 0.004;
            targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));

            previousMousePosition = { x, y };
        }

        function onPointerUp(e) {
            if (isDragging && dragDistance < 10 && !isSystemActive) {
                if (!e.target.closest('#top-ui-container')) {
                    enterMultiverse();
                }
            }
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        function requestIOSPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(resp => {
                    if (resp === 'granted') setGyro(!isGyroActive);
                }).catch(console.error);
            } else setGyro(!isGyroActive);
        }

        function handleOrientation(e) {
            if (!isGyroActive) return;
            const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
            const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
            const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(euler);

            const orientFix = new THREE.Quaternion();
            orientFix.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
            deviceQuaternion.multiply(orientFix);
        }

        function setGyro(enable) {
            isGyroActive = enable;
            const text = isGyroActive ? 'GIROSCOPIO: ON' : 'GIROSCOPIO: OFF';
            const gyroTextEl = document.getElementById('gyro-btn-text');
            if (gyroTextEl) gyroTextEl.innerText = text;

            if (isGyroActive) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                if (!isVRMode) toggleVRMode();
            } else {
                window.removeEventListener('deviceorientation', handleOrientation, true);
                cameraRig.quaternion.set(0, 0, 0, 1);
                targetRotationX = 0; targetRotationY = 0;
            }
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            const vrTextEl = document.getElementById('vr-btn-text');
            if (vrTextEl) vrTextEl.innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';

            if (isVRMode && !isGyroActive) requestIOSPermissions();
            onWindowResize();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGyroActive) {
                cameraRig.quaternion.slerp(deviceQuaternion, 0.2);
            } else {
                currentRotationX += (targetRotationX - currentRotationX) * 0.08;
                currentRotationY += (targetRotationY - currentRotationY) * 0.08;
                cameraRig.rotation.x = currentRotationX;
                cameraRig.rotation.y = currentRotationY;
            }

            planet.rotation.y += 0.008;
            textGroup.rotation.y += 0.006;
            starField.rotation.y += 0.0005;

            checkGazePointer();

            if (isVRMode) {
                rendererLeft.render(scene, cameraLeft);
                rendererRight.render(scene, cameraRight);
                cssRendererLeft.render(cssScene, cameraLeft);
                cssRendererRight.render(cssScene, cameraRight);
            } else {
                rendererLeft.render(scene, camera);
                cssRendererLeft.render(cssScene, camera);
            }
        }
        animate();

        function enterMultiverse() {
            if (isSystemActive) return;
            isSystemActive = true;
            instruction.style.opacity = '0';

            gsap.to(cameraRig.position, { 
                z: 0.0, 
                duration: 1.2, 
                ease: "power2.inOut" 
            });

            gsap.to(planetGroup.scale, { x: 4, y: 4, z: 4, duration: 1.0, opacity: 0 });
            gsap.to(textGroup.scale, { x: 3, y: 3, z: 3, duration: 1.0, onComplete: () => {
                planetGroup.visible = false;
                textGroup.visible = false;
                
                createMultiverseHUD();
            }});
        }

        function exitMultiverse(event) {
            if (event) event.stopPropagation();
            if (!isSystemActive) return;

            destroyMultiverseHUD();
            currentActiveView = 'home';
            
            planetGroup.visible = true;
            textGroup.visible = true;
            planetGroup.scale.set(1, 1, 1);
            textGroup.scale.set(1, 1, 1);

            gsap.to(cameraRig.position, { 
                z: 5, 
                duration: 1.2, 
                ease: "power2.inOut",
                onComplete: () => {
                    isSystemActive = false;
                    instruction.style.opacity = '1';
                }
            });
        }

        function openAboutModal() { document.getElementById('about-modal').style.display = 'flex'; }
        function closeAboutModal() { document.getElementById('about-modal').style.display = 'none'; }
        function openVideo(url) {
            const v = document.getElementById('active-video');
            v.src = url;
            document.getElementById('video-modal').style.display = 'flex';
            v.play();
        }
        function closeVideo() {
            const v = document.getElementById('active-video');
            v.pause(); v.src = "";
            document.getElementById('video-modal').style.display = 'none';
        }

        function onWindowResize() {
            const width = isVRMode ? window.innerWidth / 2 : window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = window.innerWidth / height;
            camera.updateProjectionMatrix();

            cameraLeft.aspect = width / height;
            cameraLeft.updateProjectionMatrix();
            cameraRight.aspect = width / height;
            cameraRight.updateProjectionMatrix();

            rendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            rendererRight.setSize(width, height);

            cssRendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            cssRendererRight.setSize(width, height);
        }
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
