<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        
        #instruction-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; padding: 20px; text-align: center;
            transition: opacity 0.5s ease;
        }

        #start-btn, #vr-btn {
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
        }
        #start-btn:hover, #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10; display: none;
        }
        #instruction { color: #fff; font-size: 1.1rem; margin-bottom: 20px; max-width: 400px; }
    </style>
</head>
<body>

    <div id="instruction-overlay">
        <div id="instruction">Bienvenido a la experiencia inmersiva MS3. Pulsa el botón para calibrar los sensores de tu dispositivo.</div>
        <button id="start-btn">Iniciar Experiencia</button>
    </div>

    <button id="vr-btn">Ver en VR</button>
    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const vrBtn = document.getElementById('vr-btn');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('instruction-overlay');

        let isSystemActive = false;
        let isVRMode = false;
        let internalScene, internalCamera, internalRenderer, stars;
        let targetQuaternion = new THREE.Quaternion();
        let baseOrientation = new THREE.Quaternion();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const planet = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
        scene.add(planet);
        camera.position.z = 5;

        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
            const starPositions = new Float32Array(3000);
            for(let i=0; i<3000; i++) starPositions[i] = (Math.random() - 0.5) * 100;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            const screenGeometry = new THREE.PlaneGeometry(2, 1.5);
            const material = new THREE.MeshBasicMaterial({ color: 0x0ff, wireframe: true });
            for(let y = -1; y <= 1; y++) {
                for(let x = -2; x <= 2; x++) {
                    const screen = new THREE.Mesh(screenGeometry, material);
                    screen.position.set(x * 2.2, y * 1.7, -5);
                    internalScene.add(screen);
                }
            }
            vrBtn.style.display = 'block';
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            const zee = new THREE.Vector3(0, 0, 1);
            const europaQuaternion = new THREE.Quaternion();
            const euler = new THREE.Euler();

            euler.set(beta, alpha, -gamma, 'YXZ');
            europaQuaternion.setFromEuler(euler);
            
            // Compensación de orientación de pantalla para iOS/Android
            const orientQuaternion = new THREE.Quaternion().setFromAxisAngle(zee, -orient);
            europaQuaternion.multiply(orientQuaternion);
            
            // Ajuste de perspectiva base
            const adjustQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
            europaQuaternion.multiply(adjustQuaternion);

            targetQuaternion.copy(europaQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                planet.rotation.y += 0.005;
                renderer.render(scene, camera);
            } else {
                if(stars) stars.rotation.y += 0.0005;
                internalCamera.quaternion.slerp(targetQuaternion, 0.1);
                
                if (isVRMode) {
                    renderVR();
                } else {
                    internalRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    internalRenderer.render(internalScene, internalCamera);
                }
            }
        }

        function renderVR() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            internalRenderer.setViewport(0, 0, width / 2, height);
            internalRenderer.setScissor(0, 0, width / 2, height);
            internalRenderer.setScissorTest(true);
            internalRenderer.render(internalScene, internalCamera);
            
            internalRenderer.setViewport(width / 2, 0, width / 2, height);
            internalRenderer.setScissor(width / 2, 0, width / 2, height);
            internalRenderer.render(internalScene, internalCamera);
            internalRenderer.setScissorTest(false);
        }

        animate();

        async function requestSensorsAndStart() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        launchExperience();
                    } else {
                        alert('Se requieren permisos de giroscopio para vivir la experiencia inmersiva.');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                // Android y navegadores estándar
                window.addEventListener('deviceorientation', handleOrientation, true);
                launchExperience();
            }
        }

        function launchExperience() {
            if (isSystemActive) return;
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);

            gsap.to(camera.position, { z: 0.5, duration: 2, onComplete: () => {
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
                container.style.opacity = '0';
                isSystemActive = true;
            }});
        }

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        startBtn.addEventListener('click', requestSensorsAndStart);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (internalCamera) {
                internalCamera.aspect = window.innerWidth / window.innerHeight;
                internalCamera.updateProjectionMatrix();
                internalRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
