<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #webgl-container, #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        
        #instruction { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 3; 
            font-size: 1.1rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; letter-spacing: 1px;
        }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
        }
        #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    </style>
</head>
<body>

    <button id="vr-btn" style="display: none;">Ver en VR</button>
    <div id="instruction">Presiona la esfera para ingresar al multiverso MS3</div>
    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const vrBtn = document.getElementById('vr-btn');
        let isSystemActive = false;
        let isVRMode = false;
        let internalScene, internalCamera, internalRenderer, stars;
        let targetQuaternion = new THREE.Quaternion();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Grupo principal para la esfera de líneas densas (posicionada abajo)
        const planetGroup = new THREE.Group();
        const planetGeometry = new THREE.IcosahedronGeometry(1.5, 4); // Mayor cantidad de líneas y caras
        const planetMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true,
            transparent: true,
            opacity: 0.9
        });
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.y = -1.3;
        planetGroup.add(planet);

        // Grupo principal para las letras MS3 en neón 3D (posicionadas arriba)
        const textGroup = new THREE.Group();
        textGroup.position.y = 1.3;

        // Materiales brillantes estilo Neón Futurista
        const neonPink = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
        const neonCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        const neonWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });

        // Estructura 3D geométrica robusta y visible para simular las letras "MS3"
        const barGeoV = new THREE.BoxGeometry(0.32, 1.8, 0.4);
        const barGeoD1 = new THREE.BoxGeometry(0.32, 1.3, 0.4);
        const barGeoH = new THREE.BoxGeometry(1.1, 0.3, 0.4);

        // Letra M
        const m1 = new THREE.Mesh(barGeoV, neonPink); m1.position.set(-1.8, 0, 0);
        const m2 = new THREE.Mesh(barGeoD1, neonCyan); m2.position.set(-1.4, 0.2, 0); m2.rotation.z = -0.5;
        const m3 = new THREE.Mesh(barGeoD1, neonCyan); m3.position.set(-1.0, 0.2, 0); m3.rotation.z = 0.5;
        const m4 = new THREE.Mesh(barGeoV, neonPink); m4.position.set(-0.6, 0, 0);
        textGroup.add(m1, m2, m3, m4);

        // Letra S
        const sTop = new THREE.Mesh(barGeoH, neonCyan); sTop.position.set(0.5, 0.75, 0);
        const sMid1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.4), neonPink); sMid1.position.set(0.05, 0.35, 0);
        const sMid2 = new THREE.Mesh(barGeoH, neonPink); sMid2.position.set(0.5, 0, 0);
        const sMid3 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.4), neonCyan); sMid3.position.set(0.95, -0.35, 0);
        const sBot = new THREE.Mesh(barGeoH, neonCyan); sBot.position.set(0.5, -0.75, 0);
        textGroup.add(sTop, sMid1, sMid2, sMid3, sBot);

        // Número 3
        const nTop = new THREE.Mesh(barGeoH, neonPink); nTop.position.set(1.9, 0.75, 0);
        const nSide = new THREE.Mesh(barGeoV, neonCyan); nSide.position.set(2.3, 0, 0);
        const nMid = new THREE.Mesh(barGeoH, neonPink); nMid.position.set(1.9, 0, 0);
        const nBot = new THREE.Mesh(barGeoH, neonPink); nBot.position.set(1.9, -0.75, 0);
        textGroup.add(nTop, nSide, nMid, nBot);

        scene.add(planetGroup);
        scene.add(textGroup);
        camera.position.z = 5;

        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15 });
            const starPositions = new Float32Array(5000);
            for(let i=0; i<5000; i++) starPositions[i] = (Math.random() - 0.5) * 120;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            const screenGeometry = new THREE.PlaneGeometry(2, 1.5);
            const material = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
            for(let y = -1; y <= 1; y++) {
                for(let x = -2; x <= 2; x++) {
                    const screen = new THREE.Mesh(screenGeometry, material);
                    screen.position.set(x * 2.2, y * 1.7, -5);
                    internalScene.add(screen);
                }
            }
            vrBtn.style.display = 'block';
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const Euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(Euler);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                // Rotación simultánea de 360 grados sobre su propio eje tanto para la esfera como para el texto
                planet.rotation.y += 0.008;
                planet.rotation.x += 0.003;
                textGroup.rotation.y += 0.006;
                renderer.render(scene, camera);
            } else {
                if(stars) stars.rotation.y += 0.0005;
                internalCamera.quaternion.slerp(targetQuaternion, 0.1);
                
                if (isVRMode) {
                    renderVR();
                } else {
                    internalRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    internalRenderer.render(internalScene, internalCamera);
                }
            }
        }

        function renderVR() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            internalRenderer.setViewport(0, 0, width / 2, height);
            internalRenderer.setScissor(0, 0, width / 2, height);
            internalRenderer.setScissorTest(true);
            internalRenderer.render(internalScene, internalCamera);
            
            internalRenderer.setViewport(width / 2, 0, width / 2, height);
            internalRenderer.setScissor(width / 2, 0, width / 2, height);
            internalRenderer.render(internalScene, internalCamera);
            internalRenderer.setScissorTest(false);
        }

        animate();

        async function startExperience() {
            if (isSystemActive) return;
            window.addEventListener('deviceorientation', handleOrientation, true);
            document.getElementById('instruction').style.opacity = '0';
            
            // Transición inmersiva hacia el interior del multiverso
            gsap.to(camera.position, { z: -1.5, duration: 2.2, ease: "power2.inOut", onComplete: () => {
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
                container.style.opacity = '0';
                isSystemActive = true;
            }});
        }

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        window.addEventListener('click', startExperience);
        window.addEventListener('touchend', startExperience);
    </script>
</body>
</html>
