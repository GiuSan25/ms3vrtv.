<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Multiverso Inmersivo VR (Móvil)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #030208; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(138, 43, 226, 0.3); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; }

        #top-ui-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }

        .control-btn {
            background: rgba(15, 12, 30, 0.85); border: 1.5px solid rgba(138, 43, 226, 0.6); color: #d8b4fe; box-shadow: 0 0 15px rgba(138, 43, 226, 0.25);
            backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto;
        }

        .control-btn:active { background: rgba(138, 43, 226, 0.4); transform: scale(0.97); }

        #gaze-pointer {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; z-index: 9999; pointer-events: none; display: none;
        }
        #gaze-pointer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        #gaze-progress-circle {
            fill: none; stroke: #d8b4fe; stroke-width: 3; stroke-dasharray: 69; stroke-dashoffset: 69;
            transition: stroke-dashoffset 0.05s linear;
        }
        #gaze-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background-color: #fff; border-radius: 50%;
            box-shadow: 0 0 8px rgba(168, 85, 247, 1);
        }

        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #e9d5ff; z-index: 100; 
            font-size: 0.95rem; padding: 0 20px; pointer-events: none; text-shadow: 0 0 10px rgba(168, 85, 247, 0.6); font-weight: 600; transition: opacity 0.5s ease;
        }

        #flash-overlay {
            position: fixed; inset: 0; background: #a855f7; opacity: 0; pointer-events: none; z-index: 3000;
            transition: opacity 0.3s ease; mix-blend-mode: screen;
        }

        .floating-card { pointer-events: auto; user-select: none; }
        .interactive-btn { pointer-events: auto; transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }

        .neon-box-purple {
            border: 2px solid rgba(168, 85, 247, 0.5); box-shadow: 0 0 25px rgba(138, 43, 226, 0.25), inset 0 0 20px rgba(138, 43, 226, 0.15);
            border-radius: 24px; background: rgba(12, 10, 25, 0.92); backdrop-filter: blur(16px);
        }

        .netflix-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; overflow: visible;
        }

        .netflix-card {
            height: 110px; border-radius: 10px; overflow: hidden; position: relative;
            border: 1.5px solid rgba(168, 85, 247, 0.3); cursor: pointer; background: #111;
        }
        .netflix-card img { width: 100%; height: 100%; object-fit: cover; }
        .netflix-card .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 6px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }

        #video-modal, #preview-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.5); }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #a855f7; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    
    <div id="gaze-pointer">
        <svg viewBox="0 0 36 36">
            <path id="gaze-progress-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div id="gaze-dot"></div>
    </div>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>MENÚ</span>
        </button>
        <div id="dropdown-menu" class="hidden mt-3 w-72 neon-box-purple p-4 flex flex-col gap-3 transition-all duration-300 transform scale-95 opacity-0">
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="requestMobilePermissions()"><span id="gyro-btn-text">GIROSCOPIO: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="toggleGazePointer()"><span id="pointer-btn-text">PUNTERO VISTA: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="openAboutSection(event)"><span>NOSOTROS</span></button>
        </div>
    </div>

    <div id="instruction">Arrastra con el dedo para mover el universo | Toca el logo MS3 para entrar</div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>
        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="preview-modal">
        <div class="neon-box-purple p-6 max-w-sm w-full flex flex-col gap-4 relative">
            <h2 id="preview-title" class="text-2xl font-black text-white">Título</h2>
            <p id="preview-desc" class="text-gray-300 text-sm">Descripción del programa VR.</p>
            <div class="flex flex-col gap-2 mt-2">
                <button id="preview-play-btn" class="interactive-btn bg-purple-600 text-white px-6 py-3 rounded-xl font-black text-center" onclick="playFromPreview()">REPRODUCIR</button>
                <button class="interactive-btn bg-transparent border border-white text-white px-6 py-3 rounded-xl font-bold text-center" onclick="closePreviewModal()">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="video-modal">
        <video id="active-video" controls playsinline></video>
        <button class="modal-close-btn interactive-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let logoGroup, vrGogglesGroup, universeSphere, starField;
        let multiverseHudGroup = null, vrProgramsHudGroup = null, aboutHudGroup = null;
        let spinningCoins = [];
        let isTopMenuOpen = false, selectedVideoData = null;
        let isSystemActive = false, isGyroActive = false, isVRMode = false, isGazePointerActive = false, isInAboutSection = false;

        let isDragging = false;
        let previousTouchPosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;

        let deviceQuaternion = new THREE.Quaternion();
        const eyeSeparation = 0.064;

        let gazeStartTime = null, currentTargetElement = null;
        const dwellTimeThreshold = 2000;

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const cssContainerLeft = document.getElementById('css3d-container-left');
        const cssContainerRight = document.getElementById('css3d-container-right');
        const instruction = document.getElementById('instruction');
        const flashOverlay = document.getElementById('flash-overlay');
        const gazePointer = document.getElementById('gaze-pointer');
        const progressCircle = document.getElementById('gaze-progress-circle');

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        containerRight.appendChild(rendererRight.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        cssContainerLeft.appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        cssContainerRight.appendChild(cssRendererRight.domElement);

        scene.add(new THREE.AmbientLight(0x2a1b4e, 1.8));
        
        const pLightPurple = new THREE.PointLight(0xa855f7, 4.5, 100); pLightPurple.position.set(-10, 10, 10); scene.add(pLightPurple);
        const pLightIndigo = new THREE.PointLight(0x6366f1, 4.5, 100); pLightIndigo.position.set(10, -10, 10); scene.add(pLightIndigo);

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x05030d, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0xa855f7), new THREE.Color(0x6366f1), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.85 }));
        scene.add(starField);

        logoGroup = new THREE.Group();
        logoGroup.position.y = 0.2;
        scene.add(logoGroup);

        vrGogglesGroup = new THREE.Group();
        vrGogglesGroup.visible = false;
        vrGogglesGroup.scale.set(0.01, 0.01, 0.01);
        scene.add(vrGogglesGroup);

        const solidSubtlePurpleMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, metalness: 0.75, roughness: 0.25, emissive: 0x4a1d96, emissiveIntensity: 0.4 });
        const solidSubtleIndigoMat = new THREE.MeshStandardMaterial({ color: 0x818cf8, metalness: 0.75, roughness: 0.25, emissive: 0x312e81, emissiveIntensity: 0.4 });

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textConfig = { font: font, size: 1.3, height: 0.35, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.04, bevelSegments: 4 };
            const textGeo = new THREE.TextGeometry('MS3', textConfig);
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const textMesh = new THREE.Mesh(textGeo, solidSubtlePurpleMat);
            textMesh.position.x = centerOffset; 
            logoGroup.add(textMesh);

            const ringGeo = new THREE.TorusGeometry(2.2, 0.05, 12, 60);
            const ringMesh = new THREE.Mesh(ringGeo, solidSubtleIndigoMat);
            ringMesh.rotation.x = Math.PI / 3;
            logoGroup.add(ringMesh);
        });

        const headsetBodyMat = new THREE.MeshStandardMaterial({ color: 0x0f0b1e, metalness: 0.9, roughness: 0.2 });
        const glowingTrimMat = new THREE.MeshStandardMaterial({ color: 0xd946ef, metalness: 0.8, roughness: 0.1, emissive: 0xc084fc, emissiveIntensity: 0.9 });
        const neonCoreMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, metalness: 0.5, roughness: 0.1, emissive: 0x9333ea, emissiveIntensity: 1.0 });

        vrGogglesGroup.add(new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.6, 1.1), headsetBodyMat));
        const frontPanel = new THREE.Mesh(new THREE.BoxGeometry(3.3, 1.3, 0.15), glowingTrimMat); frontPanel.position.z = 0.50; vrGogglesGroup.add(frontPanel);
        const innerFront = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.8, 0.1), neonCoreMat); innerFront.position.z = 0.58; vrGogglesGroup.add(innerFront);

        function toggleTopMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('dropdown-menu');
            isTopMenuOpen = !isTopMenuOpen;
            if (isTopMenuOpen) {
                dropdown.classList.remove('hidden');
                setTimeout(() => { dropdown.classList.remove('scale-95', 'opacity-0'); dropdown.classList.add('scale-100', 'opacity-100'); }, 10);
            } else {
                dropdown.classList.remove('scale-100', 'opacity-100'); dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        function toggleGazePointer() {
            isGazePointerActive = !isGazePointerActive;
            document.getElementById('pointer-btn-text').innerText = isGazePointerActive ? 'PUNTERO VISTA: ON' : 'PUNTERO VISTA: OFF';
            gazePointer.style.display = isGazePointerActive ? 'block' : 'none';
            resetGazeTimer();
        }

        function resetGazeTimer() {
            gazeStartTime = null; currentTargetElement = null;
            progressCircle.style.strokeDashoffset = '69';
        }

        function requestMobilePermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') activateGyroscope();
                    else alert('Permiso de giroscopio denegado en iOS.');
                }).catch(console.error);
            } else {
                activateGyroscope();
            }
        }

        function activateGyroscope() {
            isGyroActive = !isGyroActive;
            const btnText = document.getElementById('gyro-btn-text');
            if (isGyroActive) {
                btnText.innerText = 'GIROSCOPIO: ON';
                window.addEventListener('deviceorientation', handleOrientation, true);
            } else {
                btnText.innerText = 'GIROSCOPIO: OFF';
                window.removeEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            if (!isGyroActive) return;
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            
            const europa = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(europa);
            cameraRig.quaternion.copy(deviceQuaternion);
        }

        const viewContainer = document.getElementById('vr-view-container');
        viewContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || isGyroActive || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousTouchPosition.x;
            const deltaY = e.touches[0].clientY - previousTouchPosition.y;

            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));

            previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        viewContainer.addEventListener('pointerdown', (e) => {
            isDragging = true; previousTouchPosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging || isGyroActive) return;
            const deltaX = e.clientX - previousTouchPosition.x;
            const deltaY = e.clientY - previousTouchPosition.y;
            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));
            previousTouchPosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('touchstart', (e) => {
            if (isSystemActive || isInAboutSection || e.touches.length !== 1) return;
            const touch = e.touches[0];
            mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(logoGroup.children, true);
            if (intersects.length > 0) transformToGogglesAndEnter();
        }, { passive: true });

        window.addEventListener('click', (e) => {
            if (isSystemActive || isInAboutSection) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(logoGroup.children, true);
            if (intersects.length > 0) transformToGogglesAndEnter();
        });

        function transformToGogglesAndEnter() {
            isSystemActive = true;
            instruction.style.opacity = '0';
            resetGazeTimer();

            gsap.to(logoGroup.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.4, ease: "power2.in", onComplete: () => {
                logoGroup.visible = false;
                vrGogglesGroup.position.copy(logoGroup.position);
                vrGogglesGroup.rotation.copy(logoGroup.rotation);
                vrGogglesGroup.visible = true;

                gsap.to(vrGogglesGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.5, ease: "back.out(1.7)" });
                gsap.to(vrGogglesGroup.rotation, { y: 0, x: 0, duration: 0.5, ease: "power2.out" });
            }});

            setTimeout(() => {
                gsap.to(cameraRig.position, { 
                    z: 0.1, duration: 0.7, ease: "power3.in",
                    onUpdate: () => { cameraLeft.position.z = cameraRig.position.z; cameraRight.position.z = cameraRig.position.z; }
                });

                gsap.to(vrGogglesGroup.scale, { x: 8.0, y: 8.0, z: 8.0, duration: 0.7, ease: "power2.in" });
                setTimeout(() => { flashOverlay.style.opacity = '1'; }, 450);

                setTimeout(() => {
                    vrGogglesGroup.visible = false;
                    vrGogglesGroup.scale.set(0.01, 0.01, 0.01);
                    createMultiverseHUD();
                    cameraRig.position.set(0, 0, 5);
                    flashOverlay.style.opacity = '0';
                }, 750);
            }, 450);
        }

        function createMultiverseHUD() {
            destroyAllHUDs();
            resetGazeTimer();
            
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[340px] sm:w-[440px] flex flex-col gap-3 floating-card p-2";
            mainContainer.innerHTML = `
                <div class="flex justify-between items-center w-full">
                    <button class="interactive-btn bg-black/95 border border-purple-500 text-purple-300 px-5 py-2 rounded-full font-bold text-xs flex items-center gap-2 shadow-[0_0_15px_rgba(168,85,247,0.5)]" onclick="exitMultiverse(event)">
                        <span>← INICIO</span>
                    </button>
                </div>

                <div class="w-full neon-box-purple p-4 flex flex-col justify-between h-[210px] rounded-2xl" style="background: rgba(12,10,25,0.95);">
                    <div>
                        <span class="text-[10px] font-extrabold tracking-widest text-purple-300 uppercase">MS3 Multiverse Live</span>
                        <h1 class="text-xl font-black text-white mt-1">EL CONCIERTO DEL SIGLO</h1>
                        <p class="text-gray-300 text-xs mt-1 leading-relaxed">Experiencia inmersiva 360° en vivo desde el núcleo MS3.</p>
                    </div>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black py-2.5 rounded-xl font-black text-xs text-center shadow-[0_0_15px_rgba(255,255,255,0.6)]">REPRODUCIR AHORA</button>
                </div>

                <div class="w-full grid grid-cols-3 gap-2">
                    <button onclick="openVRProgramsMultiverse(event)" class="interactive-btn neon-box-purple py-3 text-purple-300 font-bold text-xs text-center rounded-xl">PROGRAMAS VR</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn neon-box-purple py-3 text-purple-300 font-bold text-xs text-center rounded-xl">2D</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn neon-box-purple py-3 text-purple-300 font-bold text-xs text-center rounded-xl">EN VIVO</button>
                </div>
            `;

            multiverseHudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.0012, 0.0012, 0.0012); // Escala ajustada a la nueva cercanía
            multiverseHudGroup.add(cssObject);
            multiverseHudGroup.position.set(0, 0, -0.7); // Pantalla principal mucho más cerca
            cssScene.add(multiverseHudGroup);
        }

        function openVRProgramsMultiverse(e) {
            if (e) e.stopPropagation();
            destroyAllHUDs();
            resetGazeTimer();

            const vrContainer = document.createElement('div');
            vrContainer.className = "w-[340px] sm:w-[440px] flex flex-col gap-3 floating-card p-2";
            vrContainer.innerHTML = `
                <div class="flex items-center justify-between">
                    <button class="interactive-btn bg-black/95 border border-purple-500 text-purple-300 px-4 py-2 rounded-full font-bold text-xs" onclick="createMultiverseHUD()">← VOLVER</button>
                    <h1 class="text-sm font-black text-white uppercase tracking-wider">PROGRAMAS VR</h1>
                </div>

                <div class="w-full neon-box-purple p-3 flex flex-col gap-2">
                    <div class="netflix-grid">
                        <div class="netflix-card interactive-btn" onclick="openPreview('Cyberpunk 2099', 'Metrópolis futurista iluminada por neón.', 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop" alt="Cyberpunk">
                            <div class="card-info"><h4 class="text-white text-[11px] font-bold">Cyberpunk</h4></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Viaje a Marte', 'Explora las dunas rojas espaciales.', 'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=400&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
                            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=400&auto=format&fit=crop" alt="Marte">
                            <div class="card-info"><h4 class="text-white text-[11px] font-bold">Marte 360</h4></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Estación ISS', 'Flotando en órbita terrestre.', 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
                            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop" alt="ISS">
                            <div class="card-info"><h4 class="text-white text-[11px] font-bold">Estación ISS</h4></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Bosque Místico', 'Santuario natural interactivo.', 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=400&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
                            <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=400&auto=format&fit=crop" alt="Bosque">
                            <div class="card-info"><h4 class="text-white text-[11px] font-bold">Bosque VR</h4></div>
                        </div>
                    </div>
                </div>
            `;

            vrProgramsHudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(vrContainer);
            cssObject.scale.set(0.0012, 0.0012, 0.0012);
            vrProgramsHudGroup.add(cssObject);
            vrProgramsHudGroup.position.set(0, 0, -0.7); // Submenú VR cerca
            cssScene.add(vrProgramsHudGroup);
        }

        function openAboutSection(e) {
            if (e) e.stopPropagation();
            if (isTopMenuOpen) toggleTopMenu();
            destroyAllHUDs();
            resetGazeTimer();
            
            isInAboutSection = true;
            logoGroup.visible = false;
            instruction.style.opacity = '0';

            flashOverlay.style.opacity = '1';
            setTimeout(() => { flashOverlay.style.opacity = '0'; }, 300);

            aboutHudGroup = new THREE.Group();
            spinningCoins = [];

            const backWrapper = document.createElement('div');
            backWrapper.className = "w-[300px] flex justify-between items-center floating-card p-2";
            backWrapper.innerHTML = `
                <button class="interactive-btn bg-black/95 border border-purple-400 text-purple-300 px-5 py-2 rounded-full font-bold text-xs" onclick="exitMultiverse(event)">← INICIO</button>
                <h1 class="text-sm font-black text-white uppercase">NOSOTROS</h1>
            `;
            const backObj = new THREE.CSS3DObject(backWrapper);
            backObj.scale.set(0.0012, 0.0012, 0.0012);
            backObj.position.set(0, 0.9, -0.7);
            aboutHudGroup.add(backObj);

            const screenData = [
                { title: "INNOVACIÓN VR", desc: "Tecnología de punta aplicada al entretenimiento.", angle: -0.75 },
                { title: "MULTIVERSO", desc: "Streaming y experiencias visuales ilimitadas.", angle: -0.25 },
                { title: "ARTE Y ESCENA", desc: "Fusión de arte profesional y realidad virtual.", angle: 0.25 },
                { title: "FUTURO", desc: "Mundos interactivos accesibles en cualquier móvil.", angle: 0.75 }
            ];

            const radius = 0.85; // Círculo más cerrado alrededor del usuario

            screenData.forEach((data, index) => {
                const screenDiv = document.createElement('div');
                screenDiv.className = "neon-box-purple p-3 flex flex-col items-center justify-between text-center floating-card w-[160px] h-[220px] rounded-2xl";
                screenDiv.innerHTML = `
                    <div class="w-full flex flex-col items-center gap-1">
                        <span class="text-[9px] font-extrabold text-purple-300 uppercase">MS3 0${index + 1}</span>
                        <h2 class="text-xs font-black text-white">${data.title}</h2>
                    </div>
                    <div class="w-10 h-10 my-auto relative flex items-center justify-center"></div>
                    <p class="text-gray-300 text-[9px] leading-snug">${data.desc}</p>
                `;

                const screenObj = new THREE.CSS3DObject(screenDiv);
                screenObj.scale.set(0.0012, 0.0012, 0.0012);
                
                const xPos = Math.sin(data.angle) * radius;
                const zPos = -Math.cos(data.angle) * radius;
                screenObj.position.set(xPos, -0.05, zPos);
                screenObj.lookAt(0, -0.05, 0);
                aboutHudGroup.add(screenObj);

                const coinGroup = new THREE.Group();
                coinGroup.position.set(xPos, -0.05, zPos);
                coinGroup.rotation.y = data.angle;

                const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2, side: THREE.DoubleSide });
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');

                function drawCoinFace() {
                    ctx.fillStyle = '#ffcc00'; ctx.fillRect(0, 0, 256, 256);
                    ctx.fillStyle = '#b38600'; ctx.beginPath(); ctx.arc(128, 128, 115, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffdf33'; ctx.beginPath(); ctx.arc(128, 128, 105, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#805d00'; ctx.font = 'bold 50px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('MS3', 128, 128);
                }
                drawCoinFace();

                const textureImage = new THREE.CanvasTexture(canvas);
                const coinFaceMat = new THREE.MeshStandardMaterial({ map: textureImage, metalness: 0.7, roughness: 0.3 });
                const coinGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.05, 32);
                coinGeo.rotateX(Math.PI / 2);
                
                coinGroup.add(new THREE.Mesh(coinGeo, [goldMaterial, coinFaceMat, coinFaceMat]));
                aboutHudGroup.add(coinGroup);

                spinningCoins.push({ group: coinGroup, angleAccumulator: index * 1.5 });
            });

            cssScene.add(aboutHudGroup);
        }

        function destroyAllHUDs() {
            if (multiverseHudGroup) { cssScene.remove(multiverseHudGroup); multiverseHudGroup.traverse(c => { if(c.element) c.element.remove(); }); multiverseHudGroup = null; }
            if (vrProgramsHudGroup) { cssScene.remove(vrProgramsHudGroup); vrProgramsHudGroup.traverse(c => { if(c.element) c.element.remove(); }); vrProgramsHudGroup = null; }
            if (aboutHudGroup) { cssScene.remove(aboutHudGroup); aboutHudGroup.traverse(c => { if(c.element) c.element.remove(); }); aboutHudGroup = null; }
            spinningCoins = []; isInAboutSection = false;
        }

        function openPreview(title, desc, imgUrl, videoUrl) {
            selectedVideoData = videoUrl;
            document.getElementById('preview-title').innerText = title;
            document.getElementById('preview-desc').innerText = desc;
            document.getElementById('preview-modal').style.display = 'flex';
        }
        function closePreviewModal() { document.getElementById('preview-modal').style.display = 'none'; }
        function playFromPreview() { closePreviewModal(); if (selectedVideoData) openVideo(selectedVideoData); }

        function openVideo(url) {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('active-video');
            video.src = url; modal.style.display = 'flex'; video.play();
        }
        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('active-video');
            video.pause(); video.src = ''; modal.style.display = 'none';
        }

        function exitMultiverse(e) {
            if (e) e.stopPropagation();
            destroyAllHUDs(); resetGazeTimer();
            logoGroup.visible = true; instruction.style.opacity = '1';
            isSystemActive = false; isInAboutSection = false;
            gsap.fromTo(logoGroup.scale, { x: 0.01, y: 0.01, z: 0.01 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: "power2.out" });
            gsap.to(cameraRig.position, { z: 5, duration: 1.0, ease: "power2.inOut" });
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.getElementById('vr-btn-text').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';
            if (isVRMode && !isGazePointerActive) toggleGazePointer();
            else if (!isVRMode && isGazePointerActive) toggleGazePointer();

            const w = window.innerWidth, h = window.innerHeight;
            rendererLeft.setSize(isVRMode ? w/2 : w, h);
            rendererRight.setSize(w/2, h);
            cssRendererLeft.setSize(isVRMode ? w/2 : w, h);
            cssRendererRight.setSize(w/2, h);
            cameraLeft.aspect = (isVRMode ? w/2 : w) / h;
            cameraRight.aspect = (w/2) / h;
            cameraLeft.updateProjectionMatrix();
            cameraRight.updateProjectionMatrix();
            toggleTopMenu();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (starField) starField.rotation.y += 0.0005;
            if (logoGroup && !isSystemActive && !isInAboutSection && logoGroup.visible) logoGroup.rotation.y += 0.012;

            spinningCoins.forEach(coin => {
                coin.group.rotation.y += 0.02;
            });

            if (isGazePointerActive) {
                const activeCamera = isVRMode ? cameraLeft : camera;
                raycaster.setFromCamera(new THREE.Vector2(0, 0), activeCamera);
                const elemUnderCenter = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
                const interactiveElem = elemUnderCenter ? elemUnderCenter.closest('button, .interactive-btn, .netflix-card') : null;

                let targetFound = (raycaster.intersectObjects(logoGroup.children, true).length > 0 && !isSystemActive && !isInAboutSection) ? logoGroup : interactiveElem;

                if (targetFound) {
                    if (currentTargetElement !== targetFound) {
                        currentTargetElement = targetFound; gazeStartTime = performance.now();
                    } else {
                        const elapsed = performance.now() - gazeStartTime;
                        progressCircle.style.strokeDashoffset = 69 - (Math.min(elapsed / dwellTimeThreshold, 1) * 69);
                        if (elapsed >= dwellTimeThreshold) {
                            if (currentTargetElement === logoGroup) transformToGogglesAndEnter();
                            else if (currentTargetElement.click) currentTargetElement.click();
                            resetGazeTimer();
                        }
                    }
                } else { resetGazeTimer(); }
            }

            if (!isGyroActive) {
                currentRotationX += (targetRotationX - currentRotationX) * 0.1;
                currentRotationY += (targetRotationY - currentRotationY) * 0.1;
                cameraRig.rotation.y = currentRotationY;
                cameraRig.rotation.x = currentRotationX;
            }

            rendererLeft.render(scene, isVRMode ? cameraLeft : camera);
            cssRendererLeft.render(cssScene, isVRMode ? cameraLeft : camera);
            if (isVRMode) {
                rendererRight.render(scene, cameraRight);
                cssRendererRight.render(cssScene, cameraRight);
            }
        }
        animate();
    </script>
</body>
