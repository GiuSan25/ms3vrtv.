<!-- Reemplaza la sección del admin-modal por este código mejorado con subida local -->
<div id="admin-modal">
    <div class="neon-box-cyan p-8 max-w-2xl w-full text-center flex flex-col gap-4">
        <h2 class="text-3xl font-bold text-fuchsia-400">NUBE DE VIDEOS LOCALES - MS3</h2>
        <p class="text-gray-300 text-sm">Sube un video directamente desde tu computadora o añade un enlace. Selecciona cuál se quedará fijo en la experiencia 360°.</p>
        
        <!-- Selector de archivos locales de la computadora -->
        <div class="flex flex-col gap-2 bg-black/60 p-4 rounded-xl border border-cyan-500/50">
            <label class="text-cyan-300 text-xs font-bold text-left">SUBIR VIDEO DESDE LA COMPUTADORA:</label>
            <input type="file" id="local-video-file" accept="video/mp4,video/webm" class="text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-400 file:text-black hover:file:bg-cyan-300 cursor-pointer">
            <button class="bg-fuchsia-600 text-white font-bold py-2 rounded-xl text-sm mt-2 interactive-btn" onclick="uploadLocalVideoFile()">AÑADIR A LA NUBE</button>
        </div>

        <!-- Lista de videos guardados -->
        <div id="video-cloud-list" class="h-40 overflow-y-auto bg-black/50 p-4 rounded-xl border border-gray-700 text-left">
            <!-- Los videos se listarán aquí -->
        </div>

        <div class="flex gap-4 justify-center mt-2">
            <button class="modal-close-btn bg-cyan-400 text-black border-none" onclick="applySelectedVideo()">GUARDAR Y FIJAR</button>
            <button class="modal-close-btn bg-gray-800 text-gray-300 border-none" onclick="closeAdminModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    // 1. Gestión de la nube de videos y almacenamiento persistente
    let videoLibrary = JSON.parse(localStorage.getItem('ms3_video_library') || JSON.stringify([
        "https://archive.org/download/buscando-h-265-injected/BUSCANDO%20H265_injected.mp4"
    ]));
    let selectedVideo = localStorage.getItem('ms3_active_video') || videoLibrary[0];

    function renderVideoList() {
        const list = document.getElementById('video-cloud-list');
        list.innerHTML = '';
        videoLibrary.forEach((url, index) => {
            const div = document.createElement('div');
            div.className = `p-2 mb-2 rounded cursor-pointer flex justify-between items-center ${selectedVideo === url ? 'bg-cyan-900 border border-cyan-400' : 'bg-gray-800'}`;
            div.innerHTML = `<span class="truncate block text-xs text-gray-200 max-w-[400px]">Video ${index + 1}: ${url.substring(0, 40)}...</span>
                             <span class="text-[10px] bg-black px-2 py-1 rounded text-cyan-300">${selectedVideo === url ? 'SELECCIONADO' : 'Elegir'}</span>`;
            div.onclick = () => { selectedVideo = url; renderVideoList(); };
            list.appendChild(div);
        });
    }

    // Función para procesar el archivo seleccionado de la computadora
    function uploadLocalVideoFile() {
        const fileInput = document.getElementById('local-video-file');
        if (fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            // Creamos una URL local temporal tipo blob para reproducir el archivo de la PC
            const localUrl = URL.createObjectURL(file);
            
            videoLibrary.push(localUrl);
            localStorage.setItem('ms3_video_library', JSON.stringify(videoLibrary));
            selectedVideo = localUrl;
            
            fileInput.value = '';
            renderVideoList();
            alert("¡Video de la computadora cargado con éxito en la lista!");
        } else {
            alert("Por favor selecciona un archivo de video primero.");
        }
    }

    function applySelectedVideo() {
        localStorage.setItem('ms3_active_video', selectedVideo);
        alert("¡Configuración guardada! La página se recargará para aplicar el video fijo.");
        location.reload();
    }

    function openAdminModal() {
        renderVideoList();
        document.getElementById('admin-modal').style.display = 'flex';
    }

    // Cargar el video activo guardado en el reproductor principal 360
    videoElement.src = localStorage.getItem('ms3_active_video') || videoLibrary[0];
    videoElement.load();
</script>
