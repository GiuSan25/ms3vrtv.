<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; width: 100vw; height: 100vh; }
        #webgl-container, #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #webgl-container { z-index: 2; cursor: pointer; }
        #ms3-environment { z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        
        #instruction { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 3; 
            font-size: 1.1rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; letter-spacing: 1px;
        }
        
        #vr-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            cursor: pointer; transition: all 0.3s;
        }
        #vr-btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        #multiverse-hud {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5; pointer-events: none; display: none;
            box-sizing: border-box;
        }

        .hud-interactive {
            pointer-events: auto;
            cursor: pointer;
        }

        #btn-volver {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 12px 30px; background: rgba(0, 0, 0, 0.7); color: #ff007f;
            border: 2px solid #ff007f; border-radius: 30px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; font-size: 1rem;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #ff007f;
            transition: all 0.3s ease;
        }
        #btn-volver:hover {
            background: #ff007f; color: #000; box-shadow: 0 0 25px #ff007f;
        }
    </style>
</head>
<body>

    <button id="vr-btn" style="display: none;">Ver en VR</button>
    <div id="instruction">Presiona la esfera para ingresar al multiverso MS3</div>
    <div id="webgl-container"></div>
    <div id="ms3-environment"></div>

    <div id="multiverse-hud">
        <button id="btn-volver" class="hud-interactive">VOLVER</button>
    </div>

    <script>
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const vrBtn = document.getElementById('vr-btn');
        const multiverseHud = document.getElementById('multiverse-hud');
        const btnVolver = document.getElementById('btn-volver');

        let isSystemActive = false;
        let isVRMode = false;
        let internalScene, internalCamera, internalRenderer, stars;
        let multiverseButtonsGroup, videoScreensGroup;
        let targetQuaternion = new THREE.Quaternion();
        let manualRotation = { x: 0, y: 0 };
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let videoTextures = [];

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff00ff, 4, 60);
        pointLight1.position.set(6, 6, 6);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00ffff, 4, 60);
        pointLight2.position.set(-6, -6, 6);
        scene.add(pointLight2);

        const planetGroup = new THREE.Group();
        const planetGeometry = new THREE.IcosahedronGeometry(1.4, 4); 
        const planetMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true,
            transparent: true,
            opacity: 0.9
        });
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        planet.position.y = -1.5;
        planetGroup.add(planet);

        const textGroup = new THREE.Group();
        textGroup.position.y = 0.8;

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', {
                font: font, size: 1.2, height: 0.4, curveSegments: 12,
                bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelOffset: 0, bevelSegments: 5
            });

            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const mirrorMaterial = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness: 0.9, roughness: 0.05, clearcoat: 1.0, clearcoatRoughness: 0.05, reflectivity: 1.0
            });
            const textMesh = new THREE.Mesh(textGeo, mirrorMaterial);
            textMesh.position.x = centerOffset;
            textGroup.add(textMesh);

            const neonBorderMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.7 });
            const borderMesh = new THREE.Mesh(textGeo, neonBorderMaterial);
            borderMesh.position.x = centerOffset;
            borderMesh.scale.set(1.02, 1.02, 1.02);
            textGroup.add(borderMesh);
        });

        scene.add(planetGroup);
        scene.add(textGroup);
        camera.position.z = 5;

        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0); 
            envContainer.appendChild(internalRenderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15 });
            const starPositions = new Float32Array(5000);
            for(let i=0; i<5000; i++) starPositions[i] = (Math.random() - 0.5) * 120;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            const userHeadGroup = new THREE.Group();
            userHeadGroup.position.set(0, 0, 0);
            internalScene.add(userHeadGroup);

            // 1. Exactamente 7 pantallas distribuidas en múltiples filas (superior, media, inferior) y con tamaños variados
            videoScreensGroup = new THREE.Group();
            userHeadGroup.add(videoScreensGroup);

            const videoUrls = [
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
            ];

            // Configuración de las 7 pantallas: [ángulo, altura (y), distancia (radio), ancho, alto]
            const screensConfig = [
                { angle: -0.8, y: 1.4, r: 5.5, w: 3.2, h: 1.8 }, // Superior izquierda (Grande)
                { angle:  0.8, y: 1.5, r: 5.3, w: 2.6, h: 1.4 }, // Superior derecha (Mediana)
                { angle: -1.6, y: 0.0, r: 6.0, w: 3.8, h: 2.1 }, // Media izquierda (Muy grande / Principal)
                { angle:  1.6, y: 0.2, r: 5.8, w: 2.2, h: 1.2 }, // Media derecha (Chica)
                { angle: -0.4, y: -1.3, r: 5.0, w: 2.4, h: 1.3 }, // Inferior izquierda (Chica)
                { angle:  0.5, y: -1.2, r: 5.2, w: 3.0, h: 1.6 }, // Inferior derecha (Mediana)
                { angle:  0.0, y: 1.8, r: 5.0, w: 2.0, h: 1.1 }  // Superior central (Mini/Destacada)
            ];

            screensConfig.forEach((config, index) => {
                const video = document.createElement('video');
                video.src = videoUrls[index];
                video.crossOrigin = 'anonymous';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.play();

                const videoTexture = new THREE.VideoTexture(video);
                videoTextures.push(videoTexture);

                const planeGeo = new THREE.PlaneGeometry(config.w, config.h);
                const planeMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
                const screenMesh = new THREE.Mesh(planeGeo, planeMat);

                const x = Math.sin(config.angle) * config.r;
                const z = Math.cos(config.angle) * config.r;

                screenMesh.position.set(x, config.y, z);
                screenMesh.lookAt(0, config.y, 0);

                const frameGeo = new THREE.EdgesGeometry(planeGeo);
                const frameMat = new THREE.LineBasicMaterial({ 
                    color: index % 2 === 0 ? 0x00ffff : 0xff00ff, 
                    linewidth: 2 
                });
                const frameLine = new THREE.LineSegments(frameGeo, frameMat);
                screenMesh.add(frameLine);

                videoScreensGroup.add(screenMesh);
            });

            // 2. Botones principales centrados frente a la vista a la altura de los ojos (y = 0.6, 0.0, -0.6)
            multiverseButtonsGroup = new THREE.Group();
            userHeadGroup.add(multiverseButtonsGroup);

            loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const btnData = [
                    { text: "VER PROGRAMAS VR", y: 0.6, z: -3.0, color: 0x00ffff, emissive: 0x008888 },
                    { text: "VER PROGRAMAS 2D", y: 0.0, z: -3.0, color: 0xff00ff, emissive: 0x880055 },
                    { text: "VER EN VIVO", y: -0.6, z: -3.0, color: 0x00ffcc, emissive: 0x008866 }
                ];

                btnData.forEach((data) => {
                    const bGeo = new THREE.TextGeometry(data.text, {
                        font: font, 
                        size: 0.28, 
                        height: 0.06, 
                        curveSegments: 12, 
                        bevelEnabled: true, 
                        bevelThickness: 0.015, 
                        bevelSize: 0.015, 
                        bevelSegments: 4
                    });
                    bGeo.computeBoundingBox();
                    const bOffset = -0.5 * (bGeo.boundingBox.max.x - bGeo.boundingBox.min.x);
                    
                    const buttonGroup = new THREE.Group();

                    const fillMat = new THREE.MeshPhongMaterial({ 
                        color: data.color, 
                        emissive: data.emissive,
                        emissiveIntensity: 0.9,
                        shininess: 120
                    });
                    const fillMesh = new THREE.Mesh(bGeo, fillMat);
                    buttonGroup.add(fillMesh);

                    const neonOutlineMat = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff, 
                        wireframe: true, 
                        transparent: true, 
                        opacity: 0.95 
                    });
                    const outlineMesh = new THREE.Mesh(bGeo, neonOutlineMat);
                    outlineMesh.scale.set(1.05, 1.05, 1.2);
                    buttonGroup.add(outlineMesh);

                    buttonGroup.position.set(bOffset, data.y, data.z);
                    multiverseButtonsGroup.add(buttonGroup);
                });
            });

            vrBtn.style.display = 'block';
            multiverseHud.style.display = 'block';

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        }

        function onPointerDown(e) {
            if (!isSystemActive || isVRMode) return;
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            if (!isSystemActive || !isDragging || isVRMode) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            manualRotation.y -= deltaX * 0.005;
            manualRotation.x -= deltaY * 0.005;

            manualRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, manualRotation.x));

            const euler = new THREE.Euler(manualRotation.x, manualRotation.y, 0, 'YXZ');
            targetQuaternion.setFromEuler(euler);

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() {
            isDragging = false;
        }

        function requestGyroscope() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            if (isDragging) return;

            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            
            const rotX = beta;
            const rotY = alpha;
            const rotZ = -gamma;

            const euler = new THREE.Euler(rotX, rotY, rotZ, 'YXZ');
            targetQuaternion.setFromEuler(euler);

            const orientation = window.screen.orientation ? window.screen.orientation.angle : (window.orientation || 0);
            if (Math.abs(orientation) === 90) {
                const correction = new THREE.Quaternion();
                correction.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -THREE.MathUtils.degToRad(orientation));
                targetQuaternion.multiply(correction);
            }
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            if (internalCamera && internalRenderer) {
                internalCamera.aspect = width / height;
                internalCamera.updateProjectionMatrix();
                internalRenderer.setSize(width, height);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isSystemActive) {
                planet.rotation.y += 0.008;
                planet.rotation.x += 0.003;
                textGroup.rotation.y += 0.006;
                renderer.render(scene, camera);
            } else {
                if(stars) stars.rotation.y += 0.0005;
                internalCamera.quaternion.slerp(targetQuaternion, 0.1);
                
                if (isVRMode) {
                    renderVR();
                } else {
                    internalRenderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    internalRenderer.render(internalScene, internalCamera);
                }
            }
        }

        function renderVR() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            internalRenderer.setViewport(0, 0, width / 2, height);
            internalRenderer.setScissor(0, 0, width / 2, height);
            internalRenderer.setScissorTest(true);
            internalRenderer.render(internalScene, internalCamera);
            
            internalRenderer.setViewport(width / 2, 0, width / 2, height);
            internalRenderer.setScissor(width / 2, 0, width / 2, height);
            internalRenderer.render(internalScene, internalCamera);
            internalRenderer.setScissorTest(false);
        }

        animate();

        async function startExperience() {
            if (isSystemActive) return;
            requestGyroscope();
            document.getElementById('instruction').style.opacity = '0';
            
            gsap.to(camera.position, { z: -1.5, duration: 2.2, ease: "power2.inOut", onComplete: () => {
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
                container.style.opacity = '0';
                isSystemActive = true;
            }});
        }

        function returnToMain(e) {
            if (e) e.stopPropagation();
            if (!isSystemActive) return;

            window.removeEventListener('deviceorientation', handleOrientation, true);
            window.removeEventListener('mousedown', onPointerDown);
            window.removeEventListener('mousemove', onPointerMove);
            window.removeEventListener('mouseup', onPointerUp);
            window.removeEventListener('touchstart', onPointerDown);
            window.removeEventListener('touchmove', onPointerMove);
            window.removeEventListener('touchend', onPointerUp);

            vrBtn.style.display = 'none';
            multiverseHud.style.display = 'none';
            envContainer.style.opacity = '0';
            envContainer.style.pointerEvents = 'none';
            container.style.opacity = '1';

            gsap.to(camera.position, { z: 5, duration: 1.8, ease: "power2.inOut", onComplete: () => {
                if (internalRenderer && internalRenderer.domElement) {
                    internalRenderer.domElement.remove();
                }
                internalScene = null;
                isVRMode = false;
                vrBtn.innerText = "Ver en VR";
                isSystemActive = false;
                document.getElementById('instruction').style.opacity = '1';
            }});
        }

        vrBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrBtn.innerText = isVRMode ? "Salir de VR" : "Ver en VR";
        });

        btnVolver.addEventListener('click', returnToMain);
        btnVolver.addEventListener('touchend', returnToMain);

        window.addEventListener('click', (e) => {
            if (!isSystemActive && e.target !== vrBtn) startExperience();
        });
        window.addEventListener('touchend', (e) => {
            if (!isSystemActive && e.target !== vrBtn) startExperience();
        });
    </script>
</body>
</html>
