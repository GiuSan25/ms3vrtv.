<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS3 - Plataforma de Realidad Virtual y Streaming 360°</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --bg-dark: #090d16;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Principal */
        header {
            background-color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-color), #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Controles Header & Ajustes */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            background: var(--border-color);
            border-color: var(--accent-color);
            transform: rotate(30deg);
        }

        /* Menú Desplegable de Ajustes */
        .settings-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            width: 260px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            animation: fadeIn 0.2s ease-in-out;
        }

        .settings-dropdown.active {
            display: flex;
        }

        .settings-header {
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
        }

        .settings-item:hover {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        /* Workspace Principal */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 73px);
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        /* Panel Lateral de Control */
        .sidebar-panel {
            background-color: var(--primary-color);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .panel-section h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-main);
        }

        select, input[type="text"], textarea {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #0284c7);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Visor Central de VR / 360 */
        .viewport-container {
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .vr-screen {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .vr-simulation-box {
            width: 80%;
            height: 70%;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .vr-simulation-box svg {
            width: 64px;
            height: 64px;
            fill: var(--accent-color);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px var(--accent-color)); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Modales Dinámicos (Términos, IA, Nosotros) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            background-color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* Estilo específico para IA Assistant */
        .ai-chat-box {
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        .ai-messages {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .ai-msg {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
        }

        .ai-msg.bot {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text-main);
            align-self: flex-start;
        }

        .ai-msg.user {
            background: var(--accent-color);
            color: #0f172a;
            align-self: flex-end;
            font-weight: 500;
        }

        .ai-input-row {
            display: flex;
            gap: 10px;
        }

        .ai-input-row input {
            flex: 1;
        }

        /* Estilo para plantilla Nosotros */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .team-card {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .team-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .team-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-color), #6366f1);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: #fff;
        }

        .team-card h4 {
            color: var(--text-main);
            margin-bottom: 5px;
            font-size: 1.05rem;
        }

        .team-card p {
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Principal -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">MS3</div>
            <div class="logo-text">
                <h1>MS3 La Nueva Televisión</h1>
                <span>WebXR & 360° Platform</span>
            </div>
        </div>

        <div class="header-actions">
            <!-- Botón de Ajustes -->
            <button class="btn-icon" id="settingsBtn" title="Ajustes y Menú" aria-label="Ajustes">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 m0 0l-2.09 1.15a2 2 0 0 1-2.22-.22l-.12-.12a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2h-.09a2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.12.12a2 2 0 0 1-2.22.22L2.6 18.9a2 2 0 0 1-.22-2.22l.12-.12a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2v-.09a2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 .22-2.22l1.15-2.09a2 2 0 0 1 2.22-.22l.12.12a1.65 1.65 0 0 0 1.82.33H11a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2h.09a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.12-.12a2 2 0 0 1 2.22-.22l1.15 2.09a2 2 0 0 1-.22 2.22l-.12.12a1.65 1.65 0 0 0-.33 1.82V11a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2v.09a2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>

            <!-- Menú Desplegable de Ajustes -->
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-header">Configuración y Menú</div>
                <button class="settings-item" id="menuTerms">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    Términos y Condiciones
                </button>
                <button class="settings-item" id="menuAiHelp">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Ayuda con Inteligencia Artificial
                </button>
                <button class="settings-item" id="menuAbout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Nosotros (Creadores MS3)
                </button>
            </div>
        </div>
    </header>

    <!-- Workspace Principal -->
    <main>
        <aside class="sidebar-panel">
            <div class="panel-section">
                <h3>Controles WebXR</h3>
                <div class="control-group">
                    <label for="cameraMode">Modo de Cámara 360°</label>
                    <select id="cameraMode">
                        <option value="orbit">Control Orbital Interactivo</option>
                        <option value="gyro">Giroscopio (Dispositivos Móviles)</option>
                        <option value="vr">Modo Casco VR (Stereo)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="streamQuality">Calidad de Streaming</label>
                    <select id="streamQuality">
                        <option value="4k">4K Ultra HD (360°)</option>
                        <option value="1080">1080p Full HD</option>
                        <option value="720">720p HD (Ahorro de Datos)</option>
                    </select>
                </div>
            </div>

            <div class="panel-section">
                <h3>Acciones del Workspace</h3>
                <button class="btn-primary" id="launchStreamBtn">Iniciar Transmisión WebXR</button>
            </div>
        </aside>

        <section class="viewport-container">
            <div class="vr-screen">
                <div class="vr-simulation-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <h2>Entorno Virtual MS3 Activo</h2>
                    <p style="color: var(--text-muted); margin-top: 8px; font-size: 0.9rem;">Utilice el menú superior de ajustes para consultar Términos, Ayuda IA o conocer a los Creadores.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Modales Genéricos -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Título</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico inyectado por JS -->
            </div>
        </div>
    </div>

    <script>
        // Elementos UI
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDropdown = document.getElementById('settingsDropdown');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        // Botones del menú
        const menuTerms = document.getElementById('menuTerms');
        const menuAiHelp = document.getElementById('menuAiHelp');
        const menuAbout = document.getElementById('menuAbout');

        // Toggle menú ajustes
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('active');
        });

        // Cerrar menú al hacer clic fuera
        window.addEventListener('click', () => {
            settingsDropdown.classList.remove('active');
        });

        settingsDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Contenidos de los modales
        const contents = {
            terms: {
                title: "Términos y Condiciones - MS3",
                html: `
                    <p>Bienvenido a <strong>MS3 La Nueva Televisión</strong>. Al utilizar nuestra plataforma de streaming en 360° y tecnologías WebXR, usted acepta los siguientes términos y condiciones de uso:</p><br>
                    <p><strong>1. Uso de la Plataforma:</strong> MS3 proporciona herramientas interactivas y visualización inmersiva. Queda prohibida la redistribución no autorizada del contenido multimedia provisto.</p><br>
                    <p><strong>2. Propiedad Intelectual:</strong> Todos los diseños, interfaces, códigos y contenidos asociados a MS3 y sus líneas de desarrollo están protegidos por derechos de autor.</p><br>
                    <p><strong>3. Privacidad:</strong> Sus preferencias de navegación y configuración en tiempo real se almacenan localmente para garantizar la mejor experiencia de realidad virtual.</p>
                `
            },
            aiHelp: {
                title: "Asistente de IA - Soporte MS3",
                html: `
                    <div class="ai-chat-box">
                        <div class="ai-messages" id="aiMessages">
                            <div class="ai-msg bot">¡Hola! Soy tu asistente de Inteligencia Artificial para MS3. ¿Tienes dudas sobre cómo usar la plataforma, configurar el streaming 360° o sobre WebXR? Escríbeme aquí.</div>
                        </div>
                        <div class="ai-input-row">
                            <input type="text" id="aiUserInput" placeholder="Ej: ¿Cómo configuro el modo giroscopio?">
                            <button class="btn-primary" id="aiSendBtn" style="padding: 10px 20px;">Enviar</button>
                        </div>
                    </div>
                `
            },
            about: {
                title: "Nosotros - Creadores de MS3",
                html: `
                    <p>Conoce al equipo multidisciplinario detrás del desarrollo, diseño y dirección de <strong>MS3 La Nueva Televisión</strong>:</p>
                    <div class="team-grid">
                        <div class="team-card">
                            <div class="team-avatar">GV</div>
                            <h4>Giuliana Valenzuela</h4>
                            <p>Dirección de Marketing & Conceptualización</p>
                        </div>
                        <div class="team-card">
                            <div class="team-avatar">MS</div>
                            <h4>Equipo Técnico MS3</h4>
                            <p>Desarrollo WebXR & Streaming 360°</p>
                        </div>
                        <div class="team-card">
                            <div class="team-avatar">AI</div>
                            <h4>Asesoría Creativa</h4>
                            <p>Producción de Contenidos & Escenografía</p>
                        </div>
                    </div>
                `
            }
        };

        // Funciones para abrir modales
        function openModal(type) {
            settingsDropdown.classList.remove('active');
            modalTitle.innerHTML = contents[type].title;
            modalBody.innerHTML = contents[type].html;
            modalOverlay.classList.add('active');

            // Si es IA, inicializar lógica de chat de ejemplo
            if (type === 'aiHelp') {
                initAiChat();
            }
        }

        menuTerms.addEventListener('click', () => openModal('terms'));
        menuAiHelp.addEventListener('click', () => openModal('aiHelp'));
        menuAbout.addEventListener('click', () => openModal('about'));

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Lógica interactiva del chat de IA de ayuda
        function initAiChat() {
            const sendBtn = document.getElementById('aiSendBtn');
            const userInput = document.getElementById('aiUserInput');
            const aiMessages = document.getElementById('aiMessages');

            if (!sendBtn) return;

            function handleSend() {
                const text = userInput.value.trim();
                if (!text) return;

                // Mensaje usuario
                const userDiv = document.createElement('div');
                userDiv.className = 'ai-msg user';
                userDiv.textContent = text;
                aiMessages.appendChild(userDiv);
                userInput.value = '';
                aiMessages.scrollTop = aiMessages.scrollHeight;

                // Respuesta simulada de IA
                setTimeout(() => {
                    const botDiv = document.createElement('div');
                    botDiv.className = 'ai-msg bot';
                    
                    let reply = "Para utilizar correctamente MS3, asegúrate de seleccionar el modo de cámara adecuado en el panel lateral. Si experimentas problemas con WebXR, comprueba que tu navegador soporte aceleración por hardware.";
                    const lower = text.toLowerCase();
                    if (lower.includes('giroscopio') || lower.includes('movil') || lower.includes('móvil')) {
                        reply = "El modo giroscopio te permite mover tu dispositivo móvil para explorar la transmisión 360° de forma nativa.";
                    } else if (lower.includes('streaming') || lower.includes('calidad')) {
                        reply = "Puedes alternar entre resoluciones desde el panel izquierdo. Recomendamos 4K solo con conexiones estables.";
                    }

                    botDiv.textContent = reply;
                    aiMessages.appendChild(botDiv);
                    aiMessages.scrollTop = aiMessages.scrollHeight;
                }, 600);
            }

            sendBtn.addEventListener('click', handleSend);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSend();
            });
        }
    </script>
</body>
</html>
