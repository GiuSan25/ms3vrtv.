<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Experiencia MS3 - Visor Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; width: 100vw; height: 100vh; }
        
        /* Contenedor de la escena inicial (Esfera y Logo MS3) */
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2; cursor: pointer; transition: opacity 1s ease; }
        
        /* Contenedor del entorno interno (VR) - Oculto inicialmente */
        #ms3-environment { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); }
        
        #instruction { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 3; 
            font-size: 1.1rem; pointer-events: none; transition: opacity 0.5s; padding: 0 20px; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; letter-spacing: 1px;
        }
        
        /* UI del entorno inmersivo */
        .hud-btn {
            position: absolute; right: 20px; z-index: 10;
            padding: 12px 24px; background: transparent; color: #0ff;
            border: 2px solid #0ff; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            width: 180px; text-align: center;
        }
        #gyro-status-btn { top: 80px; display: none; background: #0ff; color: #000; pointer-events: none; cursor: default; font-size: 0.9rem;} 

        #multiverse-hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; display: none; }
        .hud-interactive { pointer-events: auto; cursor: pointer; }
        #btn-volver {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 12px 30px; background: rgba(0, 0, 0, 0.7); color: #ff007f;
            border: 2px solid #ff007f; border-radius: 30px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; font-size: 1rem;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #ff007f;
            transition: all 0.3s ease;
        }
        #btn-volver:hover { background: #ff007f; color: #000; box-shadow: 0 0 25px #ff007f; }
    </style>
</head>
<body>

    <!-- UI del Entorno Inmersivo (Oculta al inicio) -->
    <button id="gyro-status-btn" class="hud-btn">Giroscopio Activo</button>

    <!-- Escena Inicial (Esfera y Logo MS3 Vidriado Girando) -->
    <div id="webgl-container"></div>

    <!-- Contenedor de la experiencia inmersiva (Oculto inicialmente) -->
    <div id="ms3-environment"></div>

    <div id="instruction">Presiona la pantalla para ingresar</div>

    <div id="multiverse-hud">
        <button id="btn-volver" class="hud-interactive">VOLVER</button>
    </div>

    <script>
        // --- Variables Globales ---
        const container = document.getElementById('webgl-container');
        const envContainer = document.getElementById('ms3-environment');
        const gyroStatusBtn = document.getElementById('gyro-status-btn');
        const multiverseHud = document.getElementById('multiverse-hud');
        const btnVolver = document.getElementById('btn-volver');
        const instructionText = document.getElementById('instruction');

        let isExperienceRunning = false; // Controla si estamos en la escena inicial
        let isInternalSystemActive = false; // Controla si estamos dentro
        
        // Variables Escena Inicial
        let scene, camera, renderer, planetGroup, textGroup;
        
        // Variables Entorno Inmersivo
        let internalScene, internalCamera, internalRenderer;
        let multiverseButtonsGroup, videoScreensGroup;
        let targetQuaternion = new THREE.Quaternion();
        let manualRotation = { x: 0, y: 0 };
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let videoTextures = [];
        let isGyroActive = false;

        // --- Inicialización Escena Inicial ---
        function initInitialScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const pointLight1 = new THREE.PointLight(0xff00ff, 2, 100);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);
            const pointLight2 = new THREE.PointLight(0x00ffff, 2, 100);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            // Grupo para rotar el conjunto
            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            // Esfera de alambre (Neón)
            const planetGeometry = new THREE.IcosahedronGeometry(2, 3);
            const planetMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                wireframe: true,
                transparent: true,
                opacity: 0.5
            });
            const planet = new THREE.Mesh(planetGeometry, planetMaterial);
            planetGroup.add(planet);

            // Texto MS3 Vidriado y Brillante
            const loader = new THREE.FontLoader();
            loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const textGeo = new THREE.TextGeometry('MS3', {
                    font: font, size: 1.8, height: 0.4, curveSegments: 12,
                    bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 5
                });
                textGeo.computeBoundingBox();
                const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
                
                // Material vidriado
                const glassMat = new THREE.MeshPhysicalMaterial({ 
                    color: 0x00ffff, 
                    metalness: 0.1,
                    roughness: 0.05,
                    transmission: 0.9, // Transparencia tipo vidrio
                    thickness: 0.5,
                    clearcoat: 1.0,
                    envMapIntensity: 1
                });
                const textMesh = new THREE.Mesh(textGeo, glassMat);
                textMesh.position.set(centerOffset, -0.8, 0);
                
                textGroup = new THREE.Group();
                textGroup.add(textMesh);
                
                // Borde brillante
                const edgeMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.4});
                const textEdge = new THREE.Mesh(textGeo, edgeMat);
                textEdge.position.set(centerOffset, -0.8, 0);
                textEdge.scale.set(1.03, 1.04, 1.1);
                textGroup.add(textEdge);

                planetGroup.add(textGroup);
            });

            camera.position.z = 6;
        }

        // --- Animación Escena Inicial ---
        function animateInitialScene() {
            if (isInternalSystemActive) return; // Detener si ya entramos
            requestAnimationFrame(animateInitialScene);
            
            if (planetGroup) {
                // Rotación constante en 360 sobre su propio eje (global)
                planetGroup.rotation.y += 0.008;
                // Un ligero movimiento oscilante para darle vida
                if(textGroup) textGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.05;
            }
            
            if (scene && camera) renderer.render(scene, camera);
        }

        // --- Transición: Iniciar Experiencia ---
        function startExperience() {
            if (isExperienceRunning) return;
            isExperienceRunning = true;

            instructionText.style.opacity = '0';
            
            // Zoom hacia el logo y fundido a negro
            gsap.to(camera.position, { z: 1, duration: 2.5, ease: "power2.inOut" });
            gsap.to(container, { opacity: 0, duration: 1.5, delay: 1, onComplete: () => {
                container.style.display = 'none';
                // Iniciar el otro sistema
                isInternalSystemActive = true;
                initInternalSystem();
                envContainer.style.opacity = '1';
                envContainer.style.pointerEvents = 'auto';
            }});
        }

        // --- Inicialización Entorno Interno (VR) ---
        function initInternalSystem() {
            internalScene = new THREE.Scene();
            internalCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            internalRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            internalRenderer.setSize(window.innerWidth, window.innerHeight);
            internalRenderer.setClearColor(0x000000, 0);
            envContainer.appendChild(internalRenderer.domElement);

            // Estrellas
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.1 });
            const starPositions = new Float32Array(6000);
            for(let i=0; i<6000; i++) starPositions[i] = (Math.random() - 0.5) * 150;
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            internalScene.add(stars);

            const userHeadGroup = new THREE.Group();
            userHeadGroup.position.set(0, 0, 0);
            internalScene.add(userHeadGroup);

            // 7 Pantallas de Video
            videoScreensGroup = new THREE.Group();
            userHeadGroup.add(videoScreensGroup);
            const videoUrls = [
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4",
                "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
            ];

            const screensConfig = [
                { angle: -1.2, y: 1.4, r: 5.5, w: 3.2, h: 1.8 }, { angle: 1.2, y: 1.5, r: 5.3, w: 2.6, h: 1.4 },
                { angle: -2.0, y: 0.0, r: 6.0, w: 3.8, h: 2.1 }, { angle: 2.0, y: 0.2, r: 5.8, w: 2.2, h: 1.2 },
                { angle: -1.0, y: -1.3, r: 5.0, w: 2.4, h: 1.3 }, { angle: 1.0, y: -1.2, r: 5.2, w: 3.0, h: 1.6 },
                { angle: 0.0, y: 2.2, r: 5.5, w: 2.8, h: 1.5 }
            ];

            screensConfig.forEach((config, index) => {
                const video = document.createElement('video');
                video.src = videoUrls[index]; video.crossOrigin = 'anonymous'; video.loop = true; video.muted = true; video.playsInline = true; video.play();
                const videoTexture = new THREE.VideoTexture(video); videoTextures.push(videoTexture);
                const planeGeo = new THREE.PlaneGeometry(config.w, config.h);
                const planeMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
                const screenMesh = new THREE.Mesh(planeGeo, planeMat);
                const x = Math.sin(config.angle) * config.r; const z = Math.cos(config.angle) * config.r;
                screenMesh.position.set(x, config.y, z); screenMesh.lookAt(0, config.y, 0);
                const frameGeo = new THREE.EdgesGeometry(planeGeo);
                const frameMat = new THREE.LineBasicMaterial({ color: index % 2 === 0 ? 0x00ffff : 0xff00ff, linewidth: 2 });
                const frameLine = new THREE.LineSegments(frameGeo, frameMat);
                screenMesh.add(frameLine);
