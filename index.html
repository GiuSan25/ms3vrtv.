<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Universo 360 VR Inmersivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }
        #vr-view-container:active { cursor: grabbing; }
        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }
        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        .css3d-container { z-index: 10; }
        #top-ui-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }
        .control-btn {
            background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto;
        }
        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }
        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }
        .floating-card { pointer-events: auto; user-select: none; }
        .interactive-btn { pointer-events: auto; transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }
        .neon-box-cyan {
            border: 3px solid #00f0ff; box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 24px; background: rgba(10, 6, 24, 0.92); backdrop-filter: blur(16px);
        }
        #video-controls-overlay {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: none; gap: 15px; pointer-events: auto;
        }
        #editor-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 3000;
            display: none; justify-content: center; align-items: center; padding: 20px; pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)">
            <span>MENÚ</span>
        </button>
        <div id="dropdown-menu" class="hidden mt-3 w-64 neon-box-cyan p-4 flex flex-col gap-3 transition-all duration-300 transform scale-95 opacity-0">
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR (SPLIT)</span></button>
        </div>
    </div>

    <div id="instruction">Arrastra con el mouse para mirar en 360° | Haz clic en la esfera MS3 para entrar</div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>
        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="video-controls-overlay">
        <button class="control-btn" onclick="toggleVideoPlay()">REPRODUCIR / PAUSAR</button>
        <button class="control-btn" onclick="exitVideo360()">SALIR DEL VIDEO 360</button>
    </div>

    <!-- PANEL MODAL DE EDITOR SECRETO -->
    <div id="editor-modal">
        <div class="neon-box-cyan p-8 max-w-lg w-full text-center flex flex-col gap-6">
            <h2 class="text-3xl font-black text-cyan-400">PANEL DE CONFIGURACIÓN</h2>
            <p class="text-gray-300 text-sm">Selecciona tu video 360 local. Se enlazará al instante sin demoras.</p>
            
            <div class="flex flex-col gap-3 items-center">
                <input type="file" id="local-video-file" accept="video/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-black hover:file:bg-cyan-400 cursor-pointer"/>
                <span id="file-status" class="text-xs text-fuchsia-400 font-bold"></span>
            </div>

            <div class="flex gap-4 justify-center mt-4">
                <button class="control-btn" onclick="linkInstantVideo()">VINCULAR VIDEO</button>
                <button class="control-btn border-red-500 text-red-400" onclick="closeEditorModal()">CERRAR</button>
            </div>
        </div>
    </div>

    <video id="vr360-video" loop crossorigin="anonymous" playsinline style="display:none;"></video>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let planet, textGroup, planetGroup, universeSphere, starField;
        let hudGroup = null, videoSphere = null, videoTexture = null;
        let isTopMenuOpen = false, isVideoPlaying360 = false, isSystemActive = false, isVRMode = false;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0, currentRotationX = 0, currentRotationY = 0, dragDistance = 0;
        let directVideoObjectURL = null;
        const eyeSeparation = 0.064;

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();
        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;
        cameraRig.add(camera); cameraRig.add(cameraLeft); cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container-left').appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container-right').appendChild(rendererRight.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css3d-container-left').appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        document.getElementById('css3d-container-right').appendChild(cssRendererRight.domElement);

        scene.add(new THREE.AmbientLight(0x3a1050, 1.5));

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 100;
            starPositions[i+1] = (Math.random() - 0.5) * 100;
            starPositions[i+2] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.2, color: 0xffffff }));
        scene.add(starField);

        planetGroup = new THREE.Group();
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
        planet.position.y = -1.5; planetGroup.add(planet);
        scene.add(planetGroup);

        textGroup = new THREE.Group(); textGroup.position.y = 0.8;
        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textGeo = new THREE.TextGeometry('MS3', { font: font, size: 1.2, height: 0.4 });
            const textMesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
            textGeo.computeBoundingBox();
            textMesh.position.x = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            textGroup.add(textMesh);
        });
        scene.add(textGroup);

        // Escuchar la tecla 'e' o 'E' para abrir el panel secreto
        window.addEventListener('keydown', (e) => {
            if (e.key === 'e' || e.key === 'E') {
                const pass = prompt("Introduce la clave de acceso al panel de editor:");
                if (pass === "Hhxz##") {
                    document.getElementById('editor-modal').style.display = 'flex';
                } else if (pass !== null) {
                    alert("Clave incorrecta.");
                }
            }
        });

        function toggleTopMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('dropdown-menu');
            isTopMenuOpen = !isTopMenuOpen;
            if (isTopMenuOpen) {
                dropdown.classList.remove('hidden');
                setTimeout(() => dropdown.classList.remove('scale-95', 'opacity-0'), 10);
            } else {
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        function closeEditorModal() {
            document.getElementById('editor-modal').style.display = 'none';
        }

        function linkInstantVideo() {
            const fileInput = document.getElementById('local-video-file');
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                directVideoObjectURL = URL.createObjectURL(file);
                document.getElementById('vr360-video').src = directVideoObjectURL;
                document.getElementById('file-status').innerText = "¡Video vinculado al instante!";
                setTimeout(() => {
                    closeEditorModal();
                    document.getElementById('file-status').innerText = "";
                }, 1000);
            } else {
                alert("Por favor selecciona un archivo de video primero.");
            }
        }

        function createMultiverseHUD() {
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[1600px] flex flex-col gap-10 floating-card";
            mainContainer.innerHTML = `
                <button class="interactive-btn self-start bg-black/95 border-6 border-fuchsia-500 text-fuchsia-300 px-14 py-7 rounded-full font-black text-3xl flex items-center gap-6 shadow-[0_0_50px_rgba(240,0,255,0.9)]" onclick="exitMultiverse(event)">
                    <span>VOLVER AL INICIO</span>
                </button>
                <div class="w-full neon-box-cyan p-12 flex flex-col justify-between h-[580px] rounded-3xl bg-black/80">
                    <div>
                        <span class="text-xl font-extrabold tracking-widest text-cyan-300 uppercase">MS3 Multiverse Live</span>
                        <h1 class="text-7xl font-black text-white mt-4">EXPERIENCIA INMERSIVA 360°</h1>
                        <p class="text-gray-200 text-2xl mt-4 max-w-2xl">Disfruta del video inyectado configurado por el administrador.</p>
                    </div>
                    <div>
                        <button onclick="start360VideoExperience()" class="interactive-btn bg-white text-black px-12 py-5 rounded-2xl font-black text-2xl shadow-[0_0_30px_#fff]">INICIAR INMERSIÓN 360°</button>
                    </div>
                </div>
            `;
            hudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.0055, 0.0055, 0.0055);
            hudGroup.add(cssObject);
            hudGroup.position.set(0, 0, -1.6);
            cssScene.add(hudGroup);
        }

        function start360VideoExperience() {
            const videoElement = document.getElementById('vr360-video');
            if (!videoElement.src || videoElement.src === window.location.href) {
                alert("Presiona la tecla 'E' en tu teclado e introduce la clave para seleccionar tu video local.");
                return;
            }

            if (hudGroup) { cssScene.remove(hudGroup); hudGroup = null; }
            universeSphere.visible = false;
            starField.visible = false;

            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBAFormat;

            const sphereGeo = new THREE.SphereGeometry(60, 60, 40);
            const sphereMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.BackSide });
            videoSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(videoSphere);

            videoElement.play().then(() => {
                isVideoPlaying360 = true;
                document.getElementById('video-controls-overlay').style.display = 'flex';
            }).catch(err => {
                alert("Haz clic en la pantalla para permitir la reproducción del video.");
                console.error(err);
            });
        }

        function toggleVideoPlay() {
            const videoElement = document.getElementById('vr360-video');
            if (videoElement.paused) videoElement.play();
            else videoElement.pause();
        }

        function exitVideo360() {
            const videoElement = document.getElementById('vr360-video');
            videoElement.pause();
            if (videoSphere) {
                scene.remove(videoSphere);
                videoSphere.geometry.dispose();
                videoSphere.material.dispose();
                videoSphere = null;
            }
            universeSphere.visible = true;
            starField.visible = true;
            document.getElementById('video-controls-overlay').style.display = 'none';
            isSystemActive = false;
            planetGroup.visible = true;
            textGroup.visible = true;
            document.getElementById('instruction').style.opacity = '1';
        }

        function enterMultiverse() {
            if (isSystemActive) return;
            isSystemActive = true;
            document.getElementById('instruction').style.opacity = '0';
            planetGroup.visible = false;
            textGroup.visible = false;
            createMultiverseHUD();
        }

        function exitMultiverse(event) {
            if (event) event.stopPropagation();
            if (hudGroup) { cssScene.remove(hudGroup); hudGroup = null; }
            planetGroup.visible = true;
            textGroup.visible = true;
            isSystemActive = false;
            document.getElementById('instruction').style.opacity = '1';
        }

        function onPointerDown(e) {
            if (e.target.closest('#top-ui-container') || e.target.closest('#video-controls-overlay') || e.target.closest('#editor-modal')) return;
            isDragging = true; dragDistance = 0;
            previousMousePosition = { x: e.touches ? e.touches[0].clientX : e.clientX, y: e.touches ? e.touches[0].clientY : e.clientY };
        }
        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;
            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);
            targetRotationY += deltaX * 0.004;
            targetRotationX += deltaY * 0.004;
            targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));
            previousMousePosition = { x, y };
        }
        function onPointerUp(e) {
            if (isDragging && dragDistance < 10 && !isSystemActive && !isVideoPlaying360) {
                if (!e.target.closest('#top-ui-container')) enterMultiverse();
            }
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.getElementById('vr-btn-text').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR (SPLIT)';
            onWindowResize();
        }

        function animate() {
            requestAnimationFrame(animate);
            currentRotationX += (targetRotationX - currentRotationX) * 0.08;
            currentRotationY += (targetRotationY - currentRotationY) * 0.08;
            cameraRig.rotation.x = currentRotationX;
            cameraRig.rotation.y = currentRotationY;

            if (planetGroup.visible) {
                planet.rotation.y += 0.008;
                textGroup.rotation.y += 0.006;
            }

            if (isVRMode) {
                rendererLeft.render(scene, cameraLeft);
                rendererRight.render(scene, cameraRight);
                cssRendererLeft.render(cssScene, cameraLeft);
                cssRendererRight.render(cssScene, cameraRight);
            } else {
                rendererLeft.render(scene, camera);
                cssRendererLeft.render(cssScene, camera);
            }
        }
        animate();

        function onWindowResize() {
            const width = isVRMode ? window.innerWidth / 2 : window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = window.innerWidth / height; camera.updateProjectionMatrix();
            cameraLeft.aspect = width / height; cameraLeft.updateProjectionMatrix();
            cameraRight.aspect = width / height; cameraRight.updateProjectionMatrix();
            rendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            rendererRight.setSize(width, height);
            cssRendererLeft.setSize(isVRMode ? width : window.innerWidth, height);
            cssRendererRight.setSize(width, height);
        }
        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
