<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Multiverso Inmersivo VR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        * { -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; user-select: none; -webkit-user-select: none; touch-action: none; }
        #vr-view-container { display: flex; width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 2; cursor: grab; }
        #vr-view-container:active { cursor: grabbing; }
        .vr-eye { position: relative; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }
        .webgl-canvas-container, .css3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .css3d-container { z-index: 10; }
        #top-ui-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto; }
        .gaze-reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(0, 240, 255, 0.6); z-index: 999; pointer-events: none; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
        .gaze-reticle.disabled { opacity: 0 !important; }
        .gaze-dot { width: 6px; height: 6px; background: #00f0ff; border-radius: 50%; box-shadow: 0 0 8px #00f0ff; }
        .control-btn { background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto; }
        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }
        #instruction { position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease; }
        .neon-box-cyan { border: 3px solid #00f0ff; box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3); border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px); }
        .neon-box-magenta { border: 3px solid #f000ff; box-shadow: 0 0 35px rgba(240, 0, 255, 0.6), inset 0 0 30px rgba(240, 0, 255, 0.3); border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px); }
        .netflix-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
        .netflix-card { height: 125px; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid rgba(0, 240, 255, 0.4); cursor: pointer; background: #111; }
        #video-modal, #about-modal, #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000; display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto; }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px #0ff; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)"><span>MENÚ</span></button>
        <div id="dropdown-menu" class="hidden mt-3 w-72 neon-box-cyan p-4 flex flex-col gap-3">
            <button class="control-btn justify-start w-full text-sm" onclick="requestIOSPermissions()">GIROSCOPIO</button>
            <button class="control-btn justify-start w-full text-sm" onclick="toggleVRMode()">VR MODE</button>
        </div>
    </div>

    <div id="instruction">Arrastra para mover el universo | Toca únicamente la esfera MS3 para entrar</div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>
        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="preview-modal"><div class="neon-box-magenta p-8 max-w-lg w-full flex flex-col gap-5 relative"><h2 id="preview-title" class="text-3xl font-black text-white">Título</h2><button class="modal-close-btn" onclick="closePreviewModal()">VOLVER</button></div></div>
    <div id="video-modal"><video id="active-video" controls autoplay playsinline></video><button class="modal-close-btn" onclick="closeVideo()">Cerrar</button></div>
    <div id="about-modal"><div class="neon-box-cyan p-8 max-w-md text-center"><h2 class="text-3xl font-bold text-cyan-400">MS3</h2><button class="modal-close-btn" onclick="closeAboutModal()">CERRAR</button></div></div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let planet, textGroup, planetGroup;
        let isSystemActive = false, isGyroActive = false, isVRMode = false;
        let isDragging = false, dragDistance = 0, previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0, currentRotationX = 0, currentRotationY = 0;
        
        // Variables para Raycaster
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();
        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraRig.add(camera);
        cameraRig.position.set(0, 0, 5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container-left').appendChild(rendererLeft.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css3d-container-left').appendChild(cssRendererLeft.domElement);

        // Planeta (Esfera)
        planetGroup = new THREE.Group();
        planet = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
        planet.position.y = -1.5;
        planetGroup.add(planet);
        scene.add(planetGroup);

        // Lógica de Interacción con Raycaster
        function handleCanvasInteraction(clientX, clientY) {
            if (isSystemActive) return;
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(planet);
            if (intersects.length > 0) {
                triggerSystemEntry();
            }
        }

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            dragDistance = 0;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - previousMousePosition.x;
            let deltaY = e.clientY - previousMousePosition.y;
            dragDistance += Math.abs(deltaX) + Math.abs(deltaY);
            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            isDragging = false;
            if (dragDistance < 10) handleCanvasInteraction(e.clientX, e.clientY);
        });

        function triggerSystemEntry() {
            isSystemActive = true;
            document.getElementById('instruction').style.opacity = '0';
            gsap.to(planet.scale, { x: 30, y: 30, z: 30, duration: 1.5 });
            gsap.to(cameraRig.position, { z: 1, duration: 1.5, onComplete: () => { planet.visible = false; }});
        }

        function animate() {
            requestAnimationFrame(animate);
            currentRotationX += (targetRotationX - currentRotationX) * 0.1;
            currentRotationY += (targetRotationY - currentRotationY) * 0.1;
            cameraRig.rotation.y = currentRotationY;
            cameraRig.rotation.x = currentRotationX;
            planetGroup.rotation.y += 0.005;
            rendererLeft.render(scene, camera);
            cssRendererLeft.render(cssScene, camera);
        }
        animate();
    </script>
</body>
</html>
