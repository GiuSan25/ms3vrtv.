<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso MS3</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #05050a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.05);
        }

        /* Esfera Neón Giratoria */
        .neon-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #00ffff 40%, #0044ff 70%, #000 100%);
            box-shadow: 
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #0044ff,
                inset 0 0 30px rgba(255, 255, 255, 0.8);
            animation: rotateSphere 6s linear infinite;
        }

        @keyframes rotateSphere {
            0% {
                filter: hue-rotate(0deg);
                box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #0044ff, inset 0 0 30px rgba(255, 255, 255, 0.8);
            }
            50% {
                box-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff, 0 0 100px #aa00ff, inset 0 0 40px rgba(255, 255, 255, 0.9);
            }
            100% {
                filter: hue-rotate(360deg);
                box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #0044ff, inset 0 0 30px rgba(255, 255, 255, 0.8);
            }
        }

        /* Texto inferior */
        .instruction {
            margin-top: 30px;
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            text-align: center;
            animation: pulseText 2s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Contenedor 3D para las letras MS3 de vidrio */
        .scene-3d {
            perspective: 1000px;
            display: none;
            width: 300px;
            height: 200px;
            justify-content: center;
            align-items: center;
        }

        .glass-text-3d {
            font-size: 5rem;
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.05) 50%, rgba(0,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform-style: preserve-3d;
            animation: rotate3D 5s linear infinite;
            /* Simulación de ancho/profundidad 3D con sombras múltiples */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b2b2b2,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 0 20px rgba(0, 255, 255, 0.6),
                0 0 40px rgba(0, 255, 255, 0.4);
        }

        @keyframes rotate3D {
            0% {
                transform: rotateY(0deg) rotateX(10deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer" onclick="transformToMS3()">
        <div class="neon-sphere" id="sphere"></div>
        <div class="instruction" id="instructionText">presiona la esfera para entrar al multiverso ms3</div>
    </div>

    <div class="scene-3d" id="scene3d">
        <div class="glass-text-3d">MS3</div>
    </div>

    <script>
        function transformToMS3() {
            const container = document.getElementById('mainContainer');
            const scene3d = document.getElementById('scene3d');

            // Ocultar esfera y texto con efecto desvanecido
            container.style.transition = 'opacity 0.5s ease';
            container.style.opacity = '0';

            setTimeout(() => {
                container.style.display = 'none';
                // Mostrar el texto 3D de vidrio giratorio
                scene3d.style.display = 'flex';
            }, 500);
        }
    </script>

</body>
</html>
