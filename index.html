<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Multiverso Inmersivo VR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; user-select: none; touch-action: none; }
        #vr-view-container { display: flex; width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 2; }
        .webgl-canvas-container, .css3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .css3d-container { z-index: 10; }
        #top-ui-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto; }
        .control-btn { background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; padding: 12px 24px; border-radius: 9999px; font-weight: 700; cursor: pointer; pointer-events: auto; }
        #video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; display: none; justify-content: center; align-items: center; flex-direction: column; pointer-events: auto; }
        #video-container { width: 90vw; height: 80vh; max-width: 900px; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .netflix-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
        .netflix-card { height: 125px; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid rgba(0, 240, 255, 0.4); cursor: pointer; background: #111; }
        .neon-box-magenta { border: 3px solid #f000ff; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px); }
    </style>
</head>
<body>

    <!-- UI Principal -->
    <div id="top-ui-container">
        <button class="control-btn" onclick="toggleTopMenu()">MENÚ</button>
        <div id="dropdown-menu" class="hidden mt-3 p-4 neon-box-magenta flex flex-col gap-2">
            <button class="control-btn text-sm" onclick="toggleVRMode()">VER EN VR</button>
        </div>
    </div>

    <div id="vr-view-container">
        <div class="webgl-canvas-container" id="canvas-container-left"></div>
        <div class="css3d-container" id="css3d-container-left"></div>
    </div>

    <!-- Modales -->
    <div id="preview-modal" style="display:none; position:fixed; inset:0; z-index:2000; justify-content:center; align-items:center; background:rgba(0,0,0,0.9);">
        <div class="neon-box-magenta p-8 max-w-lg w-full text-white">
            <h2 id="preview-title" class="text-3xl font-black">BUSCANDO</h2>
            <button class="mt-4 bg-cyan-500 p-3 rounded" onclick="playYouTube('y3qO1OL5nRg')">REPRODUCIR VR</button>
            <button class="ml-4" onclick="closePreview()">CERRAR</button>
        </div>
    </div>

    <div id="video-modal">
        <div id="video-container"></div>
        <button class="modal-close-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <script>
        // --- Lógica del Reproductor ---
        function playYouTube(videoId) {
            document.getElementById('preview-modal').style.display = 'none';
            const container = document.getElementById('video-container');
            // Carga el video en un Iframe
            container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('video-modal').style.display = 'flex';
        }

        function closeVideo() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('video-container').innerHTML = ''; // Detiene el video al cerrar
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        // --- Configuración básica Three.js para mostrar la UI ---
        // (He simplificado la inicialización para que el foco sea el reproductor)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({alpha: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container-left').appendChild(renderer.domElement);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
