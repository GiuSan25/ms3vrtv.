<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MS3 - Multiverso Inmersivo VR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            font-family: 'Inter', sans-serif; width: 100vw; height: 100dvh; 
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        
        #vr-view-container {
            display: flex; width: 100vw; height: 100dvh; position: absolute;
            top: 0; left: 0; z-index: 2; cursor: grab;
        }

        #vr-view-container:active { cursor: grabbing; }

        .vr-eye {
            position: relative; width: 100%; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        body.vr-mode .vr-eye { width: 50vw; }
        body.vr-mode #eye-right { display: flex !important; border-left: 2px solid rgba(0, 240, 255, 0.4); }
        #eye-right { display: none; }

        .webgl-canvas-container, .css3d-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        
        .css3d-container { z-index: 10; }

        #top-ui-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto;
        }

        .control-btn {
            background: rgba(10, 6, 24, 0.85); border: 2px solid #00f0ff; color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; white-space: nowrap; pointer-events: auto;
        }

        .control-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); transform: scale(1.05); }

        #instruction { 
            position: fixed; bottom: 35px; width: 100%; text-align: center; color: #fff; z-index: 100; 
            font-size: 1.1rem; pointer-events: none; text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; font-weight: 600; transition: opacity 0.5s ease;
        }

        #flash-overlay {
            position: fixed; inset: 0; background: #00f0ff; opacity: 0; pointer-events: none; z-index: 3000;
            transition: opacity 0.3s ease; mix-blend-mode: screen;
        }

        .floating-card { pointer-events: auto; user-select: none; }
        .interactive-btn { pointer-events: auto; transition: transform 0.2s ease, border-color 0.2s ease; cursor: pointer; }
        .interactive-btn:hover, .floating-card:hover { transform: scale(1.02); }

        .neon-box-cyan {
            border: 3px solid #00f0ff; box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), inset 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .neon-box-magenta {
            border: 3px solid #f000ff; box-shadow: 0 0 35px rgba(240, 0, 255, 0.6), inset 0 0 30px rgba(240, 0, 255, 0.3);
            border-radius: 24px; background: rgba(10, 6, 24, 0.95); backdrop-filter: blur(16px);
        }

        .netflix-grid {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; overflow: visible;
        }
        @media (max-width: 768px) {
            .netflix-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        }

        .netflix-card {
            height: 125px; border-radius: 10px; overflow: hidden; position: relative;
            border: 2px solid rgba(0, 240, 255, 0.4); transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer; background: #111;
        }
        .netflix-card:hover { transform: scale(1.03); border-color: #f000ff; box-shadow: 0 0 15px rgba(240, 0, 255, 0.8); z-index: 10; }
        .netflix-card img { width: 100%; height: 100%; object-fit: cover; }
        .netflix-card .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 6px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }

        #video-modal, #preview-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; pointer-events: auto;
        }
        #video-modal video { width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 0 30px #0ff; }
        .modal-close-btn { margin-top: 20px; padding: 10px 25px; background: #0ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="top-ui-container">
        <button id="menu-toggle-btn" class="interactive-btn control-btn" onclick="toggleTopMenu(event)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>MENÚ</span>
        </button>
        <div id="dropdown-menu" class="hidden mt-3 w-72 neon-box-cyan p-4 flex flex-col gap-3 transition-all duration-300 transform scale-95 opacity-0">
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="requestIOSPermissions()"><span id="gyro-btn-text">GIROSCOPIO: OFF</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="toggleVRMode()"><span id="vr-btn-text">VER EN VR</span></button>
            <button class="interactive-btn control-btn justify-start w-full text-sm" onclick="openAboutSection(event)"><span>NOSOTROS</span></button>
        </div>
    </div>

    <div id="instruction">Arrastra con el dedo en cualquier parte para mover el universo | Toca el logo MS3 para activar las gafas VR</div>

    <div id="vr-view-container">
        <div class="vr-eye" id="eye-left">
            <div class="webgl-canvas-container" id="canvas-container-left"></div>
            <div class="css3d-container" id="css3d-container-left"></div>
        </div>

        <div class="vr-eye" id="eye-right">
            <div class="webgl-canvas-container" id="canvas-container-right"></div>
            <div class="css3d-container" id="css3d-container-right"></div>
        </div>
    </div>

    <div id="preview-modal">
        <div class="neon-box-magenta p-8 max-w-lg w-full flex flex-col gap-5 relative">
            <h2 id="preview-title" class="text-3xl font-black text-white drop-shadow-[0_0_15px_#f000ff]">Título del Programa</h2>
            <p id="preview-desc" class="text-gray-300 text-base leading-relaxed">Descripción detallada del contenido inmersivo VR exclusivo del multiverso.</p>
            <div class="flex gap-4 mt-2">
                <button id="preview-play-btn" class="interactive-btn bg-cyan-400 text-black px-6 py-3 rounded-xl font-black text-lg shadow-[0_0_20px_#00f0ff]" onclick="playFromPreview()">REPRODUCIR</button>
                <button class="interactive-btn bg-transparent border-2 border-white text-white px-6 py-3 rounded-xl font-bold text-lg" onclick="closePreviewModal()">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="video-modal">
        <video id="active-video" controls autoplay playsinline></video>
        <button class="modal-close-btn interactive-btn" onclick="closeVideo()">Cerrar Reproductor</button>
    </div>

    <script>
        let scene, cssScene, camera, cameraLeft, cameraRight, cameraRig;
        let rendererLeft, rendererRight, cssRendererLeft, cssRendererRight;
        let logoGroup, vrGogglesGroup, universeSphere, starField;
        let multiverseHudGroup = null;
        let vrProgramsHudGroup = null;
        let aboutHudGroup = null;
        let spinningCoins = [];
        let isTopMenuOpen = false;
        let selectedVideoData = null;

        let isSystemActive = false, isGyroActive = false, isVRMode = false;
        let isInAboutSection = false;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;

        let deviceQuaternion = new THREE.Quaternion();
        const eyeSeparation = 0.064;

        const containerLeft = document.getElementById('canvas-container-left');
        const containerRight = document.getElementById('canvas-container-right');
        const cssContainerLeft = document.getElementById('css3d-container-left');
        const cssContainerRight = document.getElementById('css3d-container-right');
        const instruction = document.getElementById('instruction');
        const flashOverlay = document.getElementById('flash-overlay');

        scene = new THREE.Scene();
        cssScene = new THREE.Scene();

        cameraRig = new THREE.Object3D();
        scene.add(cameraRig);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        cameraLeft = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        cameraRight = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        cameraLeft.position.x = -eyeSeparation / 2;
        cameraRight.position.x = eyeSeparation / 2;

        cameraRig.add(camera);
        cameraRig.add(cameraLeft);
        cameraRig.add(cameraRight);
        cameraRig.position.set(0, 0, 5);

        rendererLeft = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererLeft.setSize(window.innerWidth, window.innerHeight);
        containerLeft.appendChild(rendererLeft.domElement);

        rendererRight = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererRight.setSize(window.innerWidth, window.innerHeight);
        containerRight.appendChild(rendererRight.domElement);

        cssRendererLeft = new THREE.CSS3DRenderer();
        cssRendererLeft.setSize(window.innerWidth, window.innerHeight);
        cssContainerLeft.appendChild(cssRendererLeft.domElement);

        cssRendererRight = new THREE.CSS3DRenderer();
        cssRendererRight.setSize(window.innerWidth / 2, window.innerHeight);
        cssContainerRight.appendChild(cssRendererRight.domElement);

        scene.add(new THREE.AmbientLight(0x221133, 2.0));
        
        const pLightCyan = new THREE.PointLight(0x00f0ff, 6, 100); 
        pLightCyan.position.set(-10, 10, 10); 
        scene.add(pLightCyan);

        const pLightPink = new THREE.PointLight(0xf000ff, 6, 100); 
        pLightPink.position.set(10, -10, 10); 
        scene.add(pLightPink);

        const pLightWhite = new THREE.PointLight(0xffffff, 4, 50); 
        pLightWhite.position.set(0, 5, 5); 
        scene.add(pLightWhite);

        const universeGeo = new THREE.SphereGeometry(70, 32, 32);
        universeSphere = new THREE.Mesh(universeGeo, new THREE.MeshBasicMaterial({ color: 0x070216, side: THREE.BackSide }));
        scene.add(universeSphere);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const palette = [new THREE.Color(0x00f0ff), new THREE.Color(0xf000ff), new THREE.Color(0x9d4edd), new THREE.Color(0xffffff)];

        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            const color = palette[Math.floor(Math.random() * palette.length)];
            starColors[i * 3] = color.r; starColors[i * 3 + 1] = color.g; starColors[i * 3 + 2] = color.b;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.9 }));
        scene.add(starField);

        logoGroup = new THREE.Group();
        logoGroup.position.y = 0.2;
        scene.add(logoGroup);

        vrGogglesGroup = new THREE.Group();
        vrGogglesGroup.visible = false;
        vrGogglesGroup.scale.set(0.01, 0.01, 0.01);
        scene.add(vrGogglesGroup);

        // --- MATERIAL SÓLIDO Y METÁLICO PARA EL LOGO MS3 (Cero transparencia) ---
        const solidNeonCyanMat = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            metalness: 0.8,
            roughness: 0.2,
            emissive: 0x006688,
            emissiveIntensity: 0.6
        });

        const solidMagentaMat = new THREE.MeshStandardMaterial({
            color: 0xf000ff,
            metalness: 0.8,
            roughness: 0.2,
            emissive: 0x880088,
            emissiveIntensity: 0.6
        });

        const loader = new THREE.FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textConfig = { 
                font: font, size: 1.3, height: 0.35, curveSegments: 16, 
                bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.04, bevelSegments: 8 
            };
            const textGeo = new THREE.TextGeometry('MS3', textConfig);
            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            const textMesh = new THREE.Mesh(textGeo, solidNeonCyanMat);
            textMesh.position.x = centerOffset; 
            logoGroup.add(textMesh);

            const ringGeo = new THREE.TorusGeometry(2.2, 0.05, 16, 100);
            const ringMesh = new THREE.Mesh(ringGeo, solidMagentaMat);
            ringMesh.rotation.x = Math.PI / 3;
            logoGroup.add(ringMesh);
        });

        // --- MODELO 3D DE GAFAS DE REALIDAD VIRTUAL DE ALTA GAMA Y DETALLE ---
        const headsetBodyMat = new THREE.MeshStandardMaterial({ color: 0x111625, metalness: 0.95, roughness: 0.15 });
        const accentCyanMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.8, roughness: 0.2, emissive: 0x005577, emissiveIntensity: 0.5 });
        const lensGlassMat = new THREE.MeshPhysicalMaterial({ color: 0xff00ff, metalness: 0.1, roughness: 0.1, transmission: 0.9, thickness: 1.5, transparent: true, opacity: 0.95 });
        const facePadMat = new THREE.MeshStandardMaterial({ color: 0x0a0c14, roughness: 0.9 });

        // Visor principal curvado y ergonómico
        const visorMainGeo = new THREE.BoxGeometry(3.6, 1.6, 1.1);
        const visorMain = new THREE.Mesh(visorMainGeo, headsetBodyMat);
        vrGogglesGroup.add(visorMain);

        // Panel frontal estético con bisel cian iluminado
        const frontPanelGeo = new THREE.BoxGeometry(3.3, 1.3, 0.2);
        const frontPanel = new THREE.Mesh(frontPanelGeo, accentCyanMat);
        frontPanel.position.z = 0.52;
        vrGogglesGroup.add(frontPanel);

        // Cámaras de seguimiento frontales estilo visor VR pro (pequeños cilindros metálicos)
        const camGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.1, 16);
        camGeo.rotateX(Math.PI / 2);
        const leftCam = new THREE.Mesh(camGeo, headsetBodyMat);
        leftCam.position.set(-1.2, 0.5, 0.63);
        const rightCam = new THREE.Mesh(camGeo, headsetBodyMat);
        rightCam.position.set(1.2, 0.5, 0.63);
        vrGogglesGroup.add(leftCam);
        vrGogglesGroup.add(rightCam);

        // Lentes ópticas de alta precisión
        const lensHolderGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.15, 32);
        lensHolderGeo.rotateX(Math.PI / 2);
        
        const leftLensHolder = new THREE.Mesh(lensHolderGeo, accentCyanMat);
        leftLensHolder.position.set(-0.9, 0, 0.55);
        const rightLensHolder = new THREE.Mesh(lensHolderGeo, accentCyanMat);
        rightLensHolder.position.set(0.9, 0, 0.55);
        vrGogglesGroup.add(leftLensHolder);
        vrGogglesGroup.add(rightLensHolder);

        const lensGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 32);
        lensGeo.rotateX(Math.PI / 2);
        const leftLens = new THREE.Mesh(lensGeo, lensGlassMat);
        leftLens.position.set(-0.9, 0, 0.58);
        const rightLens = new THREE.Mesh(lensGeo, lensGlassMat);
        rightLens.position.set(0.9, 0, 0.58);
        vrGogglesGroup.add(leftLens);
        vrGogglesGroup.add(rightLens);

        // Almohadilla facial ergonómica trasera
        const facePadGeo = new THREE.BoxGeometry(3.4, 1.4, 0.3);
        const facePad = new THREE.Mesh(facePadGeo, facePadMat);
        facePad.position.z = -0.55;
        vrGogglesGroup.add(facePad);

        // Correas de sujeción laterales ajustables
        const strapGeo = new THREE.CylinderGeometry(1.9, 1.9, 0.3, 32, 1, true);
        const strapMesh = new THREE.Mesh(strapGeo, new THREE.MeshStandardMaterial({ color: 0x1a2238, roughness: 0.5, side: THREE.DoubleSide }));
        vrGogglesGroup.add(strapMesh);

        function toggleTopMenu(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('dropdown-menu');
            isTopMenuOpen = !isTopMenuOpen;

            if (isTopMenuOpen) {
                dropdown.classList.remove('hidden');
                setTimeout(() => {
                    dropdown.classList.remove('scale-95', 'opacity-0');
                    dropdown.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                dropdown.classList.remove('scale-100', 'opacity-100');
                dropdown.classList.add('scale-95', 'opacity-0');
                setTimeout(() => dropdown.classList.add('hidden'), 300);
            }
        }

        function requestIOSPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') activateGyroscope();
                    else alert('Permiso de giroscopio denegado.');
                }).catch(console.error);
            } else {
                activateGyroscope();
            }
        }

        function activateGyroscope() {
            isGyroActive = !isGyroActive;
            const btnText = document.getElementById('gyro-btn-text');
            if (isGyroActive) {
                btnText.innerText = 'GIROSCOPIO: ON';
                window.addEventListener('deviceorientation', handleOrientation, true);
            } else {
                btnText.innerText = 'GIROSCOPIO: OFF';
                window.removeEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            if (!isGyroActive) return;
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            
            const europa = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            deviceQuaternion.setFromEuler(europa);
            cameraRig.quaternion.copy(deviceQuaternion);
        }

        const viewContainer = document.getElementById('vr-view-container');
        viewContainer.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging || isGyroActive) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (isSystemActive || isInAboutSection) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(logoGroup.children, true);

            if (intersects.length > 0) {
                transformToGogglesAndEnter();
            }
        });

        function transformToGogglesAndEnter() {
            isSystemActive = true;
            instruction.style.opacity = '0';

            gsap.to(logoGroup.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.4, ease: "power2.in", onComplete: () => {
                logoGroup.visible = false;
                vrGogglesGroup.position.copy(logoGroup.position);
                vrGogglesGroup.rotation.copy(logoGroup.rotation);
                vrGogglesGroup.visible = true;

                gsap.to(vrGogglesGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.5, ease: "back.out(1.7)" });
                gsap.to(vrGogglesGroup.rotation, { y: 0, x: 0, duration: 0.5, ease: "power2.out" });
            }});

            setTimeout(() => {
                gsap.to(cameraRig.position, { 
                    z: 0.1, 
                    duration: 0.7, 
                    ease: "power3.in",
                    onUpdate: () => {
                        cameraLeft.position.z = cameraRig.position.z;
                        cameraRight.position.z = cameraRig.position.z;
                    }
                });

                gsap.to(vrGogglesGroup.scale, { x: 8.0, y: 8.0, z: 8.0, duration: 0.7, ease: "power2.in" });

                setTimeout(() => {
                    flashOverlay.style.opacity = '1';
                }, 450);

                setTimeout(() => {
                    vrGogglesGroup.visible = false;
                    vrGogglesGroup.scale.set(0.01, 0.01, 0.01);
                    createMultiverseHUD();
                    
                    cameraRig.position.set(0, 0, 5);
                    flashOverlay.style.opacity = '0';
                }, 750);
            }, 450);
        }

        function createMultiverseHUD() {
            destroyAllHUDs();
            
            const mainContainer = document.createElement('div');
            mainContainer.className = "w-[1200px] flex flex-col gap-6 floating-card";
            mainContainer.innerHTML = `
                <div class="flex justify-between items-center w-full">
                    <button class="interactive-btn self-start bg-black/95 border-4 border-fuchsia-500 text-fuchsia-300 px-8 py-3 rounded-full font-black text-xl flex items-center gap-3 shadow-[0_0_30px_rgba(240,0,255,0.7)] tracking-widest" onclick="exitMultiverse(event)">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER AL INICIO</span>
                    </button>
                </div>

                <div class="w-full neon-box-cyan p-8 flex flex-col justify-between h-[360px] rounded-3xl" style="background-image: linear-gradient(to right, rgba(10,6,24,0.95), rgba(10,6,24,0.6)), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1400&auto=format&fit=crop'); background-size: cover;">
                    <div>
                        <span class="text-sm font-extrabold tracking-widest text-cyan-300 uppercase">MS3 Multiverse Live</span>
                        <h1 class="text-5xl font-black text-white mt-2 drop-shadow-[0_0_20px_#00f0ff]">EL CONCIERTO DEL SIGLO</h1>
                        <p class="text-gray-200 text-base mt-2 max-w-xl leading-relaxed">Experiencia inmersiva 360° en vivo transmitida directamente desde el núcleo del Multiverso MS3.</p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')" class="interactive-btn bg-white text-black px-8 py-3 rounded-2xl font-black text-lg shadow-[0_0_25px_#fff]">REPRODUCIR AHORA</button>
                    </div>
                </div>

                <div class="w-full grid grid-cols-3 gap-6">
                    <button onclick="openVRProgramsMultiverse(event)" class="interactive-btn neon-box-cyan py-5 text-cyan-300 font-black text-lg text-center rounded-2xl">PROGRAMAS VR</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')" class="interactive-btn neon-box-magenta py-5 text-fuchsia-300 font-black text-lg text-center rounded-2xl">PROGRAMAS 2D</button>
                    <button onclick="openVideo('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')" class="interactive-btn neon-box-cyan py-5 text-cyan-300 font-black text-lg text-center rounded-2xl">CANAL EN VIVO</button>
                </div>
            `;

            multiverseHudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(mainContainer);
            cssObject.scale.set(0.0055, 0.0055, 0.0055);
            multiverseHudGroup.add(cssObject);
            
            const isMobile = window.innerWidth <= 768;
            multiverseHudGroup.position.set(0, 0, isMobile ? -5.0 : -4.5);
            cssScene.add(multiverseHudGroup);
        }

        function openVRProgramsMultiverse(e) {
            if (e) e.stopPropagation();
            destroyAllHUDs();

            const vrContainer = document.createElement('div');
            vrContainer.className = "w-[1200px] flex flex-col gap-4 floating-card";
            vrContainer.innerHTML = `
                <div class="flex items-center justify-between">
                    <button class="interactive-btn bg-black/95 border-4 border-fuchsia-500 text-fuchsia-300 px-6 py-2.5 rounded-full font-black text-lg flex items-center gap-3 shadow-[0_0_25px_rgba(240,0,255,0.7)]" onclick="createMultiverseHUD()">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER</span>
                    </button>
                    <h1 class="text-2xl font-black text-white drop-shadow-[0_0_20px_#00f0ff] uppercase tracking-wider">PROGRAMAS VR</h1>
                </div>

                <div class="w-full neon-box-cyan p-5 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-bold text-cyan-300">CATÁLOGO DE PANTALLAS</h3>
                        <span class="text-xs text-fuchsia-400 font-bold uppercase tracking-widest">Selecciona un contenido</span>
                    </div>
                    
                    <div class="netflix-grid">
                        <div class="netflix-card interactive-btn" onclick="openPreview('Cyberpunk City 2099', 'Recorre las calles iluminadas por neón de una metrópolis futurista.', 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500&auto=format&fit=crop" alt="Cyberpunk">
                            <div class="card-info"><h4 class="text-white text-xs font-bold">Cyberpunk 2099</h4><p class="text-fuchsia-300 text-[10px]">Interactivo</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Viaje a Marte 360', 'Explora las dunas rojas y bases espaciales de la próxima frontera.', 'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=500&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
                            <img src="https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=500&auto=format&fit=crop" alt="Marte">
                            <div class="card-info"><h4 class="text-white text-xs font-bold">Viaje a Marte</h4><p class="text-cyan-300 text-[10px]">VR 360°</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Estación Espacial ISS', 'Vive un día completo flotando en órbita terrestre.', 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=500&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
                            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=500&auto=format&fit=crop" alt="ISS">
                            <div class="card-info"><h4 class="text-white text-xs font-bold">Estación ISS</h4><p class="text-cyan-300 text-[10px]">Inmersivo</p></div>
                        </div>
                        <div class="netflix-card interactive-btn" onclick="openPreview('Bosque Bioluminiscente', 'Un santuario natural alienígena interactivo.', 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=500&auto=format&fit=crop', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4')">
                            <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=500&auto=format&fit=crop" alt="Bosque">
                            <div class="card-info"><h4 class="text-white text-xs font-bold">Bosque Místico</h4><p class="text-fuchsia-300 text-[10px]">Relax VR</p></div>
                        </div>
                    </div>
                </div>
            `;

            vrProgramsHudGroup = new THREE.Group();
            const cssObject = new THREE.CSS3DObject(vrContainer);
            cssObject.scale.set(0.0055, 0.0055, 0.0055);
            vrProgramsHudGroup.add(cssObject);
            
            const isMobile = window.innerWidth <= 768;
            vrProgramsHudGroup.position.set(0, 0, isMobile ? -5.0 : -4.5);
            cssScene.add(vrProgramsHudGroup);
        }

        function openAboutSection(e) {
            if (e) e.stopPropagation();
            if (isTopMenuOpen) toggleTopMenu();
            destroyAllHUDs();
            
            isInAboutSection = true;
            logoGroup.visible = false;
            instruction.style.opacity = '0';

            flashOverlay.style.opacity = '1';
            setTimeout(() => { flashOverlay.style.opacity = '0'; }, 300);

            aboutHudGroup = new THREE.Group();
            spinningCoins = [];

            const backWrapper = document.createElement('div');
            backWrapper.className = "w-[1200px] flex flex-col gap-4 floating-card";
            backWrapper.innerHTML = `
                <div class="flex justify-between items-center w-full">
                    <button class="interactive-btn bg-black/95 border-4 border-cyan-400 text-cyan-300 px-8 py-3 rounded-full font-black text-xl flex items-center gap-3 shadow-[0_0_30px_rgba(0,240,255,0.7)] tracking-widest" onclick="exitMultiverse(event)">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>VOLVER AL INICIO</span>
                    </button>
                    <h1 class="text-3xl font-black text-white drop-shadow-[0_0_20px_#00f0ff] uppercase tracking-wider">NOSOTROS - UNIVERSO 360</h1>
                </div>
            `;
            const backObj = new THREE.CSS3DObject(backWrapper);
            backObj.scale.set(0.0055, 0.0055, 0.0055);
            backObj.position.set(0, 3.2, -4.5);
            aboutHudGroup.add(backObj);

            const screenData = [
                { title: "INNOVACIÓN VR", desc: "Tecnología de punta aplicada al entretenimiento inmersivo.", img: "https://images.unsplash.com/photo-1593508512255-86ab42a8e620?q=80&w=400&auto=format&fit=crop", angle: 0 },
                { title: "MULTIVERSO MS3", desc: "Plataforma de streaming y experiencias visuales ilimitadas.", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop", angle: Math.PI / 2 },
                { title: "ARTE Y ESCENA", desc: "Fusión perfecta entre el arte escénico profesional y la realidad virtual.", img: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=400&auto=format&fit=crop", angle: Math.PI },
                { title: "FUTURO DIGITAL", desc: "Creando mundos interactivos accesibles desde cualquier dispositivo.", img: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=400&auto=format&fit=crop", angle: (3 * Math.PI) / 2 }
            ];

            const radius = 4.2;

            screenData.forEach((data, index) => {
                const screenDiv = document.createElement('div');
                screenDiv.className = "neon-box-cyan p-6 flex flex-col items-center justify-between text-center floating-card w-[320px] h-[480px] rounded-3xl";
                screenDiv.innerHTML = `
                    <div class="w-full flex flex-col items-center gap-2 mt-4">
                        <span class="text-xs font-extrabold text-cyan-300 tracking-widest uppercase">MS3 PROFILE 0${index + 1}</span>
                        <h2 class="text-2xl font-black text-white drop-shadow-[0_0_10px_#00f0ff]">${data.title}</h2>
                    </div>
                    <div class="w-28 h-28 my-auto relative flex items-center justify-center"></div>
                    <p class="text-gray-300 text-sm leading-relaxed mb-4">${data.desc}</p>
                `;

                const screenObj = new THREE.CSS3DObject(screenDiv);
                screenObj.scale.set(0.0042, 0.0042, 0.0042);
                
                const xPos = Math.sin(data.angle) * radius;
                const zPos = -Math.cos(data.angle) * radius;
                screenObj.position.set(xPos, -0.2, zPos);
                screenObj.lookAt(0, -0.2, 0);
                aboutHudGroup.add(screenObj);

                const coinGroup = new THREE.Group();
                coinGroup.position.set(xPos, -0.2, zPos);
                coinGroup.rotation.y = data.angle;

                const goldMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffd700, metalness: 0.9, roughness: 0.2,
                    emissive: 0x332200, emissiveIntensity: 0.2, side: THREE.DoubleSide
                });

                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                function drawCoinFace(isVR) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.fillStyle = '#b38600';
                    ctx.beginPath(); ctx.arc(256, 256, 240, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffdf33';
                    ctx.beginPath(); ctx.arc(256, 256, 220, 0, Math.PI * 2); ctx.fill();

                    if (!isVR) {
                        ctx.fillStyle = '#805d00';
                        ctx.font = 'bold 90px Inter';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('MS3', 256, 230);
                        ctx.font = 'bold 35px Inter';
                        ctx.fillText('VR WORLD', 256, 310);
                    } else {
                        ctx.fillStyle = '#00f0ff';
                        ctx.fillRect(136, 196, 240, 120);
                        ctx.fillStyle = '#000';
                        ctx.beginPath(); ctx.arc(206, 256, 40, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(306, 256, 40, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#f000ff';
                        ctx.font = 'bold 30px Inter';
                        ctx.textAlign = 'center';
                        ctx.fillText('VR GOGGLES', 256, 360);
                    }
                }

                drawCoinFace(false);
                const textureImage = new THREE.CanvasTexture(canvas);
                const coinFaceMat = new THREE.MeshStandardMaterial({ map: textureImage, metalness: 0.7, roughness: 0.3 });
                
                const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.15, 48);
                coinGeo.rotateX(Math.PI / 2);
                
                const coinMesh = new THREE.Mesh(coinGeo, [goldMaterial, coinFaceMat, coinFaceMat]);
                coinGroup.add(coinMesh);
                aboutHudGroup.add(coinGroup);

                spinningCoins.push({
                    group: coinGroup,
                    canvas: canvas,
                    ctx: ctx,
                    texture: textureImage,
                    angleAccumulator: index * 1.5,
                    isCurrentlyVR: false
                });
            });

            cssScene.add(aboutHudGroup);
        }

        function destroyAllHUDs() {
            if (multiverseHudGroup) { 
                cssScene.remove(multiverseHudGroup); 
                multiverseHudGroup.traverse((child) => { if (child.element) child.element.remove(); });
                multiverseHudGroup = null; 
            }
            if (vrProgramsHudGroup) { 
                cssScene.remove(vrProgramsHudGroup); 
                vrProgramsHudGroup.traverse((child) => { if (child.element) child.element.remove(); });
                vrProgramsHudGroup = null; 
            }
            if (aboutHudGroup) { 
                cssScene.remove(aboutHudGroup); 
                aboutHudGroup.traverse((child) => { if (child.element) child.element.remove(); });
                aboutHudGroup = null; 
            }
            spinningCoins = [];
            isInAboutSection = false;
        }

        function openPreview(title, desc, imgUrl, videoUrl) {
            selectedVideoData = videoUrl;
            document.getElementById('preview-title').innerText = title;
            document.getElementById('preview-desc').innerText = desc;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function playFromPreview() {
            closePreviewModal();
            if (selectedVideoData) {
                openVideo(selectedVideoData);
            }
        }

        function openVideo(url) {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('active-video');
            video.src = url;
            modal.style.display = 'flex';
            video.play();
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('active-video');
            video.pause();
            video.src = '';
            modal.style.display = 'none';
        }

        function exitMultiverse(e) {
            if (e) e.stopPropagation();
            destroyAllHUDs();
            
            logoGroup.visible = true;
            instruction.style.opacity = '1';
            isSystemActive = false;
            isInAboutSection = false;
            
            gsap.fromTo(logoGroup.scale, { x: 0.01, y: 0.01, z: 0.01 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: "power2.out" });
            gsap.to(cameraRig.position, { z: 5, duration: 1.0, ease: "power2.inOut" });
        }

        function toggleVRMode() {
            isVRMode = !isVRMode;
            document.body.classList.toggle('vr-mode', isVRMode);
            document.getElementById('vr-btn-text').innerText = isVRMode ? 'SALIR DE VR' : 'VER EN VR';
            
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (isVRMode) {
                rendererLeft.setSize(w / 2, h);
                rendererRight.setSize(w / 2, h);
                cssRendererLeft.setSize(w / 2, h);
                cssRendererRight.setSize(w / 2, h);
                cameraLeft.aspect = (w / 2) / h;
                cameraRight.aspect = (w / 2) / h;
                cameraLeft.updateProjectionMatrix();
                cameraRight.updateProjectionMatrix();
            } else {
                rendererLeft.setSize(w, h);
                rendererRight.setSize(w, h);
                cssRendererLeft.setSize(w, h);
                cssRendererRight.setSize(w, h);
                cameraLeft.aspect = w / h;
                cameraRight.aspect = w / h;
                cameraLeft.updateProjectionMatrix();
                cameraRight.updateProjectionMatrix();
            }
            toggleTopMenu();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (starField) starField.rotation.y += 0.0005;
            
            if (logoGroup && !isSystemActive && !isInAboutSection && logoGroup.visible) {
                logoGroup.rotation.y += 0.012; 
            }

            if (isInAboutSection && spinningCoins.length > 0) {
                spinningCoins.forEach(coin => {
                    coin.angleAccumulator += 0.03;
                    coin.group.rotation.y += 0.03;

                    const normalizedAngle = Math.abs(Math.sin(coin.angleAccumulator));
                    const shouldBeVR = normalizedAngle < 0.25;

                    if (shouldBeVR !== coin.isCurrentlyVR) {
                        coin.isCurrentlyVR = shouldBeVR;
                        
                        coin.ctx.clearRect(0, 0, 512, 512);
                        coin.ctx.fillStyle = '#ffcc00';
                        coin.ctx.fillRect(0, 0, 512, 512);
                        coin.ctx.fillStyle = '#b38600';
                        coin.ctx.beginPath(); coin.ctx.arc(256, 256, 240, 0, Math.PI * 2); coin.ctx.fill();
                        coin.ctx.fillStyle = '#ffdf33';
                        coin.ctx.beginPath(); coin.ctx.arc(256, 256, 220, 0, Math.PI * 2); coin.ctx.fill();

                        if (!coin.isCurrentlyVR) {
                            coin.ctx.fillStyle = '#805d00';
                            coin.ctx.font = 'bold 90px Inter';
                            coin.ctx.textAlign = 'center';
                            coin.ctx.textBaseline = 'middle';
                            coin.ctx.fillText('MS3', 256, 230);
                            coin.ctx.font = 'bold 35px Inter';
                            coin.ctx.fillText('VR WORLD', 256, 310);
                        } else {
                            coin.ctx.fillStyle = '#00f0ff';
                            coin.ctx.fillRect(156, 216, 200, 90);
                            coin.ctx.fillStyle = '#000';
                            coin.ctx.beginPath(); coin.ctx.arc(216, 261, 30, 0, Math.PI * 2); coin.ctx.fill();
                            coin.ctx.beginPath(); coin.ctx.arc(296, 261, 30, 0, Math.PI * 2); coin.ctx.fill();
                            coin.ctx.fillStyle = '#f000ff';
                            coin.ctx.font = 'bold 28px Inter';
                            coin.ctx.textAlign = 'center';
                            coin.ctx.fillText('VR GOGGLES', 256, 340);
                        }
                        coin.texture.needsUpdate = true;
                    }
                });
            }

            if (!isGyroActive) {
                currentRotationX += (targetRotationX - currentRotationX) * 0.1;
                currentRotationY += (targetRotationY - currentRotationY) * 0.1;
                cameraRig.rotation.y = currentRotationY;
                cameraRig.rotation.x = currentRotationX;
            }

            rendererLeft.render(scene, isVRMode ? cameraLeft : camera);
            cssRendererLeft.render(cssScene, isVRMode ? cameraLeft : camera);

            if (isVRMode) {
                rendererRight.render(scene, cameraRight);
                cssRendererRight.render(cssScene, cameraRight);
            }
        }
        animate();
    </script>
</body>
</html>
