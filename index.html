<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video RV - Inmersión en Esfera</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Interfaz de controles flotantes */
        .vr-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .vr-btn {
            background: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .vr-btn:hover {
            background: #ff3377;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="instructions">Haz clic y arrastra para explorar el entorno 360°</div>
    <div id="webgl-container"></div>

    <!-- Controles de Reproducción -->
    <div class="vr-ui">
        <button class="vr-btn" id="playBtn">Reproducir</button>
        <button class="vr-btn" id="fullscreenBtn">Pantalla Completa</button>
    </div>

    <!-- Video oculto que sirve de textura para la esfera -->
    <video id="videoSource" loop crossorigin="anonymous" playsinline style="display:none;">
        <!-- Reemplaza la URL con tu video en formato equirectangular 360 -->
        <source src="https://threejs.org/examples/textures/pano.webm" type="video/webm">
        Tu navegador không soporta video HTML5.
    </video>

    <!-- Importación de Three.js y OrbitControls mediante ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, video, texture, sphere;
        let isUserInteracting = false;

        init();
        animate();

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Crear la Escena
            scene = new THREE.Scene();

            // 2. Crear la Cámara en el centro de la esfera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            camera.target = new THREE.Vector3(0, 0, 0);

            // 3. Obtener el elemento de video y preparar la textura WebGL
            video = document.getElementById('videoSource');
            texture = new THREE.VideoTexture(video);
            texture.colorSpace = THREE.SRGBColorSpace;

            // 4. Crear la Esfera Geométrica e invertir las normales (-1 en escala X) para verla por dentro
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); 

            const material = new THREE.MeshBasicMaterial({ map: texture });
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // 5. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 6. Controles orbitales para mover la vista con el mouse o táctil
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false; // Evitar zoom para mantener la inmersión fija en el centro
            controls.enablePan = false;
            controls.rotateSpeed = -0.5; // Invertir para naturalidad de giro interno

            // Eventos de la Interfaz
            const playBtn = document.getElementById('playBtn');
            playBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    playBtn.textContent = 'Pausar';
                } else {
                    video.pause();
                    playBtn.textContent = 'Reproducir';
                }
            });

            const fullscreenBtn = document.getElementById('fullscreenBtn');
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
