<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS3 - Universo 3D</title>
  <!-- Three.js para el Logo 3D y el Universo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #05020a;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* HEADER Y LOGO 3D */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 40px;
      display: flex;
      align-items: center;
      z-index: 10;
      background: rgba(5, 2, 10, 0.7);
      backdrop-filter: blur(8px);
    }

    /* Contenedor interactivo del Canvas 3D del Logo */
    #logo-3d-container {
      width: 70px;
      height: 70px;
      cursor: pointer;
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 3px;
      margin-left: 10px;
      background: linear-gradient(45deg, #ff007f, #b026ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    /* SECCIONES */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    #inicio {
      background: radial-gradient(circle at center, #1a0933 0%, #05020a 100%);
    }

    #metaverso-ms3 {
      background: radial-gradient(circle at center, #2a0845 0%, #05020a 100%);
      border-top: 1px solid rgba(255, 0, 127, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 3.5rem;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.5));
      margin-bottom: 15px;
    }

    p {
      max-width: 600px;
      color: #d1c4e9;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .hint {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #ff007f;
      border: 1px solid #ff007f;
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    /* CANVAS TRANSICIÓN UNIVERSO */
    #universe-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transition: opacity 0.5s ease;
      background: #000;
    }

    #universe-canvas.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>

  <!-- HEADER CON LOGO 3D GIRATORIO -->
  <header>
    <div id="logo-3d-container" title="Haz clic para entrar al Metaverso"></div>
    <span class="brand-title">MS3</span>
  </header>

  <!-- CANVAS EFECTO TRANSICIÓN DE UNIVERSO -->
  <canvas id="universe-canvas"></canvas>

  <!-- INICIO -->
  <section id="inicio">
    <h1>Experiencia MS3 3D</h1>
    <p>Plataforma interactiva con estética cyberpunk y futurista.</p>
    <div class="hint">↖ Presiona el logo 3D rosa/violeta para viajar al Metaverso</div>
  </section>

  <!-- DESTINO METAVERSO -->
  <section id="metaverso-ms3">
    <h2>METAVERSO MS3</h2>
    <p>Bienvenido a la dimensión inmersiva. El salto hiperespacial se ha completado con éxito.</p>
  </section>

  <script>
    /* ===================================================
       1. RENDERIZADO DEL LOGO MS3 EN 3D (ROSA / VIOLETA)
       =================================================== */
    const logoContainer = document.getElementById('logo-3d-container');
    
    // Escena, cámara y renderer para el logo
    const logoScene = new THREE.Scene();
    const logoCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    logoCamera.position.z = 4.5;

    const logoRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    logoRenderer.setSize(70, 70);
    logoContainer.appendChild(logoRenderer.domElement);

    // Creación del Objeto 3D del Logo (Geometría Futuro-Hexagonal con Anillos)
    const logoGroup = new THREE.Group();

    // Núcleo Diamante / Cristalino
    const coreGeo = new THREE.OctahedronGeometry(1.2, 0);
    const coreMat = new THREE.MeshPhongMaterial({
      color: 0xff007f,
      emissive: 0x4a0033,
      shininess: 100,
      flatShading: true
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    logoGroup.add(coreMesh);

    // Anillo exterior Violeta Neón
    const ringGeo = new THREE.TorusGeometry(1.7, 0.08, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xb026ff, wireframe: true });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 3;
    logoGroup.add(ringMesh);

    logoScene.add(logoGroup);

    // Iluminación Rosa / Violeta
    const light1 = new THREE.PointLight(0xff007f, 2, 50);
    light1.position.set(5, 5, 5);
    logoScene.add(light1);

    const light2 = new THREE.PointLight(0xb026ff, 2, 50);
    light2.position.set(-5, -5, 5);
    logoScene.add(light2);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    logoScene.add(ambientLight);

    // Animación de Rotación 360 sobre su propio eje
    function animateLogo() {
      requestAnimationFrame(animateLogo);
      logoGroup.rotation.y += 0.015;
      ringMesh.rotation.z -= 0.01;
      logoRenderer.render(logoScene, logoCamera);
    }
    animateLogo();


    /* ===================================================
       2. EFECTO UNIVERSO (CANVAS TRANSICIÓN HIPERESPACIO)
       =================================================== */
    const canvas = document.getElementById('universe-canvas');
    const ctx = canvas.getContext('2d');
    const targetSection = document.getElementById('metaverso-ms3');

    let stars = [];
    let speed = 2;
    let isTransitioning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Generar estrellas iniciales
    for (let i = 0; i < 900; i++) {
      stars.push({
        x: (Math.random() - 0.5) * canvas.width * 2,
        y: (Math.random() - 0.5) * canvas.height * 2,
        z: Math.random() * canvas.width
      });
    }

    // Dibujar Túnel Estelar en Canvas 2D
    function drawUniverse() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      stars.forEach(star => {
        star.z -= speed;
        if (star.z <= 0) star.z = canvas.width;

        const k = 128 / star.z;
        const px = star.x * k + cx;
        const py = star.y * k + cy;

        if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
          const size = (1 - star.z / canvas.width) * 3.5;
          // Estrellas en tonos Neón Magenta y Violeta durante el viaje
          ctx.fillStyle = speed > 15 ? '#ff007f' : '#b026ff';
          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (isTransitioning) {
        requestAnimationFrame(drawUniverse);
      }
    }

    /* ===================================================
       3. ACTIVACIÓN AL HACER CLIC EN EL LOGO 3D
       =================================================== */
    logoContainer.addEventListener('click', () => {
      if (isTransitioning) return;

      isTransitioning = true;
      speed = 2;
      canvas.classList.add('active');
      drawUniverse();

      // Transición tipo túnel al espacio / hiperespacio
      let accel = setInterval(() => {
        speed += 3;
        if (speed > 60) {
          clearInterval(accel);
          
          // Desplazamiento a la sección del metaverso
          targetSection.scrollIntoView({ behavior: 'smooth' });

          // Finalizar y desvanecer el fondo espacial
          setTimeout(() => {
            canvas.classList.remove('active');
            setTimeout(() => {
              isTransitioning = false;
              speed = 2;
            }, 500);
          }, 600);
        }
      }, 25);
    });
  </script>
</body>
</html>
