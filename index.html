<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscando a la Futura Vedette</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      padding: 20px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      background-color: #000;
    }
    button {
      background-color: #e91e63;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #c2185b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Buscando a la Futura Vedette</h1>
    
    <!-- Botón para reproducir -->
    <button id="btnReproducir">Reproducir Video</button>

    <!-- Elemento de video con la ruta especificada -->
    <video id="videoVedette" controls>
      <source src="ms3media/vedette360_web.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de video.
    </video>
  </div>

  <script>
    const boton = document.getElementById('btnReproducir');
    const video = document.getElementById('videoVedette');

    boton.addEventListener('click', () => {
      // Reproduce el video si está pausado o detenido
      if (video.paused) {
        video.play().catch(error => {
          console.log("Error al intentar reproducir el video:", error);
        });
      }
    });
  </script>

</body>
</html>
